<script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // 1. Cargar Header y configurar banner
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                window.igBannerConfig = {
                    lang: 'es',
                    igr: 'gamer-97d22e',
                    banners: ['my-banner']
                };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);

                verificarSesion(); // Llamamos aquí tras inyectar el HTML
            })
            .catch(error => console.error('Error al cargar la cabecera:', error));

        // 2. Cargar Footer
        fetch('/footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data);
            
        // 3. Cargar el Modal de Login
        fetch('/login-modal.html')
            .then(res => res.text())
            .then(data => document.body.insertAdjacentHTML('beforeend', data));
    });

    // --- FUNCIONES (Fuera del DOMContentLoaded) ---

    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) {
            modal.style.display = 'block';
        } else {
            console.warn("El modal de login aún no está cargado.");
        }
    }

    function verificarSesion(intentos = 0) {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        } else if (intentos < 10) { 
            // Solo reintenta 10 veces para no bloquear el navegador
            setTimeout(() => verificarSesion(intentos + 1), 100);
        }
    }
</script>

        };

        const LOGOS_ESCUDERIAS = {
            1: '/logos/redbull.png', 
            2: '/logos/ferrari.png', 
            3: '/logos/mercedes.png', 
            4: '/logos/mclaren.png',

function irA(evento, idSeccion) {
    // 1. Ocultar todas las secciones
    document.querySelectorAll('.seccion').forEach(s => {
        s.style.display = 'none';
        s.classList.remove('activa');
    });
    
    // 2. Desactivar todos los botones
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    // 3. Mostrar la sección destino
    const seccionDestino = document.getElementById(idSeccion);
    if (seccionDestino) {
        seccionDestino.style.display = 'block';
        seccionDestino.classList.add('activa');
    }
    
    // 4. Activar el botón clicado
    if (evento && evento.currentTarget) {
        evento.currentTarget.classList.add('active');
    }
    
    // 5. NUEVO: Llamar a la carga de datos según la sección
    if (idSeccion === 'seccion-circuitos') {
        cargarCircuitos();
    } else if (idSeccion !== 'panel-admin') {
        // Solo cargar datos generales si no es panel admin
        cargarTodosLosDatos();
    }
}



// AQUI EMPIEZA EL CARGAR TODOS LOS DATOS

async function cargarTodosLosDatos() {
    try {
        const res = await fetch('/api/lista-de-pilotos');
        if (!res.ok) return;
        listaPilotosGlobal = await res.json();
        
        const resResultados = await fetch('/api/todos-los-resultados');
        const resultados = await resResultados.json();

        // 1. CÁLCULO DINÁMICO DE VICTORIAS Y PODIOS
        listaPilotosGlobal.forEach(p => {
            p.podios = resultados.filter(r => r.piloto_id === p.id && r.posicion <= 3).length;
            p.victorias = resultados.filter(r => r.piloto_id === p.id && r.posicion === 1).length;
        });

        // 2. SEPARACIÓN Y ORDENACIÓN (Solo los titulares afectan al ranking)
        const titulares = listaPilotosGlobal.filter(p => !p.es_reserva)
                                           .sort((a, b) => b.puntos_totales - a.puntos_totales);
        
        const reservas = listaPilotosGlobal.filter(p => p.es_reserva)
                                          .sort((a, b) => b.puntos_totales - a.puntos_totales);

        // 3. RENDERIZADO TITULARES
        const tPilotos = document.getElementById('tabla-pilotos');
        if (tPilotos) {
            tPilotos.innerHTML = '';
            titulares.forEach((p, index) => {
                const avatarUrl = p.foto_url && p.foto_url.trim() !== '' ? p.foto_url : FOTO_POR_DEFECTO;
                const logoUrl = LOGOS_ESCUDERIAS[p.escuderia_id] || '';
                tPilotos.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <div class="piloto-contenedor">
                                <img src="${avatarUrl}" class="piloto-avatar" alt="Avatar">
                                <span class="numero-dorsal">${p.numero_piloto || '0'}</span>
                                <strong>${p.gamertag}</strong>
                            </div>
                        </td>
                        <td><span class="plataforma ${p.plataforma}">${p.plataforma}</span></td>
                        <td>${logoUrl ? `<img src="${logoUrl}" style="width:25px; height:25px; vertical-align:middle;"> ` : ''} ${NOMBRES_ESCUDERIAS[p.escuderia_id] || 'Sin equipo'}</td>
                        <td>${p.victorias}</td>
                        <td>${p.podios || '0'}</td>
                        <td><strong>${p.puntos_totales} pts</strong></td>
                    </tr>`;
            });
        }

// 4. RENDERIZADO RESERVAS
const tReservas = document.getElementById('tabla-reservas');
if (tReservas) {
    tReservas.innerHTML = '';
    reservas.forEach((p) => {
        const avatarUrl = p.foto_url && p.foto_url.trim() !== '' ? p.foto_url : FOTO_POR_DEFECTO;
        tReservas.innerHTML += `
            <tr>
                <td><span class="label-sc">S/C</span></td>
                <td>
                    <div class="piloto-contenedor">
                        <img src="${avatarUrl}" class="piloto-avatar" alt="Avatar">
                        <span class="numero-dorsal">${p.numero_piloto || '0'}</span>
                        <strong>${p.gamertag}</strong>
                    </div>
                </td>
                <td><span class="plataforma ${p.plataforma}">${p.plataforma}</span></td>
                <!-- AQUÍ ESTABA EL ERROR, AÑADIMOS LA CELDA DE ESCUDERÍA -->
                <td><span style="color: #CCFF00;">[ RESERVA ]</span></td>
                <td>${p.victorias}</td>
                <td>${p.podios || '0'}</td>
                <td><strong>${p.puntos_totales} pts</strong></td>
            </tr>`;
    });
}

        // 5. TABLA CONSTRUCTORES (Usamos el array 'titulares' para no incluir reservas)
        const constructoresMap = {};
        titulares.forEach(p => {
            if (p.escuderia_id) {
                if (!constructoresMap[p.escuderia_id]) {
                    constructoresMap[p.escuderia_id] = { puntos: 0, color: p.color_hex, podios: 0, victorias: 0, pilotosFotos: [] };
                }
                constructoresMap[p.escuderia_id].puntos += (Number(p.puntos_totales) || 0);
                constructoresMap[p.escuderia_id].podios += (Number(p.podios) || 0);
                constructoresMap[p.escuderia_id].victorias += (Number(p.victorias) || 0);
                constructoresMap[p.escuderia_id].pilotosFotos.push(p.foto_url || FOTO_POR_DEFECTO);
            }
        });

        const listaConstructores = Object.keys(constructoresMap)
            .map(id => ({ nombre: NOMBRES_ESCUDERIAS[id], ...constructoresMap[id], id: id }))
            .sort((a, b) => b.puntos - a.puntos);

        const tConst = document.getElementById('tabla-constructores');
        if (tConst) {
            tConst.innerHTML = '';
            listaConstructores.forEach((c, index) => {
                const logoUrl = LOGOS_ESCUDERIAS[c.id] || '';
                const fotosHtml = c.pilotosFotos.map(url => `<img src="${url}" class="mini-avatar">`).join('');
                tConst.innerHTML += `<tr><td>${index+1}</td><td style="border-left: 6px solid ${c.color || '#444'} !important;">${logoUrl ? `<img src="${logoUrl}" style="width:25px; vertical-align:middle;">` : ''} ${c.nombre}</td><td>${fotosHtml}</td><td>${c.victorias}</td><td>${c.podios}</td><td><strong>${c.puntos} pts</strong></td></tr>`;
            });
        }

        // 6. TABLA SANCIONES
        const tSanciones = document.getElementById('tabla-sanciones');
        if(tSanciones) {
            tSanciones.innerHTML = '';
            listaPilotosGlobal.forEach(p => {
                const licenciaActual = 12 - (p.puntos_sancion || 0);
                const estado = licenciaActual <= 0 ? '<span style="color:red; font-weight:bold;">SUSPENDIDO</span>' : '🟢 Licencia OK';
                tSanciones.innerHTML += `<tr><td>${p.gamertag}</td><td>${p.es_reserva ? 'Reserva' : NOMBRES_ESCUDERIAS[p.escuderia_id]}</td><td>${licenciaActual} / 12</td><td>${estado}</td></tr>`;
            });
        }

    } catch (e) {
        console.error("Error al cargar:", e);
    }
}

async function cargarDesplegablesAdmin() {
    // 1. Verificación de seguridad
    if (localStorage.getItem('rol') !== 'admin') return;

    try {
        // Carga paralela de datos (más rápido)
        const [resC, resP] = await Promise.all([
            fetch('/api/circuitos'),
            fetch('/api/lista-de-pilotos')
        ]);
        
        const circuitos = await resC.json();
        const pilotos = await resP.json();
        pilotos.sort((a, b) => a.numero_piloto - b.numero_piloto);

        // Rellenar Circuitos
        const selCircuito = document.getElementById('select-circuito-admin');
        if (selCircuito) {
            selCircuito.innerHTML = '<option value="">-- Selecciona circuito --</option>' + 
                                    circuitos.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        }

        // Rellenar Pilotos (usando querySelector para evitar errores si el ID no existe en el HTML actual)
        const ids = ['select-piloto', 'select-piloto-sancion', 'select-piloto-eliminar', 'select-piloto-editar', 'select-piloto-admin'];

        ids.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = '<option value="">-- Selecciona un piloto --</option>' +
                               pilotos.map(p => `<option value="${p.id}">#${p.numero_piloto} - ${p.gamertag}</option>`).join('');
            }
        });
        console.log("Desplegables cargados correctamente.");
    } catch (err) {
        console.error("Error al cargar desplegables:", err);
    }
}


    function autocompletarFormEdicion() {
        const idBuscar = parseInt(document.getElementById('select-piloto-editar').value);
        const piloto = listaPilotosGlobal.find(p => p.id === idBuscar);
        if(piloto) {
            document.getElementById('edit-gamertag').value = piloto.gamertag;
            document.getElementById('edit-numero').value = piloto.numero_piloto || '';
            document.getElementById('edit-foto').value = piloto.foto_url || '';
            document.getElementById('edit-plataforma').value = piloto.plataforma;
            document.getElementById('edit-escuderia').value = piloto.escuderia_id || '1';
            document.getElementById('edit-es_reserva').value = piloto.es_reserva || '0';
        }
    }

    document.getElementById('form-piloto').addEventListener('submit', async (e) => {
        e.preventDefault();
        const datos = { 
            gamertag: document.getElementById('gamertag').value, 
            numero_piloto: parseInt(document.getElementById('numero_piloto').value),
            foto_url: document.getElementById('foto_url').value,
            plataforma: document.getElementById('plataforma').value, 
            escuderia_id: parseInt(document.getElementById('escuderia_id').value),
            es_reserva: parseInt(document.getElementById('es_reserva').value)
        };
        const res = await fetch('/api/nuevo-piloto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
        if(res.ok) { 
            document.getElementById('msg-piloto').innerText = "¡Piloto inscrito con éxito!"; 
            document.getElementById('form-piloto').reset(); 
            await cargarTodosLosDatos(); 
            await cargarDesplegablesAdmin(); 
        }
    });

    document.getElementById('form-editar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const datos = {
            id: parseInt(document.getElementById('select-piloto-editar').value),
            gamertag: document.getElementById('edit-gamertag').value,
            numero_piloto: parseInt(document.getElementById('edit-numero').value),
            foto_url: document.getElementById('edit-foto').value,
            plataforma: document.getElementById('edit-plataforma').value,
            escuderia_id: parseInt(document.getElementById('edit-escuderia').value),
            es_reserva: parseInt(document.getElementById('edit-es_reserva').value)
        };
        if(!datos.id) return;
        const res = await fetch('/api/editar-piloto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
        if(res.ok) {
            document.getElementById('msg-editar').innerText = "¡Piloto actualizado con éxito!";
            document.getElementById('form-editar').reset();
            await cargarTodosLosDatos();
            await cargarDesplegablesAdmin();
            setTimeout(() => { document.getElementById('msg-editar').innerText = ""; }, 3000);
        }
    });

async function cargarCircuitos() {
    try {
        const res = await fetch('/api/circuitos');
        const circuitosRaw = await res.json();
        const resResultados = await fetch('/api/todos-los-resultados');
        const resultados = await resResultados.json();
        const contenedor = document.getElementById('lista-circuitos');
        
        const listaMaestra = [
            { nombre: "Melbourne", archivo: "melburne" }, { nombre: "Shanghái", archivo: "sangai" },
            { nombre: "Suzuka", archivo: "suzuka" }, { nombre: "Sakhir", archivo: "sakir" },
            { nombre: "Yeda", archivo: "yeda" }, { nombre: "Miami", archivo: "miami" },
            { nombre: "Montreal", archivo: "monreal" }, { nombre: "Mónaco", archivo: "montecarlo" },
            { nombre: "Barcelona", archivo: "barcelona" }, { nombre: "Spielberg", archivo: "spilberg" },
            { nombre: "Silverstone", archivo: "silverstone" }, { nombre: "Spa", archivo: "spa" },
            { nombre: "Budapest", archivo: "budapest" }, { nombre: "Zandvoort", archivo: "zandvoort" },
            { nombre: "Monza", archivo: "monza" }, { nombre: "Madrid", archivo: "madrid" },
            { nombre: "Bakú", archivo: "baku" }, { nombre: "Singapur", archivo: "singapur" },
            { nombre: "Austin", archivo: "austin" }, { nombre: "Ciudad de México", archivo: "mejico" },
            { nombre: "São Paulo", archivo: "saopaulo" }, { nombre: "Las Vegas", archivo: "lasvegas" },
            { nombre: "Losail", archivo: "losail" }, { nombre: "Abu Dabi", archivo: "abudabi" }
        ];

        // Función renderAcciones con la clase 'admin-only'
        const renderAcciones = (id) => {
            return `
                <div style="margin-top:2px;" class="admin-only">
                    <button onclick="editarResultado(${id})" style="background:none; border:none; cursor:pointer;">✏️</button>
                    <button onclick="eliminarResultado(${id})" style="background:none; border:none; cursor:pointer; color:#ff4444;">❌</button>
                </div>`;
        };

        contenedor.innerHTML = listaMaestra.map(item => {
            const c = circuitosRaw.find(x => x.nombre === item.nombre || (item.nombre === "Sakhir" && x.nombre === "Bahrein"));
            
            const resultadosCircuito = c ? resultados.filter(r => {
                const circuitoDB = circuitosRaw.find(x => x.id === r.circuito_id);
                return circuitoDB && circuitoDB.nombre === item.nombre;
            }).sort((a, b) => a.posicion - b.posicion) : [];

            const podio = resultadosCircuito.filter(r => r.posicion <= 3);
            const resto = resultadosCircuito.filter(r => r.posicion > 3);
            
            const htmlPodio = podio.map(p => `
                <div style="background: #333; padding: 5px; border-radius: 4px; text-align: center; width: 30%; border-bottom: 3px solid ${p.posicion === 1 ? '#ffd700' : p.posicion === 2 ? '#c0c0c0' : '#cd7f32'}">
                    <strong style="font-size: 16px;">${p.posicion}º</strong> ${renderAcciones(p.id)}<br>
                    <span style="font-size: 11px;">${p.piloto_nombre}</span>
                </div>`).join('');
                
            const htmlResto = resto.map(p => `
                <li style="font-size: 12px; margin-top: 5px; color: #ccc; display:flex; justify-content:space-between;">
                    <span>${p.posicion}º ${p.piloto_nombre}</span>
                    ${renderAcciones(p.id)}
                </li>`).join('');
            
            return `<div style="background: #262626; padding: 15px; border-radius: 5px; border-left: 4px solid #e10600; margin-bottom: 15px;">
                        <h3 style="margin: 0 0 10px 0; color: #fff;">${item.nombre}</h3>
                        <img src="/circuitos/${item.archivo}.png" alt="${item.nombre}" style="width: 100%; height: 120px; object-fit: contain; background: #1a1a1a; border-radius: 5px; margin-bottom: 10px;" onerror="this.style.display='none'">
                        ${podio.length > 0 ? `<div style="display: flex; gap: 5px; margin-bottom: 10px;">${htmlPodio}</div>` : '<p style="color:#666; font-size: 12px;">Sin resultados aún</p>'}
                        <ul style="list-style: none; padding: 0; margin: 0;">${htmlResto}</ul>
                    </div>`;
        }).join('');

        // --- ESTA ES LA LÍNEA CLAVE ---
        // Se ejecuta justo después de que el HTML de los botones ya existe
        if (typeof aplicarPermisos === 'function') {
            aplicarPermisos();
        }

    } catch (err) {
        console.error("Error al cargar circuitos:", err);
    }
}

async function eliminarResultado(id) {
    if (!confirm('¿Estás seguro de que quieres borrar este resultado?')) return;
    
    const res = await fetch(`/api/resultados/${id}`, { method: 'DELETE' });
    if (res.ok) {
        alert('Resultado eliminado correctamente');
        cargarCircuitos(); // Recargamos para ver los cambios
    } else {
        alert('Error: No se pudo eliminar. Verifica tus permisos.');
    }
}

async function editarResultado(id) {
    const nuevaPos = prompt("Introduce la nueva posición para el piloto:");
    if (!nuevaPos) return;
    
    const res = await fetch(`/api/resultados/${id}`, { 
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ posicion: parseInt(nuevaPos) })
    });
    
    if (res.ok) {
        alert('Resultado actualizado');
        cargarCircuitos();
    } else {
        alert('Error al actualizar');
    }
}

async function notificarDiscord(titulo, descripcion, autor) {

    const payload = {

        embeds: [{
            title: titulo,
            description: `${descripcion}\n\n👉 [Haz clic aquí para ver la noticia completa](${webUrl})`,
            color: 16711680,
