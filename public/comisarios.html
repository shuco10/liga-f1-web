<html lang="es">
<head>

    <!-- Icono para la pestaña del navegador -->

    <title>Comisarios | Cazadores de Curvas</title>
    <!-- Enlace al archivo de estilos compartido -->

    <style>

  <body>
    <div id="header-placeholder"></div>
<div class="titulo-liga">👔 EQUIPO DE COMISARIOS 👔</div>
      <!-- boton para abrir modales -->
<div id="panel-comisarios" style="display: none; text-align: center; padding: 20px;">
    <button onclick="abrirModalResultados()" 
            style="padding: 15px 30px; background: #ff4444; color: white; border: none; cursor: pointer; font-size: 1.1em; border-radius: 5px;">
        <i class="fa-solid fa-plus"></i> Cargar Resultado
    </button>
</div>

<div id="login-aviso" style="display: none; text-align: center; padding: 50px; background: #222; margin: 20px auto; max-width: 600px; border-radius: 10px; border: 1px solid #444;">
    <h2 style="color: #ff4444;">⚠️ Acceso Restringido</h2>
    <p>Debes haber iniciado sesión para acceder al panel de Comisarios.</p>
    <button onclick="seguridadAbrirModal()" style="padding: 10px 20px; background: #ff4444; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold;">Iniciar Sesión</button>
</div>

<div id="panel-comisarios" style="display: none;">
    </div>

      
<!-- Modal para meter resultados de las carreras -->

<div id="modal-resultados" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
    <div style="background:#222; color:white; width: 400px; margin: 100px auto; padding: 20px; border-radius: 10px;">
        <h3 style="text-align:center;">🏁 CARGAR RESULTADOS 🏁</h3>
        
        <label>Circuito:</label>
        <select id="select-gp" style="width:100%; margin-bottom:10px; padding:5px;"></select>
        
        <label>Piloto:</label>
        <select id="select-piloto" onchange="checkReserva()" style="width:100%; margin-bottom:10px; padding:5px;"></select>
        
        <div id="div-escuderia" style="display:none;">
            <label>Escudería que puntúa:</label>
            <select id="select-escuderia" style="width:100%; margin-bottom:10px; padding:5px;"></select>
        </div>

        <label>Posición:</label>
        <input type="number" id="input-posicion" style="width:100%; margin-bottom:20px; padding:5px;">

        <button onclick="guardarResultado()" style="width:100%; padding:10px; background:#ff4444; border:none; color:white; cursor:pointer;">GUARDAR RESULTADO</button>
        <button onclick="document.getElementById('modal-resultados').style.display='none'" style="width:100%; margin-top:5px; padding:5px; background:transparent; border:none; color:#888; cursor:pointer;">Cancelar</button>
    </div>
</div>



      
      <div id="footer-placeholder"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // 1. Cargar Header (ÚNICO FETCH)
    fetch('/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            
            // Configurar Banner de Instant Gaming
            window.igBannerConfig = {
                lang: 'es',
                igr: 'gamer-97d22e',
                banners: ['my-banner']
            };
            const script = document.createElement('script');
            script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
            script.defer = true;
            document.body.appendChild(script);

            // Verificación de sesión justo después de inyectar el HTML
            verificarSesion();
        })
        .catch(error => console.error('Error al cargar la cabecera:', error));

    // 2. Cargar Footer
    fetch('/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data);
        
    // 3. Cargar el Modal de Login
    fetch('/login-modal.html')
        .then(res => res.text())
        .then(data => document.body.insertAdjacentHTML('beforeend', data));
});


// Esta función permite abrir el modal desde cualquier página
    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) {
            modal.style.display = 'block';
        } else {
            console.warn("El modal de login aún no está cargado.");
        }
    }

    

// Función centralizada modificada
 // --- FUNCIONES GLOBALES ---
function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const aviso = document.getElementById('login-aviso');
    const panel = document.getElementById('panel-comisarios');
    
    // Comprobamos el estado del admin
    const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
    
    // Si los botones existen (el DOM ya cargó)
    if (btnLogin && btnLogout) {
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        
        // Si el aviso y el panel existen, controlamos su visibilidad
        if (aviso && panel) {
            aviso.style.display = adminStatus ? 'none' : 'block';
            panel.style.display = adminStatus ? 'block' : 'none';
        }
    } else { 
        // Si no existen todavía, reintentamos
        setTimeout(verificarSesion, 100); 
    }
}



async function guardarResultado() {
    const pilotoId = document.getElementById('select-piloto').value;
    const gpId = document.getElementById('select-gp').value;
    const posicion = document.getElementById('input-posicion').value;
    const escuderiaId = document.getElementById('select-escuderia').value; 

    const res = await fetch('/api/guardar-resultado', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ 
            id_piloto: pilotoId, 
            id_gp: gpId, 
            posicion: parseInt(posicion), 
            escuderia_id: escuderiaId 
        })
    });

    // CAMBIO AQUÍ: leemos como texto en lugar de .json()
    const respuestaTexto = await res.text();

    if (res.ok) {
        alert("¡Éxito! " + respuestaTexto);
        // Opcional: cerrar modal
        document.getElementById('modal-resultados').style.display = 'none';
    } else {
        alert("Error en el servidor: " + respuestaTexto);
    }
}

async function guardarResultado() {
    const pilotoId = document.getElementById('select-piloto').value;
    const gpId = document.getElementById('select-gp').value;
    const posicion = document.getElementById('input-posicion').value;
    const escuderiaId = document.getElementById('select-escuderia').value;

    if (!pilotoId || !gpId || !posicion) {
        alert("Por favor, rellena todos los campos.");
        return;
    }

    const res = await fetch('/api/guardar-resultado', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ 
            id_piloto: pilotoId, 
            id_gp: gpId, 
            posicion: parseInt(posicion), 
            escuderia_id: escuderiaId 
        })
    });

    // --- CAMBIO AQUÍ: Primero leemos como texto ---
    const respuestaTexto = await res.text();

    if (res.ok) {
        // --- Si es OK, probamos si es JSON o solo texto ---
        try {
            const data = JSON.parse(respuestaTexto);
            alert("¡Éxito! Se han sumado " + (data.puntos || "varios") + " puntos.");
        } catch (e) {
            // Si no es JSON (ej. si el servidor devolvió "OK"), mostramos el texto
            alert("Respuesta del servidor: " + respuestaTexto);
        }
    } else {
        alert("Error del servidor: " + respuestaTexto);
    }
}
    
    async function abrirModalResultados() {
    // 1. Mostrar la modal
    document.getElementById('modal-resultados').style.display = 'block';

    try {
        // Hacemos las peticiones para obtener datos frescos
        const [pilotosRes, circuitosRes, escuderiasRes] = await Promise.all([
            fetch('/api/lista-de-pilotos'),
            fetch('/api/circuitos'),
            fetch('/api/escuderias')
        ]);

        const pilotos = await pilotosRes.json();
        const circuitos = await circuitosRes.json();
        const escuderias = await escuderiasRes.json();

        // Rellenar select de circuitos
        document.getElementById('select-gp').innerHTML = 
            circuitos.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

        // Rellenar select de pilotos
        document.getElementById('select-piloto').innerHTML = 
            '<option value="">Selecciona piloto...</option>' + 
            pilotos.map(p => `<option value="${p.id}" data-tipo="${p.es_reserva}">${p.gamertag}</option>`).join('');

        // Rellenar select de escuderías
        document.getElementById('select-escuderia').innerHTML = 
            escuderias.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('');

    } catch (err) {
        console.error("Error al cargar datos:", err);
        alert("Error al cargar pilotos o circuitos.");
    }
}

    function checkReserva() {
    const selectPiloto = document.getElementById('select-piloto');
    const divEscuderia = document.getElementById('div-escuderia');
    
    // Obtenemos la opción seleccionada
    const opcionSeleccionada = selectPiloto.options[selectPiloto.selectedIndex];
    
    // Si el data-tipo es '1' (o el valor que uses para reserva), mostramos el campo
    if (opcionSeleccionada && opcionSeleccionada.getAttribute('data-tipo') === '1') {
        divEscuderia.style.display = 'block';
    } else {
        divEscuderia.style.display = 'none';
        // Opcional: limpiar la selección si se oculta
        document.getElementById('select-escuderia').value = '';
    }
}



    
</script>
