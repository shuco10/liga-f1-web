<script>
    // Lógica para alternar botones según la sesión
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        
        // Ahora usamos la función esAdmin() de tu auth.js
        // Esto es mucho más seguro y centralizado
        if (btnLogin && btnLogout) {
            if (typeof esAdmin === 'function' && esAdmin()) {
                btnLogin.style.display = 'none';
                btnLogout.style.display = 'inline-block';
            } else {
                btnLogin.style.display = 'inline-block';
                btnLogout.style.display = 'none';
            }
        }
    }

    // Ejecutar al cargar la página
    // Como esto está en el header.html, se ejecuta cada vez que el header se inyecta
    document.addEventListener('DOMContentLoaded', verificarSesion);

    // Función de cierre de sesión unificada
    function cerrarSesion() {
        // Llamamos a la función de auth.js
        if (typeof cerrarSesion === 'function') {
            cerrarSesion();
        } else {
            localStorage.removeItem('rol');
            location.reload();
        }
    }
</script>
