        async function cargarDesplegablesAdmin() {
    // PROTECCIÓN: Si no eres admin, no permitimos que se carguen los datos
    if (localStorage.getItem('rol') !== 'admin') {
        console.warn("Acceso denegado: solo administradores pueden cargar los desplegables.");
        return; 
    }

    try {
        // 1. Cargar Circuitos
        const resC = await fetch('/api/circuitos');
        const circuitos = await resC.json();
        const selCircuito = document.getElementById('select-circuito-admin');
        if (selCircuito) {
            // Añadimos una opción por defecto vacía para forzar que el admin elija
            selCircuito.innerHTML = '<option value="">-- Selecciona circuito --</option>' + 
                                     circuitos.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        }

        // 2. Cargar Pilotos
        const res = await fetch('/api/lista-de-pilotos');
        const pilotos = await res.json();
        
        // Ordenamos los pilotos por número antes de pintar los desplegables
        pilotos.sort((a, b) => a.numero_piloto - b.numero_piloto);

        const ids = ['select-piloto', 'select-piloto-sancion', 'select-piloto-eliminar', 'select-piloto-editar', 'select-piloto-admin'];

        ids.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = '<option value="">-- Selecciona un piloto --</option>';
                pilotos.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `#${p.numero_piloto} - ${p.gamertag}`;
                    el.appendChild(opt);
                });
            }
        });
    } catch (err) {
        console.error("CRÍTICO en cargarDesplegablesAdmin:", err);
    }
}

            document.getElementById('edit-foto').value = piloto.foto_url || '';

            document.getElementById('edit-escuderia').value = piloto.escuderia_id || '1';
            document.getElementById('edit-es_reserva').value = piloto.es_reserva || '0';
        }
    }

// Estas funciones gestionan la comunicación con tu backend
async function eliminarResultado(id) {
    if (!confirm('¿Estás seguro de que quieres borrar este resultado?')) return;
    
    const res = await fetch(`/api/resultados/${id}`, { method: 'DELETE' });
    if (res.ok) {
        alert('Resultado eliminado correctamente');
        cargarCircuitos(); // Recargamos para ver los cambios
    } else {
        alert('Error: No se pudo eliminar. Verifica tus permisos.');
    }
}

async function editarResultado(id) {
    const nuevaPos = prompt("Introduce la nueva posición para el piloto:");
    if (!nuevaPos) return;
    
    const res = await fetch(`/api/resultados/${id}`, { 
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ posicion: parseInt(nuevaPos) })
    });
    
    if (res.ok) {
        alert('Resultado actualizado');
        cargarCircuitos();
    } else {
        alert('Error al actualizar');
    }
}

        

    async function guardarResultado() {
        const data = {
            circuito_id: document.getElementById('select-circuito-admin').value,
            piloto_id: document.getElementById('select-piloto-admin').value,
            posicion: parseInt(document.getElementById('input-posicion').value)
        };
        const res = await fetch('/api/guardar-resultado', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if(res.ok) {
            alert("Resultado guardado y puntos actualizados");
            cargarTodosLosDatos(); 
            cargarCircuitos(); 
        } else {
            alert("Error al guardar el resultado");
        }
    }

<script>
        function aplicarPermisos() {
            const esAdmin = (localStorage.getItem('rol') === 'admin');
            const botones = document.querySelectorAll('.admin-only');
            const btnLogout = document.getElementById('btn-logout');
            
            botones.forEach(btn => btn.style.display = esAdmin ? 'block' : 'none');
            if (btnLogout) btnLogout.style.display = esAdmin ? 'block' : 'none';

            const panelAdmin = document.getElementById('contenido-admin');
            if (panelAdmin) panelAdmin.style.display = esAdmin ? 'block' : 'none';
            
            const bloqueLogin = document.getElementById('bloque-login');
            if (bloqueLogin) bloqueLogin.style.display = esAdmin ? 'none' : 'block';
        }

        function cerrarSesion() {
            localStorage.removeItem('rol');
            location.reload();
        }

async function verificarPassword() {
            const password = document.getElementById('pass-comisario').value;
            const errorDiv = document.getElementById('error-login');
            
            if (password === "admin123") { 
                localStorage.setItem('rol', 'admin');
                
                // 1. Primero, hacemos visible el panel
                aplicarPermisos();
                
                // 2. Esperamos una fracción de segundo para que el navegador "pinte" el panel
                // Esto asegura que los <select> ya existan cuando JS quiera escribirlos
                setTimeout(() => {
                    cargarDesplegablesAdmin();
                    alert("Acceso concedido");
                }, 100); 
                
            } else {
                errorDiv.textContent = "Contraseña incorrecta";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            aplicarPermisos();
            if (localStorage.getItem('rol') === 'admin') {
                cargarDesplegablesAdmin();
            }
        });
   
        // --- RESET DE PUNTOS Y BASE DE DATOS ---
        function confirmarReset() {
            if (confirm("⚠️ ¿ESTÁS SEGURO?\nEsto borrará todos los puntos y resultados.")) {
                ejecutarReset();
            }
        }

        async function ejecutarReset() {
            const res = await fetch('/api/reset', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                alert("Base de datos reseteada.");
                location.reload();
            } else {
                alert("Error: " + data.message);
            }
        }
