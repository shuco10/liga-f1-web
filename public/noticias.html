<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias | Cazadores de Curvas</title>
    <script src="/auth.js"></script>
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        #lista-noticias { padding: 20px; max-width: 800px; margin: auto; }
    </style>
    <script src="/auth.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="modal-container"></div>
    
    <div class="titulo-liga">📰 NOTICIAS Y AVISOS 📰</div>

<div id="form-noticia-admin" class="form-noticia" style="display: none; border: 1px solid #444; padding: 20px; margin: 20px auto; background: #222; max-width: 500px; border-radius: 10px;">
    <h3 style="margin-top: 0;">Publicar Nueva Noticia</h3>
    <input type="text" id="nueva-noticia-titulo" placeholder="Título" style="width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box;">
    <textarea id="nueva-noticia-cuerpo" placeholder="Cuerpo de la noticia..." rows="4" style="width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box;"></textarea>
    <button onclick="publicarNoticia()" style="background: #ff3333; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%;">Publicar</button>
</div>

<script>
    // Mostrar el formulario solo si es admin
    if (typeof esAdmin === 'function' && esAdmin()) {
        document.getElementById('form-noticia-admin').style.display = 'block';
    }
</script>

    <div style="background-color: #262626; padding: 25px; border-radius: 10px; max-width: 900px; margin: 20px auto; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <div id="lista-noticias">
            <p style="text-align: center; color: #888;">Cargando avisos...</p>
        </div>
    </div>

    <div id="footer-placeholder"></div>

<script>
    // 1. Cargar Header, Footer y Modal de forma ordenada
    document.addEventListener('DOMContentLoaded', () => {
        
        // Cargar Header
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Verificación de sesión tras cargar el header
                if (typeof verificarSesion === 'function') {
                    verificarSesion();
                }

                // Configuración Banner
                window.igBannerConfig = {
                    lang: 'es',
                    igr: 'gamer-97d22e',
                    banners: ['my-banner']
                };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);
            })
            .catch(error => console.error('Error al cargar la cabecera:', error));

        // Cargar Footer
        fetch('/footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data)
            .catch(error => console.error('Error al cargar el footer:', error));

        // Cargar Modal de Login (Para evitar el error de null)
        fetch('/login-modal.html')
            .then(res => res.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });

        // Cargar las noticias
        cargarNoticias();
    });

// 1. Mostrar form si es admin
    if (typeof esAdmin === 'function' && esAdmin()) {
        document.getElementById('form-noticia-admin').style.display = 'block';
    }

    // 2. Cargar Noticias
    async function cargarNoticias() {
        const contenedor = document.getElementById('lista-noticias');
        const respuesta = await fetch('/api/noticias');
        const noticias = await respuesta.json();
        
        contenedor.innerHTML = noticias.length === 0 ? '<p style="text-align: center; color: #888;">No hay avisos pendientes.</p>' : '';
        
        noticias.forEach(n => {
            const div = document.createElement('div');
            div.style.marginBottom = "20px";
            div.style.borderBottom = "1px solid #444";
            div.style.paddingBottom = "15px";
            const fecha = new Date(n.fecha).toLocaleString();
            
            div.innerHTML = `
                <h4 style="margin: 0 0 10px 0; color: #ff4444;">${n.titulo}</h4>
                <p style="margin: 5px 0; color: #ccc;">${n.contenido}</p>
                <small style="color: #666;">${fecha}</small>
                ${(typeof esAdmin === 'function' && esAdmin()) ? `
                    <div style="margin-top: 10px; gap: 10px; display: flex;">
                        <button onclick="editarNoticia(${n.id}, '${n.titulo.replace(/'/g, "\\'")}', '${n.contenido.replace(/'/g, "\\'")}')" style="background:#f39c12; color:white; border:none; padding:5px 10px; cursor:pointer;">Editar</button>
                        <button onclick="eliminarNoticia(${n.id})" style="background:#ff4444; color:white; border:none; padding:5px 10px; cursor:pointer;">Borrar</button>
                    </div>` : ''}
            `;
            contenedor.appendChild(div);
        });
    }

    // 3. Acciones Admin
    async function publicarNoticia() {
        const res = await fetch('/api/noticias', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ titulo: document.getElementById('nueva-noticia-titulo').value, contenido: document.getElementById('nueva-noticia-cuerpo').value })
        });
        if (res.ok) { cargarNoticias(); alert("Publicado"); }
    }

    async function eliminarNoticia(id) {
        if (confirm("¿Borrar?")) { await fetch(`/api/noticias/${id}`, { method: 'DELETE' }); cargarNoticias(); }
    }

    async function editarNoticia(id, t, c) {
        const nt = prompt("Nuevo título:", t);
        const nc = prompt("Nuevo contenido:", c);
        if (nt && nc) {
            await fetch(`/api/noticias/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ titulo: nt, contenido: nc }) });
            cargarNoticias();
        }
    }

    document.addEventListener('DOMContentLoaded', cargarNoticias);


    // Esta función vivirá ahora permanentemente en noticias.html
    function verificarSesion() {
        console.log("DEBUG: Ejecutando verificación...");
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            if (adminStatus === true) {
                btnLogin.style.display = 'none';
                btnLogout.style.display = 'inline-block';
            } else {
                btnLogin.style.display = 'inline-block';
                btnLogout.style.display = 'none';
            }
        } else {
            console.warn("DEBUG: Botones no encontrados todavía.");
        }
    }

    // Esta función también la movemos aquí para que sea 100% accesible
    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'block';
    }


        async function enviarContacto() {
        const webhookUrl = 'https://discord.com/api/webhooks/1517947890415440045/mSZebdMcmNQpvmE1CafNS2BLLW1j74bOrYQXE8dGt43tN4rylqDvpNCr4KZ68DRDAK9x'; 
        const nombre = document.getElementById('nombre-contacto').value;
        const asunto = document.getElementById('asunto-contacto').value;
        const mensaje = document.getElementById('mensaje-contacto').value;

        // Validacion simple
        if(!nombre || !asunto || !mensaje) {
            alert("Por favor, rellena todos los campos.");
            return;
        }

        const payload = {
            content: "📢 @admin 📢 **¡Nuevo contacto desde la web!** 📢",
            embeds: [{
                title: "📩 Nuevo mensaje de contacto",
                color: 3447003,
                fields: [
                    { name: "Nombre", value: nombre, inline: true },
                    { name: "Asunto", value: asunto, inline: true },
                    { name: "Mensaje", value: mensaje }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        const res = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("¡Mensaje enviado correctamente!");
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert("Error al enviar el mensaje.");
        }
    }

    
    
</script>
