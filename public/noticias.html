<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias | Cazadores de Curvas</title>
    <script src="/auth.js"></script>
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #121216; 
            color: #e0e0e6; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        .titulo-liga {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin: 30px 0 20px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 162, 255, 0.3);
        }

        #lista-noticias { 
            padding: 20px; 
            max-width: 800px; 
            margin: auto; 
        }

        /* Cajas de noticias translúcidas con el azul corporativo en el borde */
        .noticia-item {
            background: rgba(18, 18, 24, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 162, 255, 0.25); /* Azul de la liga */
            border-left: 4px solid #ff3333; /* Rojo de competición en la barra lateral */
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .noticia-item:hover {
            border-color: rgba(0, 162, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 162, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Títulos de noticias limpios y el icono en el azul de la liga */
        .noticia-item h4 {
            color: #ffffff !important;
            font-size: 1.15em;
        }

        .noticia-item h4 i {
            color: #00a2ff; /* Azul corporativo */
        }

        /* Formulario de administración translúcido */
        #form-noticia-admin {
            background: rgba(18, 18, 24, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 162, 255, 0.3);
            padding: 25px;
            margin: 20px auto;
            max-width: 550px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #form-noticia-admin h3 {
            color: #fff;
            font-weight: 700;
        }

        #form-noticia-admin input, 
        #form-noticia-admin textarea {
            background: rgba(12, 12, 16, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95em;
            transition: border-color 0.2s ease;
        }

        #form-noticia-admin input:focus, 
        #form-noticia-admin textarea:focus {
            outline: none;
            border-color: #00a2ff;
            box-shadow: 0 0 8px rgba(0, 162, 255, 0.25);
        }

        /* Botón de publicar principal con el rojo de la liga */
        #form-noticia-admin button {
            background: linear-gradient(135deg, #cc0000, #ff3333);
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 51, 51, 0.3);
        }

        #form-noticia-admin button:hover {
            background: linear-gradient(135deg, #ff3333, #ff4d4d);
            box-shadow: 0 6px 16px rgba(255, 51, 51, 0.5);
            transform: translateY(-1px);
        }

        /* Botones de Editar (con acento azul) y Borrar (con acento rojo suave) */
        .btn-editar-noticia {
            background: transparent !important;
            color: #00a2ff !important;
            border: 1px solid rgba(0, 162, 255, 0.4) !important;
            padding: 6px 14px !important;
            cursor: pointer;
            border-radius: 6px !important;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.2s ease;
        }

        .btn-editar-noticia:hover {
            background: rgba(0, 162, 255, 0.15) !important;
            border-color: #00a2ff !important;
        }

        .btn-borrar-noticia, 
        .noticia-item button[onclick^="eliminarNoticia"] {
            background: transparent !important;
            color: #ff4d4d !important;
            border: 1px solid rgba(255, 77, 77, 0.4) !important;
            padding: 6px 14px !important;
            cursor: pointer;
            border-radius: 6px !important;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.2s ease;
        }

        .btn-borrar-noticia:hover, 
        .noticia-item button[onclick^="eliminarNoticia"]:hover {
            background: rgba(255, 77, 77, 0.15) !important;
            border-color: #ff4d4d !important;
        }
    </style>
    <script src="/auth.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="modal-container"></div>
    
<div class="titulo-liga">📰 NOTICIAS Y AVISOS 📰</div>

<div id="form-noticia-admin" class="form-noticia" style="display: none;">
    <h3 style="margin-top: 0; text-align: center;">Publicar Nueva Noticia</h3>
    <input type="text" id="nueva-noticia-titulo" placeholder="Título" style="width: 100%; margin-bottom: 10px; box-sizing: border-box;">
    <textarea id="nueva-noticia-cuerpo" placeholder="Cuerpo de la noticia..." rows="4" style="width: 100%; margin-bottom: 10px; box-sizing: border-box;"></textarea>
    <button onclick="publicarNoticia()">Publicar</button>
</div>

<main class="caja-contenido" id="lista-noticias">
    </main>

    <div id="footer-placeholder"></div>

<script>
    // 1. Cargar Header, Footer y Modal de forma ordenada
    document.addEventListener('DOMContentLoaded', () => {
        
        // Cargar Header
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Verificación de sesión tras cargar el header
                if (typeof verificarSesion === 'function') {
                    verificarSesion();
                }

                // Configuración Banner
                window.igBannerConfig = {
                    lang: 'es',
                    igr: 'gamer-97d22e',
                    banners: ['my-banner']
                };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);
            })
            .catch(error => console.error('Error al cargar la cabecera:', error));

        // Cargar Footer
        fetch('/footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data)
            .catch(error => console.error('Error al cargar el footer:', error));

        // Cargar Modal de Login (Para evitar el error de null)
        fetch('/login-modal.html')
            .then(res => res.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });

        // Cargar las noticias
        cargarNoticias();
    });

// 1. Cargar Noticias
async function cargarNoticias() {
    const contenedor = document.getElementById('lista-noticias');
    if (!contenedor) return; // Protección por si no existe en esta página

    try {
        const respuesta = await fetch('/api/noticias');
        const noticias = await respuesta.json();
        
        contenedor.innerHTML = ''; 
        
        if (noticias.length === 0) {
            contenedor.innerHTML = '<p style="color: #666; text-align: center;">No hay avisos pendientes.</p>';
            return;
        }

        noticias.forEach(noticia => {
            const div = document.createElement('div');
            div.className = 'noticia-item noticia-destacada-amarilla'; 
            div.style.marginBottom = "20px";
            
            const botonesAdmin = (typeof esAdmin === 'function' && esAdmin()) ? `
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button class="btn-editar-noticia" data-id="${noticia.id}">Editar</button>
                    <button class="btn-borrar-noticia" onclick="eliminarNoticia(${noticia.id})">Borrar</button>
                </div>
            ` : '';

            const fechaObj = new Date(noticia.fecha);
            div.innerHTML = `
                <h4 style="margin: 0 0 10px 0; color: #ff79c6; font-size: 1.15em;"><i class="fa-solid fa-circle-info"></i> ${noticia.titulo}</h4>
                <p style="margin: 5px 0 15px 0; color: #ccc; font-size: 0.95em; line-height: 1.5;">${noticia.contenido}</p>
                <small style="color: #888;"><i class="fa-regular fa-clock"></i> ${fechaObj.toLocaleDateString()} - ${fechaObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                ${botonesAdmin}
            `;
            contenedor.appendChild(div);

            // Asignamos el evento de editar de forma segura por memoria
            if (typeof esAdmin === 'function' && esAdmin()) {
                const btnEditar = div.querySelector('.btn-editar-noticia');
                if (btnEditar) {
                    btnEditar.addEventListener('click', () => {
                        editarNoticia(noticia.id, noticia.titulo, noticia.contenido);
                    });
                }
            }
        });
    } catch (error) {
        console.error("Error cargando noticias:", error);
        contenedor.innerHTML = '<p style="color: #ff4444; text-align: center;">Error al cargar las noticias.</p>';
    }
}

// 2. Publicar Noticia (Versión limpia y segura sin webhooks en el front)
async function publicarNoticia() {
    const tituloInput = document.getElementById('nueva-noticia-titulo');
    const contenidoInput = document.getElementById('nueva-noticia-cuerpo');

    if (!tituloInput.value || !contenidoInput.value) {
        alert("Por favor, rellena el título y el contenido.");
        return;
    }

    try {
        const res = await fetch('/api/noticias', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                titulo: tituloInput.value, 
                contenido: contenidoInput.value 
            })
        });
        
        const data = await res.json();

        if (res.ok && data.success) {
            tituloInput.value = '';
            contenidoInput.value = '';

            alert("Noticia publicada correctamente y enviada a Discord.");
            
            if (typeof cargarNoticias === 'function') {
                cargarNoticias();
            } else {
                location.reload();
            }
        } else {
            alert(data.error || "Error al publicar la noticia.");
        }
    } catch (err) {
        console.error("Error:", err);
        alert("Error de conexión al publicar.");
    }
}

// 3. Eliminar Noticia
async function eliminarNoticia(id) {
    if (confirm("¿Estás seguro de que quieres borrar este anuncio?")) {
        const res = await fetch(`/api/noticias/${id}`, { method: 'DELETE' });
        if (res.ok) location.reload();
    }
}

// 4. Editar Noticia
async function editarNoticia(id, tituloActual, contenidoActual) {
    const nuevoTitulo = prompt("Edita el título:", tituloActual);
    if (nuevoTitulo === null) return;

    const nuevoContenido = prompt("Edita el contenido:", contenidoActual);
    if (nuevoContenido === null) return;

    try {
        const res = await fetch(`/api/noticias/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ titulo: nuevoTitulo, contenido: nuevoContenido })
        });
        
        if (res.ok) {
            location.reload();
        } else {
            alert("Error al actualizar la noticia.");
        }
    } catch (err) {
        console.error("Error al editar:", err);
        alert("Error de conexión al actualizar la noticia.");
    }
}

// Esta función vivirá ahora permanentemente en noticias.html
async function verificarSesion() {
    console.log("DEBUG: Ejecutando verificación con el servidor...");
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const formAdmin = document.getElementById('form-noticia-admin');
    
    // Forzamos que de entrada esté oculto hasta tener respuesta real del servidor
    if (formAdmin) formAdmin.style.display = 'none';

    let adminStatus = false;
    
    // Consultamos directamente al servidor para validar la sesión real
    try {
        const res = await fetch('/api/auth/sesion');
        const data = await res.json();
        
        if (data.logueado && data.rol === 'admin') {
            adminStatus = true;
            localStorage.setItem('rol', 'admin');
        } else {
            localStorage.removeItem('rol'); // Limpiamos si la sesión expiró o no es admin
        }
    } catch (err) {
        console.error("DEBUG: Error al contrastar sesión con la base de datos:", err);
    }
    
    // Gestionar visibilidad según el estado real devuelto por el servidor
    if (btnLogin && btnLogout) {
        if (adminStatus === true) {
            btnLogin.style.display = 'none';
            btnLogout.style.display = 'inline-block';
            if (formAdmin) formAdmin.style.display = 'block';
        } else {
            btnLogin.style.display = 'inline-block';
            btnLogout.style.display = 'none';
            if (formAdmin) formAdmin.style.display = 'none';
        }
    } else {
        console.warn("DEBUG: Botones del header aún no disponibles, reintentando...");
        // Pequeño reintento por si el header tarda un poco más en renderizar
        setTimeout(() => {
            const btnLoginRetry = document.getElementById('btn-login');
            const btnLogoutRetry = document.getElementById('btn-logout');
            if (btnLoginRetry && btnLogoutRetry) {
                btnLoginRetry.style.display = adminStatus ? 'none' : 'inline-block';
                btnLogoutRetry.style.display = adminStatus ? 'inline-block' : 'none';
            }
            if (formAdmin) {
                formAdmin.style.display = adminStatus ? 'block' : 'none';
            }
        }, 300);
    }
}

// Esta función también la movemos aquí para que sea 100% accesible
function seguridadAbrirModal() {
    const modal = document.getElementById('login-modal');
    if (modal) modal.style.display = 'block';
}

async function enviarContacto() {
    const nombre = document.getElementById('nombre-contacto').value;
    const asunto = document.getElementById('asunto-contacto').value;
    const mensaje = document.getElementById('mensaje-contacto').value;

    if(!nombre || !asunto || !mensaje) {
        alert("Por favor, rellena todos los campos.");
        return;
    }

    try {
        const res = await fetch('/api/contacto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, asunto, mensaje })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            alert(data.message);
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert(data.error || "Error al enviar el mensaje.");
        }
    } catch (error) {
        alert("Hubo un error de conexión.");
    }
}
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/iniciar-sesion.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
