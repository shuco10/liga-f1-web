<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importación de Resultados - Cazadores de Curvas</title>
    <!-- Agrega aquí tus estilos o Tailwind si lo usas en tu web -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background-color: #2a2a2a; }
        td[contenteditable="true"] { background-color: #2c2c2c; cursor: pointer; }
        td[contenteditable="true"]:focus { background-color: #3d3d3d; outline: 2px solid #3b82f6; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #2563eb; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .error-box { background: #7f1d1d; border: 1px solid #f87171; padding: 10px; margin-top: 15px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Importar Resultados de F1 (CSV)</h2>
    <p>Sube el archivo CSV con las columnas: <code>id_gp</code>, <code>id</code>, <code>gamertag</code>, <code>posicion</code>, <code>pole</code>, <code>dnf</code>.</p>
    
    <input type="file" id="inputCsvF1" accept=".csv" class="btn" style="background: transparent; border: 1px dashed #555;">
    
    <div id="resultadoValidacion"></div>

    <div id="contenedorTabla" style="display:none;">
        <h3>Previsualización y Edición (Haz clic en las celdas para modificar)</h3>
        <table id="tablaPrevisualizacion">
            <thead>
                <tr>
                    <th>ID GP</th>
                    <th>ID Piloto</th>
                    <th>Gamertag</th>
                    <th>Posición</th>
                    <th>Pole</th>
                    <th>DNF</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button id="btnGuardarDefinitivo" class="btn" onclick="enviarDatosDefinitivos()">Guardar Datos Definitivamente</button>
    </div>
</div>

<!-- Librería ligera para parsear CSV -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    let datosPrevisualizacionGlobal = [];

    document.getElementById('inputCsvF1').addEventListener('change', function(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;

        Papa.parse(archivo, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                validarYMostrarDatos(results.data);
            },
            error: function(err) {
                alert("Error al leer el archivo CSV: " + err.message);
            }
        });
    });

    function validarYMostrarDatos(datos) {
        const contenedorValidacion = document.getElementById('resultadoValidacion');
        const contenedorTabla = document.getElementById('contenedorTabla');
        const tbody = document.querySelector('#tablaPrevisualizacion tbody');
        
        tbody.innerHTML = '';
        contenedorValidacion.innerHTML = '';

        if (datos.length === 0) {
            contenedorValidacion.innerHTML = '<div class="error-box">El archivo CSV está vacío.</div>';
            contenedorTabla.style.display = 'none';
            return;
        }

        // Columnas obligatorias exigidas en el CSV (ahora usamos 'id' para el piloto)
        const obligatorias = ['id_gp', 'id', 'posicion', 'pole', 'dnf'];
        const primerasClaves = Object.keys(datos[0]);
        const faltanColumnas = obligatorias.some(col => !primerasClaves.includes(col));

        if (faltanColumnas) {
            contenedorValidacion.innerHTML = `<div class="error-box">Faltan columnas obligatorias. Asegúrate de incluir: ${obligatorias.join(', ')}</div>`;
            contenedorTabla.style.display = 'none';
            return;
        }

        let errores = [];
        datosPrevisualizacionGlobal = [];

datos.forEach((fila, index) => {
            const numFila = index + 1;
            const identificadorPiloto = fila.gamertag || `ID: ${fila.id}`;

            // Validaciones básicas de formato numérico
            if (!fila.id_gp || isNaN(fila.id_gp)) errores.push(`Fila ${numFila} (${identificadorPiloto}): id_gp inválido.`);
            if (!fila.id || isNaN(fila.id)) errores.push(`Fila ${numFila} (${identificadorPiloto}): id de piloto inválido.`);
            if (!fila.posicion || isNaN(fila.posicion)) errores.push(`Fila ${numFila} (${identificadorPiloto}): Posición inválida.`);

            datosPrevisualizacionGlobal.push(fila);

            // Pintar tabla interactiva (contenteditable)
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td contenteditable="true" onblur="actualizarDato(${index}, 'id_gp', this.innerText)">${fila.id_gp || ''}</td>
                <td contenteditable="true" onblur="actualizarDato(${index}, 'id', this.innerText)">${fila.id || ''}</td>
                <td>${fila.gamertag || '(Sin gamertag)'}</td>
                <td contenteditable="true" onblur="actualizarDato(${index}, 'posicion', this.innerText)">${fila.posicion || ''}</td>
                <td contenteditable="true" onblur="actualizarDato(${index}, 'pole', this.innerText)">${fila.pole || 'False'}</td>
                <td contenteditable="true" onblur="actualizarDato(${index}, 'dnf', this.innerText)">${fila.dnf || 'False'}</td>
            `;
            tbody.appendChild(tr);
        });

        if (errores.length > 0) {
            contenedorValidacion.innerHTML = `<div class="error-box"><strong>Se encontraron errores de validación:</strong><br>` + errores.join('<br>') + `</div>`;
            contenedorTabla.style.display = 'none';
        } else {
            contenedorValidacion.innerHTML = `<div style="color: #4ade80; margin-top: 15px; font-weight: bold;">✔ CSV validado correctamente (${datos.length} registros listos). Puedes editar cualquier celda antes de guardar.</div>`;
            contenedorTabla.style.display = 'block';
        }
    }

    // Actualiza en tiempo real el array global cuando el usuario edita una celda en la tabla
    function actualizarDato(index, campo, valor) {
        if (datosPrevisualizacionGlobal[index]) {
            datosPrevisualizacionGlobal[index][campo] = valor.trim();
        }
    }

    // Envío secuencial reutilizando tu API de un solo piloto
    async function enviarDatosDefinitivos() {
        if (datosPrevisualizacionGlobal.length === 0) {
            alert("No hay datos para guardar.");
            return;
        }

        if (!confirm(`¿Estás seguro de que deseas enviar los ${datosPrevisualizacionGlobal.length} registros a la base de datos?`)) {
            return;
        }

        const botonGuardar = document.getElementById('btnGuardarDefinitivo');
        const textoOriginal = botonGuardar.innerText;
        botonGuardar.disabled = true;
        botonGuardar.innerText = "Guardando pilotos...";

        let errores = 0;

        for (const fila of datosPrevisualizacionGlobal) {
            try {
                const payload = {
                    circuito_id: fila.id_gp,
                    piloto_id: parseInt(fila.id), // Cogemos el ID numérico de la columna id
                    posicion: parseInt(fila.posicion),
                    escuderia_id: fila.escuderia_id || null,
                    pole: fila.pole,
                    dnf: fila.dnf
                };

                const respuesta = await fetch('/api/guardar-resultado', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!respuesta.ok) {
                    errores++;
                }
            } catch (err) {
                console.error("Fallo al enviar el registro:", err);
                errores++;
            }
        }

        botonGuardar.disabled = false;
        botonGuardar.innerText = textoOriginal;

        if (errores === 0) {
            alert("¡Todos los resultados del Gran Premio se han guardado con éxito!");
            document.getElementById('resultadoValidacion').innerHTML = '';
            document.getElementById('inputCsvF1').value = '';
            document.getElementById('contenedorTabla').style.display = 'none';
            datosPrevisualizacionGlobal = [];
        } else {
            alert(`Proceso finalizado, pero hubo ${errores} errores al guardar algunos registros. Revisa la consola del servidor.`);
        }
    }
</script>

</body>
</html>
