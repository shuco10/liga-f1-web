<script>
    // 1. Cargar todo en orden
    document.addEventListener('DOMContentLoaded', () => {
        // Carga el Header (una sola vez)
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Configurar el Banner de Instant Gaming
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);

                // AHORA QUE EL HEADER ESTÁ CARGADO, VERIFICAMOS SESIÓN
                verificarSesion();
            });

        // Cargar Footer y Modal
        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));
    }); // <--- AQUÍ SE CIERRA EL EVENT LISTENER CORRECTAMENTE

    // 2. Lógica de Sesión (FUERA del DOMContentLoaded)
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }
    }

    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'block';
    }

function validarYPrevisualizarCSV() {
    const input = document.getElementById('inputCsvF1');
    const contenedorFeedback = document.getElementById('resultadoValidacion');
    
    if (!input.files || input.files.length === 0) {
        alert("Selecciona un archivo CSV primero.");
        return;
    }

    const archivo = input.files[0];
    const lector = new FileReader();

    lector.onload = function(e) {
        const lineas = e.target.result.split('\n');
        if (lineas.length < 2) {
            contenedorFeedback.innerHTML = "<p style='color: #e74c3c;'>El archivo está vacío o no tiene formato válido.</p>";
            return;
        }

        const separador = lineas[0].includes(';') ? ';' : ',';
        const cabeceras = lineas[0].toLowerCase().split(separador).map(h => h.trim());

        // Validar que las cabeceras obligatorias existan
        const obligatorias = ['id_gp', 'gamertag', 'posicion', 'pole', 'dnf'];
        const faltantes = obligatorias.filter(campo => !cabeceras.includes(campo));

        if (faltantes.length > 0) {
            contenedorFeedback.innerHTML = `<p style='color: #e74c3c; font-weight: bold;'>Error crítico: Faltan las siguientes columnas obligatorias en el CSV: ${faltantes.join(', ')}</p>`;
            return;
        }

        let filasValidas = [];
        let erroresBloqueantes = [];

        // Analizar fila por fila (empezando desde la 1)
        for (let i = 1; i < lineas.length; i++) {
            const lineaTexto = lineas[i].trim();
            if (!lineaTexto) continue; // Saltar líneas vacías

            const valores = lineaTexto.split(separador).map(v => v.trim());
            let filaObj = {};

            cabeceras.forEach((cabecera, index) => {
                filaObj[cabecera] = valores[index] !== undefined ? valores[index] : '';
            });

            // COMPROBACIONES BLOQUEANTES
            let numeroFila = i + 1;
            if (!filaObj.id_gp) erroresBloqueantes.sindes?.push ? null : erroresBloqueantes.push(`Fila ${numeroFila}: Falta el circuito (id_gp).`);
            if (!filaObj.gamertag) erroresBloqueantes.push(`Fila ${numeroFila}: Falta el nombre del piloto (gamertag).`);
            if (filaObj.posicion === '' || isNaN(filaObj.posicion)) erroresBloqueantes.push(`Fila ${numeroFila} (${filaObj.gamertag || 'Piloto desconocido'}): Posición inválida o vacía.`);
            if (filaObj.pole === '') erroresBloqueantes.push(`Fila ${numeroFila} (${filaObj.gamertag}): El campo 'pole' no puede estar vacío.`);
            if (filaObj.dnf === '') erroresBloqueantes.push(`Fila ${numeroFila} (${filaObj.gamertag}): El campo 'dnf' no puede estar vacío.`);

            filasValidas.push(filaObj);
        }

        // SI HAY ERRORES, BLOQUEAMOS EL PROCESO
        if (erroresBloqueantes.length > 0) {
            let htmlErrores = `<h4 style="color: #e74c3c;">Se han encontrado errores bloqueantes (${erroresBloqueantes.length}):</h4><ul style="color: #ff9999; background: #2a1515; padding: 15px; border-radius: 4px;">`;
            erroresBloqueantes.forEach(err => { htmlErrores += `<li>${err}</li>`; });
            htmlErrores += `</ul><p>Corrije el archivo Excel/CSV y vuelve a subirlo.</p>`;
            contenedorFeedback.innerHTML = htmlErrores;
            return;
        }

        // Si pasa la validación, muestra un mensaje de éxito previo a pintar la tabla editable
        contenedorFeedback.innerHTML = `<p style="color: #2ecc71; font-weight: bold;">¡Archivo validado con éxito! ${filasValidas.length} registros listos para revisar.</p>`;
        
        // Aquí es donde en el siguiente paso montaremos la tabla de previsualización editable
    };

    lector.readAsText(archivo, 'UTF-8');
}
