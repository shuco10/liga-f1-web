<div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
    <div style="background:#2a2a2a; width:300px; margin:100px auto; padding:20px; border-radius:8px; text-align:center;">
        <h3 style="color: white; margin-top: 0;">Acceso de Administrador</h3>
        
        <input type="text" id="admin-user" placeholder="Usuario" style="width:90%; margin-bottom:10px; padding: 8px; color:black;">
        
        <input type="password" id="admin-pass" placeholder="Contraseña" style="width:90%; margin-bottom:15px; padding: 8px; color:black;">
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="boton-accion" onclick="verificarPass()">Entrar</button>
            <button class="boton-accion" style="background-color: #555;" onclick="document.getElementById('login-modal').style.display='none'">Cancelar</button>
        </div>
    </div>
</div>
