   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Comisarios - Liga F1</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #262626; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        h1, h2 { color: #e10600; text-transform: uppercase; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #444; background-color: #333; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #e10600; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background-color: #b80500; }
        .mensaje { text-align: center; margin-top: 10px; font-weight: bold; color: #00ff00; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ Panel de Control de Comisarios 🛠️</h1>
        <hr style="border-color: #444; margin-bottom: 25px;">

        <h2>Inscribir Nuevo Piloto</h2>
        <form id="form-piloto">
            <div class="form-group">
                <label>Gamertag / Nick:</label>
                <input type="text" id="gamertag" placeholder="Ej: Magic_Alonso" required>
            </div>
            <div class="form-group">
                <label>Plataforma:</label>
                <select id="plataforma">
                    <option value="PC">PC</option>
                    <option value="PS5">PS5</option>
                </select>
            </div>
            <div class="form-group">
                <label>Escudería:</label>
                <select id="escuderia_id">
                    <option value="1">Ferrari</option>
                    <option value="2">Red Bull</option>
                </select>
            </div>
            <button type="submit">Guardar Piloto en la Liga</button>
            <div id="msg-piloto" class="mensaje"></div>
        </form>
    </div>

    <div class="container">
        <h2>Introducir Resultado de Carrera</h2>
        <form id="form-carrera">
            <div class="form-group">
                <label>Seleccionar Piloto:</label>
                <select id="select-piloto" required>
                    </select>
            </div>
            <div class="form-group">
                <label>Posición Final de Carrera:</label>
                <input type="number" id="posicion_carrera" min="1" max="20" placeholder="Ej: 1" required>
            </div>
            <button type="submit" style="background-color: #0078d4;">Aplicar Puntos y Victoria</button>
            <div id="msg-carrera" class="mensaje"></div>
        </form>
    </div>

<script>
    // --- SEGURIDAD: Solo entra si eres admin ---
    // Si no está el rol de 'admin' en el navegador, te expulsa al index
    if (localStorage.getItem('rol') !== 'admin') {
        alert("Acceso denegado: Solo para Comisarios.");
        window.location.href = 'index.html'; 
    }

    // Función para cargar los pilotos en el desplegable
    async function cargarDesplegablePilotos() {
        try {
            const res = await fetch('/api/clasificacion-pilotos');
            const pilotos = await res.json();
            const select = document.getElementById('select-piloto');
            select.innerHTML = '';
            pilotos.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.gamertag} (${p.escuderia || 'Sin equipo'})</option>`;
            });
        } catch (err) {
            console.error("Error cargando pilotos:", err);
        }
    }

    // Cargar pilotos al entrar
    cargarDesplegablePilotos();

    // Enviar Nuevo Piloto
    document.getElementById('form-piloto').addEventListener('submit', async (e) => {
        e.preventDefault();
        const datos = {
            gamertag: document.getElementById('gamertag').value,
            plataforma: document.getElementById('plataforma').value,
            escuderia_id: parseInt(document.getElementById('escuderia_id').value)
        };
        const res = await fetch('/api/nuevo-piloto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });
        if (res.ok) {
            document.getElementById('msg-piloto').innerText = "¡Piloto inscrito con éxito!";
            document.getElementById('form-piloto').reset();
            cargarDesplegablePilotos(); 
            setTimeout(() => document.getElementById('msg-piloto').innerText = "", 3000);
        }
    });

    // Enviar Resultado de Carrera
    document.getElementById('form-carrera').addEventListener('submit', async (e) => {
        e.preventDefault();
        const datos = {
            piloto_id: parseInt(document.getElementById('select-piloto').value),
            posicion_carrera: parseInt(document.getElementById('posicion_carrera').value)
        };
        const res = await fetch('/api/subir-resultado', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });
        if (res.ok) {
            document.getElementById('msg-carrera').innerText = "¡Resultado aplicado! Puntos sumados al mundial.";
            document.getElementById('form-carrera').reset();
            setTimeout(() => document.getElementById('msg-carrera').innerText = "", 3000);
        }
    });
</script>
</body>
</html>
