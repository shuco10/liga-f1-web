// 1. La lógica de renderizado
function renderizarConstructores(pilotos, escuderias) {
    const body = document.getElementById('tabla-body-constructores');
    if (!body) return;
    body.innerHTML = "";

    const datosConstructores = escuderias.map(esc => {
        const pilotosEscuderia = pilotos.filter(p => 
            String(p.escuderia_id) === String(esc.id) && String(p.es_reserva) === '0'
        );
        
        const puntosPilotos = pilotosEscuderia.reduce((sum, p) => sum + (Number(p.puntos_totales) || 0), 0);
        
        return {
            nombre: esc.nombre, // Usamos el nombre tal cual viene de la base de datos
            mundiales: esc.mundiales || 0,
            color: esc.color_hex || "#555555", // Usamos el color de la BD o un gris por defecto
            logo: (typeof LOGOS_ESCUDERIAS !== 'undefined' ? LOGOS_ESCUDERIAS[esc.id] : '') || '/logos/default.png',
            pilotos: pilotosEscuderia,
            victorias: pilotosEscuderia.reduce((sum, p) => sum + (Number(p.victorias) || 0), 0),
            podios: pilotosEscuderia.reduce((sum, p) => sum + (Number(p.podios) || 0), 0),
            puntos: puntosPilotos + (Number(esc.puntos) || 0)
        };
    }).sort((a, b) => b.puntos - a.puntos);

    datosConstructores.forEach((c, index) => {
        const esPodio = index < 3;
        const posClass = esPodio ? `pos-${index + 1}` : '';
        const numeroDisplay = index + 1;
        
        const avatars = c.pilotos.map(p => {
            const nombreArchivo = p.foto_url ? p.foto_url.split('/').pop() : 'R.png';
            return `<img src="/pilotos/${nombreArchivo}" 
                         class="avatar-constructor-grande" 
                         title="${p.gamertag}" 
                         onerror="this.src='/pilotos/R.png'">`;
        }).join('');

        body.innerHTML += `
<tr>
        <td><div class="pos-podio ${posClass}">${numeroDisplay}</div></td>
        <td style="text-align: center; font-weight:bold; color: #ffcc00;">${c.mundiales}</td> <td style="text-align: left;">
            <span class="color-banda" style="background-color: ${c.color};"></span>
            <img src="${c.logo}" class="logo-escuderia"> ${c.nombre}
        </td>
        <td style="text-align: center;">${avatars || '-'}</td>
        <td style="text-align: center;">${c.victorias}</td>
        <td style="text-align: center;">${c.podios}</td>
        <td style="text-align: center; font-weight:bold;">${c.puntos} pts</td>
    </tr>
        `;
    });
}

// 2. Carga única y correcta
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const [resP, resE, resR] = await Promise.all([
            fetch('/api/lista-de-pilotos'),
            fetch('/api/escuderias'),
            fetch('/api/todos-los-resultados')
        ]);

        const pilotos = await resP.json();
        const escuderias = await resE.json();
        const resultados = await resR.json();

        pilotos.forEach(p => {
            p.podios = resultados.filter(r => r.piloto_id === p.id && r.posicion <= 3).length;
            p.victorias = resultados.filter(r => r.piloto_id === p.id && r.posicion === 1).length;
        });

        renderizarConstructores(pilotos, escuderias);
    } catch (error) {
        console.error("Error al cargar los datos:", error);
    }
});







    
// Función centralizada
function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
    
    // Si los botones existen, aplicamos la lógica
    if (btnLogin && btnLogout) {
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
    } else {
        // Por si acaso, si no se encuentran, reintentamos en 100ms
        setTimeout(verificarSesion, 100);
    }
}
