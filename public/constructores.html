// --- FUNCIÓN PRINCIPAL DE RENDERIZADO ---
function renderizarConstructores(pilotos, escuderias) {
    const body = document.getElementById('tabla-body-constructores');
    if (!body) {
        console.error("No se encontró el elemento con ID 'tabla-body-constructores'");
        return;
    }
    body.innerHTML = "";

    const mapaColores = {
        "Audi": "banda-audi", "Cadillac": "banda-cadillac", "Red Bull Racing": "banda-redbull",
        "Mercedes-AMG": "banda-mercedes", "Ferrari": "banda-ferrari", "Aston Martin": "banda-aston",
        "Williams": "banda-williams", "Alpine": "banda-alpine", "Haas": "banda-haas",
        "Visa Cash App RB": "banda-visa", "McLaren": "banda-mclaren"
    };

    const datosConstructores = escuderias.map(esc => {
        const pilotosEscuderia = pilotos.filter(p => String(p.escuderia_id) === String(esc.id));
        
        return {
            nombre: esc.nombre,
            logo: (typeof LOGOS_ESCUDERIAS !== 'undefined' ? LOGOS_ESCUDERIAS[esc.id] : '') || '/logos/default.png',
            pilotos: pilotosEscuderia,
            victorias: pilotosEscuderia.reduce((sum, p) => sum + (parseInt(p.victorias) || 0), 0),
            podios: pilotosEscuderia.reduce((sum, p) => sum + (parseInt(p.podios) || 0), 0),
            puntos: pilotosEscuderia.reduce((sum, p) => sum + (parseInt(p.puntos) || 0), 0)
        };
    }).sort((a, b) => b.puntos - a.puntos);

    datosConstructores.forEach((c, index) => {
        const claseBanda = mapaColores[c.nombre] || "banda-default";
        
        const avatars = c.pilotos.map(p => {
            const nombreArchivo = p.foto_url ? p.foto_url.split('/').pop() : 'default.png';
            return `<img src="/pilotos/${nombreArchivo}" class="piloto-avatar-small" onerror="this.src='https://www.w3schools.com/howto/img_avatar.png'">`;
        }).join('');

        body.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td style="text-align: left;">
                    <span class="color-banda ${claseBanda}"></span>
                    <img src="${c.logo}" class="logo-escuderia"> ${c.nombre}
                </td>
                <td>${avatars || '-'}</td>
                <td>${c.victorias}</td>
                <td>${c.podios}</td>
                <td style="font-weight:bold">${c.puntos} pts</td>
            </tr>
        `;
    });
}

// --- INICIALIZADOR AUTOMÁTICO ---
// Pon aquí el nombre de las funciones que usas para obtener tus datos
document.addEventListener("DOMContentLoaded", async () => {
    try {
        // AJUSTA ESTOS NOMBRES SEGÚN TU server.js
        const listaPilotos = await obtenerPilotos(); 
        const listaEscuderias = await obtenerEscuderias();
        
        renderizarConstructores(listaPilotos, listaEscuderias);
        console.log("Tabla de constructores cargada correctamente");
    } catch (error) {
        console.error("Error al cargar datos en Constructores:", error);
    }
});








    
// Función centralizada
function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
    
    // Si los botones existen, aplicamos la lógica
    if (btnLogin && btnLogout) {
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
    } else {
        // Por si acaso, si no se encuentran, reintentamos en 100ms
        setTimeout(verificarSesion, 100);
    }
}
