<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información | Cazadores de Curvas</title>
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
    <script src="/auth.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

<main class="caja-contenido">
    <div class="contenedor-botones">
        <a href="normativas.html" class="boton-accion">
            <i class="fa-solid fa-book"></i> Normativa
        </a>
        <a href="resoluciones-fia.html" class="boton-accion">
            <i class="fa-solid fa-gavel"></i> Resoluciones FIA
        </a>
    </div>
    <div class="header-principal">
        <h1 class="titulo-principal">🤝 DRAFT DE LA TEMPORADA 4 DE CAZADORES DE CURVAS 🤝</h1>
        <h3 class="subtitulo-principal">👥 Nuevas parejas de pilotos y escuderias para la temporada. 👥</h3>
    </div>
</main>

<div class="selector-parejas" style="max-width: 600px; margin: 20px auto; padding: 20px; background: #21252b; border-radius: 8px;">
    <h2 style="margin-top: 0;">🤝 SELECCIÓN DE PAREJAS</h2>
    
    <!-- Botón colocado arriba y con diseño limpio -->
    <div style="margin-bottom: 15px;">
        <button id="btn-crear-pareja" class="btn-crear" style="width: 100%; padding: 12px; background: #82d39d; color: #1a1a1a; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px;">Crear Pareja</button>
    </div>

    <!-- Desplegables en columna para que no choquen -->
    <div class="controles-pareja" style="display: flex; flex-direction: column; gap: 10px;">
        <select id="piloto-uno" class="select-piloto" style="padding: 10px; width: 100%; background: #1a1a1a; color: white; border: 1px solid #444; border-radius: 4px;">
            <option value="">Seleccionar Piloto 1</option>
        </select>

        <select id="piloto-dos" class="select-piloto" style="padding: 10px; width: 100%; background: #1a1a1a; color: white; border: 1px solid #444; border-radius: 4px;">
            <option value="">Seleccionar Piloto 2</option>
        </select>
    </div>

    <div id="resultado-parejas" class="resultado-parejas" style="margin-top: 20px;">
        <!-- Las parejas guardadas aparecerán aquí -->
    </div>
</div>

<div id="footer-placeholder"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);
                verificarSesion();
            });

        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));
        
        cargarDatosDraft();
    });

    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }
    }

    let listaPilotosGlobal = [];
    let parejasGuardadas = [];

    async function cargarDatosDraft() {
        try {
            // Cargar pilotos y parejas guardadas en paralelo desde la base de datos
            const [resPilotos, resParejas] = await Promise.all([
                fetch('/api/lista-de-pilotos'),
                fetch('/api/draft-parejas')
            ]);

            if (resPilotos.ok) listaPilotosGlobal = await resPilotos.json();
            if (resParejas.ok) parejasGuardadas = await resParejas.json();

            actualizarSelects();
            renderizarParejas();
        } catch (err) {
            console.error("Error al cargar los datos del draft:", err);
        }
    }

    function actualizarSelects() {
        const select1 = document.getElementById('piloto-uno');
        const select2 = document.getElementById('piloto-dos');

        const valorActual1 = select1.value;
        const valorActual2 = select2.value;

        // Obtener IDs de pilotos que ya forman parte de una pareja guardada en BD
        const idsEmparejados = parejasGuardadas.reduce((acc, p) => {
            acc.push(p.id_piloto1.toString(), p.id_piloto2.toString());
            return acc;
        }, []);

        const disponibles1 = listaPilotosGlobal.filter(p => !idsEmparejados.includes(p.id.toString()) && p.id.toString() !== valorActual2);
        const disponibles2 = listaPilotosGlobal.filter(p => !idsEmparejados.includes(p.id.toString()) && p.id.toString() !== valorActual1);

        select1.innerHTML = '<option value="">Seleccionar Piloto 1</option>' + 
            disponibles1.map(p => `<option value="${p.id}" ${valorActual1 == p.id ? 'selected' : ''}>${p.gamertag} ${p.escuderia ? '(' + p.escuderia + ')' : ''}</option>`).join('');

        select2.innerHTML = '<option value="">Seleccionar Piloto 2</option>' + 
            disponibles2.map(p => `<option value="${p.id}" ${valorActual2 == p.id ? 'selected' : ''}>${p.gamertag} ${p.escuderia ? '(' + p.escuderia + ')' : ''}</option>`).join('');
    }

    async function crearPareja() {
        const select1 = document.getElementById('piloto-uno');
        const select2 = document.getElementById('piloto-dos');
        
        const id1 = select1.value;
        const id2 = select2.value;

        if (!id1 || !id2) {
            alert("Debes seleccionar ambos pilotos.");
            return;
        }
        if (id1 === id2) {
            alert("Un piloto no puede hacer pareja consigo mismo.");
            return;
        }

        try {
            // Guardar en la base de datos mediante la API
            const response = await fetch('/api/draft-parejas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id1, id2 })
            });

            if (response.ok) {
                // Recargar todo desde la base de datos para sincronizar
                await cargarDatosDraft();
                select1.value = "";
                select2.value = "";
            } else {
                alert("Error al guardar la pareja en el servidor.");
            }
        } catch (err) {
            console.error("Error de red:", err);
            alert("Error de conexión al guardar la pareja.");
        }
    }

    function renderizarParejas() {
        const contenedor = document.getElementById('resultado-parejas');
        
        if (parejasGuardadas.length === 0) {
            contenedor.innerHTML = '<p style="color: #888; text-align: center;">No hay parejas creadas todavía.</p>';
            return;
        }

        contenedor.innerHTML = parejasGuardadas.map((pareja, index) => `
            <div class="fila-pareja" style="background: #252c35; padding: 10px 15px; margin-top: 8px; border-radius: 4px; border-left: 4px solid #82d39d; display: flex; justify-content: space-between; color: #fff; align-items: center;">
                <span class="etiqueta-pareja" style="font-weight: bold; color: #82d39d;">Pareja ${index + 1}:</span>
                <span class="nombres-pareja">${pareja.nombre1} + ${pareja.nombre2}</span>
            </div>
        `).join('');
    }

    // Eventos
    document.addEventListener('DOMContentLoaded', () => {
        const sel1 = document.getElementById('piloto-uno');
        const sel2 = document.getElementById('piloto-dos');
        const btnPareja = document.getElementById('btn-crear-pareja');

        if(sel1) sel1.addEventListener('change', actualizarSelects);
        if(sel2) sel2.addEventListener('change', actualizarSelects);
        if(btnPareja) btnPareja.addEventListener('click', crearPareja);
    });
</script>
</body>
</html>
