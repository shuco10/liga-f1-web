<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información | Cazadores de Curvas</title>
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        /* Estilos básicos para la modal de estrellas */
        .modal-estrellas { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-contenido-estrellas { background: #21252b; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; border: 1px solid #444; }
    </style>
    <script src="/auth.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

<main class="caja-contenido">
    <div class="contenedor-botones">
        <a href="normativas.html" class="boton-accion">
            <i class="fa-solid fa-book"></i> Normativa
        </a>
        <a href="resoluciones-fia.html" class="boton-accion">
            <i class="fa-solid fa-gavel"></i> Resoluciones FIA
        </a>
    </div>
    <div class="header-principal">
        <h1 class="titulo-principal">🤝 DRAFT DE LA TEMPORADA 4 DE CAZADORES DE CURVAS 🤝</h1>
        <h3 class="subtitulo-principal">👥 Nuevas parejas de pilotos y escuderias para la temporada. (Límite: 14 ⭐) 👥</h3>
    </div>
</main>

<div class="selector-parejas" style="max-width: 650px; margin: 20px auto; padding: 20px; background: #21252b; border-radius: 8px;">
    <h2 style="margin-top: 0;">🤝 SELECCIÓN DE PAREJAS</h2>
    
    <!-- Controles de Admin (Crear, Reset y Configurar Estrellas) -->
    <div id="controles-admin-draft" style="display: none; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        <button id="btn-crear-pareja" class="btn-crear" style="flex: 2; min-width: 140px; padding: 12px; background: #82d39d; color: #1a1a1a; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 15px;">
            <i class="fa-solid fa-plus"></i> Crear Pareja
        </button>
        <button id="btn-abrir-modal-estrellas" style="flex: 2; min-width: 140px; padding: 12px; background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 15px;">
            <i class="fa-solid fa-star"></i> Config. Estrellas
        </button>
        <button id="btn-reset-draft" style="flex: 1; min-width: 90px; padding: 12px; background: #e10600; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 15px;">
            <i class="fa-solid fa-trash-can"></i> Reset
        </button>
    </div>

    <!-- Desplegables de pilotos y contador de estrellas en tiempo real -->
    <div id="desplegables-admin-draft" style="display: none; flex-direction: column; gap: 10px;">
        <div style="display: flex; gap: 10px;">
            <select id="piloto-uno" class="select-piloto" style="padding: 10px; flex: 1; background: #1a1a1a; color: white; border: 1px solid #444; border-radius: 4px;">
                <option value="">Seleccionar Piloto 1</option>
            </select>
            <select id="piloto-dos" class="select-piloto" style="padding: 10px; flex: 1; background: #1a1a1a; color: white; border: 1px solid #444; border-radius: 4px;">
                <option value="">Seleccionar Piloto 2</option>
            </select>
        </div>
        
        <div id="contador-estrellas-vivo" style="background: #1a1a1a; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; border: 1px solid #444;">
            Estrellas de la pareja: <span id="span-total-vivo">0</span> / 14 ⭐
        </div>
    </div>

    <div id="resultado-parejas" class="resultado-parejas" style="margin-top: 20px;">
        <!-- Parejas guardadas -->
    </div>
</div>

<!-- MODAL DE CONFIGURACIÓN DE ESTRELLAS -->
<div id="modal-estrellas" class="modal-estrellas">
    <div class="modal-contenido-estrellas">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;"><i class="fa-solid fa-star" style="color: #f1c40f;"></i> Configurar Estrellas</h3>
            <button id="btn-cerrar-modal" style="background: transparent; border: none; color: white; font-size: 20px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <h4 style="border-bottom: 2px solid #444; padding-bottom: 5px; color: #82d39d;">Escuderías</h4>
        <div id="lista-escuderias-modal" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
            <!-- Se cargan por JS -->
        </div>

        <h4 style="border-bottom: 2px solid #444; padding-bottom: 5px; color: #82d39d;">Pilotos</h4>
        <div id="lista-pilotos-modal" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Se cargan por JS -->
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);
                verificarSesion();
            });

        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));
        
        cargarDatosDraft();
        configurarModalEventos();
    });

    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const controlesAdminDraft = document.getElementById('controles-admin-draft');
        const desplegablesAdminDraft = document.getElementById('desplegables-admin-draft');
        
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }

        if (controlesAdminDraft) controlesAdminDraft.style.display = adminStatus ? 'flex' : 'none';
        if (desplegablesAdminDraft) desplegablesAdminDraft.style.display = adminStatus ? 'flex' : 'none';

        renderizarParejas();
    }

    let listaPilotosGlobal = [];
    let listaEscuderiasGlobal = [];
    let parejasGuardadas = [];

    async function cargarDatosDraft() {
        try {
            const [resPilotos, resEscuderias, resParejas] = await Promise.all([
                fetch('/api/lista-de-pilotos'),
                fetch('/api/lista-de-escuderias'),
                fetch('/api/draft-parejas')
            ]);

            if (resPilotos.ok) listaPilotosGlobal = await resPilotos.json();
            if (resEscuderias.ok) listaEscuderiasGlobal = await resEscuderias.json();
            if (resParejas.ok) parejasGuardadas = await resParejas.json();

            actualizarSelects();
            calcularEstrellasEnVivo();
            renderizarParejas();
            llenarModalEstrellas();
        } catch (err) {
            console.error("Error al cargar los datos del draft:", err);
        }
    }

    function actualizarSelects() {
        const select1 = document.getElementById('piloto-uno');
        const select2 = document.getElementById('piloto-dos');
        if (!select1 || !select2) return;

        const valorActual1 = select1.value;
        const valorActual2 = select2.value;

        const idsEmparejados = parejasGuardadas.reduce((acc, p) => {
            acc.push(p.id_piloto1.toString(), p.id_piloto2.toString());
            return acc;
        }, []);

        const disponibles1 = listaPilotosGlobal.filter(p => !idsEmparejados.includes(p.id.toString()) && p.id.toString() !== valorActual2);
        const disponibles2 = listaPilotosGlobal.filter(p => !idsEmparejados.includes(p.id.toString()) && p.id.toString() !== valorActual1);

        select1.innerHTML = '<option value="">Seleccionar Piloto 1</option>' + 
            disponibles1.map(p => `<option value="${p.id}" ${valorActual1 == p.id ? 'selected' : ''}>${p.gamertag} (${p.estrellas} ⭐)</option>`).join('');

        select2.innerHTML = '<option value="">Seleccionar Piloto 2</option>' + 
            disponibles2.map(p => `<option value="${p.id}" ${valorActual2 == p.id ? 'selected' : ''}>${p.gamertag} (${p.estrellas} ⭐)</option>`).join('');
    }

    function calcularEstrellasEnVivo() {
        const id1 = document.getElementById('piloto-uno').value;
        const id2 = document.getElementById('piloto-dos').value;
        const spanTotal = document.getElementById('span-total-vivo');
        const contenedorVivo = document.getElementById('contador-estrellas-vivo');

        let total = 0;
        let escuderiaEstrellas = 0;

        if (id1) {
            const p1 = listaPilotosGlobal.find(p => p.id.toString() === id1);
            if (p1) {
                total += (p1.estrellas || 0);
                escuderiaEstrellas = (p1.escuderia_estrellas || 0);
                total += escuderiaEstrellas;
            }
        }

        if (id2) {
            const p2 = listaPilotosGlobal.find(p => p.id.toString() === id2);
            if (p2) {
                total += (p2.estrellas || 0);
            }
        }

        spanTotal.textContent = total;
        if (total > 14) {
            contenedorVivo.style.color = '#e10600';
            contenedorVivo.style.borderColor = '#e10600';
        } else {
            contenedorVivo.style.color = '#82d39d';
            contenedorVivo.style.borderColor = '#444';
        }
    }

    async function crearPareja() {
        const id1 = document.getElementById('piloto-uno').value;
        const id2 = document.getElementById('piloto-dos').value;
        
        if (!id1 || !id2) {
            alert("Debes seleccionar ambos pilotos.");
            return;
        }
        if (id1 === id2) {
            alert("Un piloto no puede hacer pareja consigo mismo.");
            return;
        }

        const p1 = listaPilotosGlobal.find(p => p.id.toString() === id1);
        const p2 = listaPilotosGlobal.find(p => p.id.toString() === id2);
        const totalEstrellas = (p1.estrellas || 0) + (p2.estrellas || 0) + (p1.escuderia_estrellas || 0);

        if (totalEstrellas > 14) {
            alert(`¡Supera el límite de estrellas! Esta pareja suma ${totalEstrellas} ⭐ y el máximo permitido es 14.`);
            return;
        }

        try {
            const response = await fetch('/api/draft-parejas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id1, id2 })
            });

            if (response.ok) {
                await cargarDatosDraft();
                document.getElementById('piloto-uno').value = "";
                document.getElementById('piloto-dos').value = "";
                calcularEstrellasEnVivo();
            } else {
                alert("Error al guardar la pareja en el servidor.");
            }
        } catch (err) {
            console.error("Error de red:", err);
            alert("Error de conexión al guardar la pareja.");
        }
    }

    async function eliminarPareja(id) {
        if (!confirm("¿Seguro que quieres eliminar esta pareja?")) return;

        try {
            const response = await fetch(`/api/draft-parejas/${id}`, { method: 'DELETE' });
            if (response.ok) await cargarDatosDraft();
            else alert("Error al eliminar la pareja.");
        } catch (err) {
            console.error(err);
        }
    }

    async function resetearDraft() {
        if (!confirm("¿Seguro que quieres borrar todas las parejas del draft?")) return;

        try {
            const response = await fetch('/api/draft-parejas', { method: 'DELETE' });
            if (response.ok) await cargarDatosDraft();
            else alert("Error al resetear el draft.");
        } catch (err) {
            console.error(err);
        }
    }

    function renderizarParejas() {
        const contenedor = document.getElementById('resultado-parejas');
        if (!contenedor) return;
        
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;

        if (parejasGuardadas.length === 0) {
            contenedor.innerHTML = '<p style="color: #888; text-align: center;">No hay parejas creadas todavía.</p>';
            return;
        }

        contenedor.innerHTML = parejasGuardadas.map((p, index) => {
            const est1 = p.estrellas1 || 0;
            const est2 = p.estrellas2 || 0;
            const estEsc = p.estrellas_escuderia1 || 0;
            const totalPareja = est1 + est2 + estEsc;

            return `
                <div class="fila-pareja" style="background: #252c35; padding: 12px 15px; margin-top: 8px; border-radius: 4px; border-left: 4px solid ${totalPareja > 14 ? '#e10600' : '#82d39d'}; display: flex; justify-content: space-between; color: #fff; align-items: center;">
                    <div>
                        <span style="font-weight: bold; color: #82d39d; margin-right: 8px;">Pareja ${index + 1}:</span>
                        <span style="font-weight: 500;">${p.nombre1} + ${p.nombre2}</span>
                        <div style="font-size: 12px; color: #aaa; margin-top: 4px;">
                            Escudería (${p.escuderia1 || 'Sin escudería'}): ${estEsc}⭐ | P1: ${est1}⭐ | P2: ${est2}⭐
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span style="background: #1a1a1a; padding: 5px 10px; border-radius: 4px; font-weight: bold; color: ${totalPareja > 14 ? '#e10600' : '#82d39d'}; border: 1px solid #444;">
                            ${totalPareja} / 14 ⭐
                        </span>
                        ${adminStatus ? `
                            <button onclick="eliminarPareja(${p.id})" style="background: #e10600; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    // GESTIÓN DE LA MODAL Y ACTUALIZACIÓN DE ESTRELLAS
    function configurarModalEventos() {
        const modal = document.getElementById('modal-estrellas');
        const btnAbrir = document.getElementById('btn-abrir-modal-estrellas');
        const btnCerrar = document.getElementById('btn-cerrar-modal');

        if (btnAbrir) btnAbrir.addEventListener('click', () => modal.style.display = 'flex');
        if (btnCerrar) btnCerrar.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    }

    function llenarModalEstrellas() {
        const contenedorEsc = document.getElementById('lista-escuderias-modal');
        const contenedorPil = document.getElementById('lista-pilotos-modal');

        if (contenedorEsc) {
            contenedorEsc.innerHTML = listaEscuderiasGlobal.map(esc => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 8px 12px; border-radius: 4px;">
                    <span>${esc.nombre}</span>
                    <input type="number" min="0" max="14" value="${esc.estrellas}" onchange="actualizarEstrellasEscuderia(${esc.id}, this.value)" style="width: 60px; padding: 5px; background: #252c35; color: white; border: 1px solid #444; border-radius: 4px; text-align: center;">
                </div>
            `).join('');
        }

        if (contenedorPil) {
            contenedorPil.innerHTML = listaPilotosGlobal.map(p => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 8px 12px; border-radius: 4px;">
                    <span>${p.gamertag} <small style="color:#888;">(${p.escuderia || 'Sin escudería'})</small></span>
                    <input type="number" min="0" max="14" value="${p.estrellas}" onchange="actualizarEstrellasPiloto(${p.id}, this.value)" style="width: 60px; padding: 5px; background: #252c35; color: white; border: 1px solid #444; border-radius: 4px; text-align: center;">
                </div>
            `).join('');
        }
    }

    async function actualizarEstrellasPiloto(idPiloto, nuevasEstrellas) {
        try {
            const res = await fetch(`/api/pilotos/${idPiloto}/estrellas`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estrellas: parseInt(nuevasEstrellas) })
            });
            if (res.ok) {
                // Recargamos los datos silenciosamente para reflejar los cambios al instante
                const resPilotos = await fetch('/api/lista-de-pilotos');
                if (resPilotos.ok) listaPilotosGlobal = await resPilotos.json();
                actualizarSelects();
                calcularEstrellasEnVivo();
                renderizarParejas();
            } else {
                alert("Error al actualizar las estrellas del piloto.");
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function actualizarEstrellasEscuderia(idEscuderia, nuevasEstrellas) {
        try {
            const res = await fetch(`/api/escuderias/${idEscuderia}/estrellas`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estrellas: parseInt(nuevasEstrellas) })
            });
            if (res.ok) {
                const resEscuderias = await fetch('/api/lista-de-escuderias');
                const resPilotos = await fetch('/api/lista-de-pilotos');
                if (resEscuderias.ok) listaEscuderiasGlobal = await resEscuderias.json();
                if (resPilotos.ok) listaPilotosGlobal = await resPilotos.json();
                calcularEstrellasEnVivo();
                renderizarParejas();
            } else {
                alert("Error al actualizar las estrellas de la escudería.");
            }
        } catch (err) {
            console.error(err);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const sel1 = document.getElementById('piloto-uno');
        const sel2 = document.getElementById('piloto-dos');
        const btnPareja = document.getElementById('btn-crear-pareja');
        const btnReset = document.getElementById('btn-reset-draft');

        if(sel1) sel1.addEventListener('change', () => { actualizarSelects(); calcularEstrellasEnVivo(); });
        if(sel2) sel2.addEventListener('change', () => { actualizarSelects(); calcularEstrellasEnVivo(); });
        if(btnPareja) btnPareja.addEventListener('click', crearPareja);
        if(btnReset) btnReset.addEventListener('click', resetearDraft);
    });
</script>
</body>
</html>
