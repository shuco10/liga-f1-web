<body>
    <div id="header-placeholder"></div>


<main class="caja-contenido">
            <!-- Botones de Acción -->
<div class="contenedor-botones">
    <a href="normativas.html" class="boton-accion">
        <i class="fa-solid fa-book"></i> Normativa
    </a>
    <a href="resoluciones-fia.html" class="boton-accion">
        <i class="fa-solid fa-gavel"></i> Resoluciones FIA

</div>
<div class="header-principal">
    <h1 class="titulo-principal">🤝 DRAFT DE LA TEMPORADA 4 DE CAZADORES DE CURVAS 🤝</h1>
    <h3 class="subtitulo-principal">👥 Nuevas parejas de pilotos y escuderias para la temporada. 👥</h3>
</div>


</main>


<div class="selector-parejas">
    <h2>🤝 SELECCIÓN DE PAREJAS</h2>
    
    <div class="controles-pareja">
        <select id="piloto-uno" class="select-piloto">
            <option value="">Seleccionar Piloto 1</option>
            <!-- Aquí se cargarán dinámicamente tus pilotos -->
        </select>

        <select id="piloto-dos" class="select-piloto">
            <option value="">Seleccionar Piloto 2</option>
            <!-- Aquí se cargarán dinámicamente tus pilotos -->
        </select>

        <button id="btn-crear-pareja" class="btn-crear">Crear Pareja</button>
    </div>

    <div id="resultado-parejas" class="resultado-parejas">
        <!-- Las parejas aparecerán aquí en orden -->
    </div>
</div>


    


    <div id="footer-placeholder"></div>

<script>
    // 1. Cargar todo en orden
    document.addEventListener('DOMContentLoaded', () => {
        // Carga el Header (una sola vez)
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Configurar el Banner de Instant Gaming
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);

                // AHORA QUE EL HEADER ESTÁ CARGADO, VERIFICAMOS SESIÓN
                verificarSesion();
            });

        // Cargar Footer y Modal
        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));
    }); // <--- AQUÍ SE CIERRA EL EVENT LISTENER CORRECTAMENTE

    // 2. Lógica de Sesión (FUERA del DOMContentLoaded)
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }
    }

    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'block';
    }



        async function enviarContacto() {
        const webhookUrl = 'https://discord.com/api/webhooks/1517947890415440045/mSZebdMcmNQpvmE1CafNS2BLLW1j74bOrYQXE8dGt43tN4rylqDvpNCr4KZ68DRDAK9x'; 
        const nombre = document.getElementById('nombre-contacto').value;
        const asunto = document.getElementById('asunto-contacto').value;
        const mensaje = document.getElementById('mensaje-contacto').value;

        // Validacion simple
        if(!nombre || !asunto || !mensaje) {
            alert("Por favor, rellena todos los campos.");
            return;
        }

        const payload = {
            content: "📢 @admin 📢 **¡Nuevo contacto desde la web!** 📢",
            embeds: [{
                title: "📩 Nuevo mensaje de contacto",
                color: 3447003,
                fields: [
                    { name: "Nombre", value: nombre, inline: true },
                    { name: "Asunto", value: asunto, inline: true },
                    { name: "Mensaje", value: mensaje }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        const res = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("¡Mensaje enviado correctamente!");
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert("Error al enviar el mensaje.");
        }
    }
let parejasGuardadas = [];

function crearPareja() {
    const select1 = document.getElementById('piloto-uno');
    const select2 = document.getElementById('piloto-dos');
    
    const id1 = select1.value;
    const id2 = select2.value;
    const nombre1 = select1.options[select1.selectedIndex]?.text;
    const nombre2 = select2.options[select2.selectedIndex]?.text;

    // Validaciones básicas
    if (!id1 || !id2) {
        alert("Debes seleccionar ambos pilotos.");
        return;
    }
    if (id1 === id2) {
        alert("Un piloto no puede hacer pareja consigo mismo.");
        return;
    }

    // Añadir a la lista de parejas
    parejasGuardadas.push({ nombre1, nombre2 });

    // Actualizar la vista de la lista
    renderizarParejas();

    // Resetear los desplegables
    select1.value = "";
    select2.value = "";
}

function renderizarParejas() {
    const contenedor = document.getElementById('resultado-parejas');
    
    contenedor.innerHTML = parejasGuardadas.map((pareja, index) => `
        <div class="fila-pareja">
            <span class="etiqueta-pareja">Pareja ${index + 1}:</span>
            <span class="nombres-pareja">${pareja.nombre1} + ${pareja.nombre2}</span>
        </div>
    `).join('');
}

document.getElementById('btn-crear-pareja').addEventListener('click', crearPareja);
    
</script>
</body>
</html>
