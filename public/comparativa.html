    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* Estilo base para el fondo de esta página */

</head>
<body>
    <div id="header-placeholder"></div>


<main class="caja-contenido">

    <div class="titulo-liga">📊 COMPARATIVA Y ESTADÍSTICAS 📊</div>
<h3 class="subtitulo-principal">📈 La plataforma integral para el seguimiento de pilotos y escuderías. 📈</h3>

                <!-- DESPLEGABLES Y DEMAS EN ESTE HUECO -->
<!-- Estructura HTML para la sección de comparativas -->
<div class="comparativa-card" style="background: #1a1a1a; padding: 20px; border-radius: 8px; color: #fff; margin-top: 20px;">
    <h2 style="color: #ff4444; margin-bottom: 15px; text-align: center;">HEAD-TO-HEAD COMPARISON</h2>
    
    <!-- Selectores de filtros -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px;">
        <select id="tipoComparacion" onchange="cambiarTipoComparacion()" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;">
            <option value="pilotos">Pilotos</option>
            <option value="escuderias">Escuderías</option>
        </select>
        
        <select id="selectItem1" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;">
            <option value="">Selecciona 1...</option>
        </select>

        <select id="selectItem2" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;">
            <option value="">Selecciona 2...</option>
        </select>

        <select id="selectMetrica" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;">
            <option value="puntos">Puntos</option>
            <option value="podios">Podios</option>
            <option value="poles">Poles</option>
            <option value="dnf">DNFs</option>
        </select>
    </div>

    <button onclick="ejecutarComparativa()" style="width: 100%; padding: 10px; background: #ff4444; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">COMPARAR</button>

    <!-- Panel de visualización de resultados -->
    <div id="panelResultadoComparativa" style="display: flex; justify-content: space-around; align-items: center; margin-top: 25px; text-align: center;">
        <div style="flex: 1;">
            <h3 id="nombreItem1" style="color: #aaa;">-</h3>
            <p id="valorItem1" style="font-size: 36px; font-weight: bold; color: #fff;">0</p>
        </div>
        <div style="font-size: 20px; font-weight: bold; color: #666; padding: 0 20px;">VS</div>
        <div style="flex: 1;">
            <h3 id="nombreItem2" style="color: #aaa;">-</h3>
            <p id="valorItem2" style="font-size: 36px; font-weight: bold; color: #fff;">0</p>
        </div>
    </div>
</div>

                <!-- DESPLEGABLES Y DEMAS EN ESTE HUECO -->

</main>



    <div id="footer-placeholder"></div>

<script>
    // 1. Cargar todo en orden
    document.addEventListener('DOMContentLoaded', () => {
        // Carga el Header (una sola vez)
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Configurar el Banner de Instant Gaming
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);

                // AHORA QUE EL HEADER ESTÁ CARGADO, VERIFICAMOS SESIÓN
                verificarSesion();
            });

        // Cargar Footer y Modal
        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));
    }); // <--- AQUÍ SE CIERRA EL EVENT LISTENER CORRECTAMENTE

    // 2. Lógica de Sesión (FUERA del DOMContentLoaded)
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }
    }

    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'block';
    }



        async function enviarContacto() {
        const webhookUrl = 'https://discord.com/api/webhooks/1517947890415440045/mSZebdMcmNQpvmE1CafNS2BLLW1j74bOrYQXE8dGt43tN4rylqDvpNCr4KZ68DRDAK9x'; 
        const nombre = document.getElementById('nombre-contacto').value;
        const asunto = document.getElementById('asunto-contacto').value;

// DESPLEGABLES Y DEMAS EN ESTE HUECO -->
// Lógica base en JavaScript para alimentar y procesar la comparativa

let resultadosGlobales = [];

        document.addEventListener('DOMContentLoaded', async () => {
            // Cargar componentes externos
            fetch('/header.html').then(res => res.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
            fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
            fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));

            // Cargar datos necesarios para la comparativa
            try {
                const resResultados = await fetch('/api/todos-los-resultados');
                resultadosGlobales = await resResultados.json();

                cambiarTipoComparacion();
            } catch (err) {
                console.error("Error al cargar datos para comparativas:", err);
            }
        });

        function cambiarTipoComparacion() {
            const tipo = document.getElementById('tipoComparacion').value;
            const select1 = document.getElementById('selectItem1');
            const select2 = document.getElementById('selectItem2');
            
            select1.innerHTML = '<option value="">Selecciona...</option>';
            select2.innerHTML = '<option value="">Selecciona...</option>';

            if (tipo === 'pilotos') {
                // Extraer pilotos únicos de los resultados para que aparezcan todos los que han corrido
                const pilotosUnicos = [...new Set(resultadosGlobales.map(r => r.gamertag || r.nombre).filter(Boolean))];
                pilotosUnicos.forEach(piloto => {
                    select1.innerHTML += `<option value="${piloto}">${piloto}</option>`;
                    select2.innerHTML += `<option value="${piloto}">${piloto}</option>`;
                });
            } else {
                // Extraer escuderías únicas de los resultados
                const escuderiasUnicas = [...new Set(resultadosGlobales.map(r => r.escuderia_nombre || r.escuderia).filter(Boolean))];
                escuderiasUnicas.forEach(esc => {
                    select1.innerHTML += `<option value="${esc}">${esc}</option>`;
                    select2.innerHTML += `<option value="${esc}">${esc}</option>`;
                });
            }
        }

        function ejecutarComparativa() {
            const tipo = document.getElementById('tipoComparacion').value;
            const item1 = document.getElementById('selectItem1').value;
            const item2 = document.getElementById('selectItem2').value;
            const metrica = document.getElementById('selectMetrica').value;

            if (!item1 || !item2) {
                alert("Por favor, selecciona ambos contrincantes para comparar.");
                return;
            }

            let val1 = 0;
            let val2 = 0;

            if (tipo === 'pilotos') {
                const stats1 = resultadosGlobales.filter(r => (r.gamertag === item1 || r.nombre === item1));
                const stats2 = resultadosGlobales.filter(r => (r.gamertag === item2 || r.nombre === item2));

                val1 = calcularMetricaPiloto(stats1, metrica);
                val2 = calcularMetricaPiloto(stats2, metrica);
            } else {
                const stats1 = resultadosGlobales.filter(r => (r.escuderia_nombre === item1 || r.escuderia === item1));
                const stats2 = resultadosGlobales.filter(r => (r.escuderia_nombre === item2 || r.escuderia === item2));

                val1 = calcularMetricaEscuderia(stats1, metrica);
                val2 = calcularMetricaEscuderia(stats2, metrica);
            }

            document.getElementById('nombreItem1').innerText = item1;
            document.getElementById('valorItem1').innerText = val1;
            document.getElementById('nombreItem2').innerText = item2;
            document.getElementById('valorItem2').innerText = val2;
        }

        function calcularMetricaPiloto(registros, metrica) {
            if (metrica === 'puntos') return registros.reduce((acc, r) => acc + (Number(r.puntos) || 0), 0);
            if (metrica === 'podios') return registros.filter(r => Number(r.posicion) >= 1 && Number(r.posicion) <= 3 && !r.dnf).length;
            if (metrica === 'poles') return registros.filter(r => r.pole === true || r.pole === 1).length;
            if (metrica === 'dnf') return registros.filter(r => r.dnf === true || r.dnf === 1).length;
            return 0;
        }

        function calcularMetricaEscuderia(registros, metrica) {
            if (metrica === 'puntos') return registros.reduce((acc, r) => acc + (Number(r.escuderia_puntos || r.puntos) || 0), 0);
            if (metrica === 'podios') return registros.filter(r => Number(r.posicion) >= 1 && Number(r.posicion) <= 3 && !r.dnf).length;
            if (metrica === 'poles') return registros.filter(r => r.pole === true || r.pole === 1).length;
            if (metrica === 'dnf') return registros.filter(r => r.dnf === true || r.dnf === 1).length;
            return 0;
        }
    


 // DESPLEGABLES Y DEMAS EN ESTE HUECO -->   
    
</script>
</body>
