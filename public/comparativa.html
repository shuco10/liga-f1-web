<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats | Cazadores de Curvas</title>
    <!-- Enlace al archivo de estilos compartido -->
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: #131823;
            --bg-select: #171e2c;
            --border-neon-red: rgba(225, 6, 0, 0.6);
            --border-neon-blue: rgba(0, 162, 255, 0.4);
            --accent-red: #e10600;
            --accent-blue: #00a2ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .caja-contenido {
            max-width: 1000px;
            margin: 0 auto 50px;
            padding: 0 15px;
        }

        .titulo-liga {
            text-align: center;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 800;
            letter-spacing: 1.5px;
            margin: 30px 15px 10px;
            color: var(--text-main);
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(225, 6, 0, 0.4);
        }

        .subtitulo-principal {
            text-align: center;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Tarjeta principal de comparativa con estilo unificado */
        .comparativa-card {
            background: var(--bg-card) !important;
            padding: 25px !important;
            border-radius: 12px !important;
            color: var(--text-main) !important;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .comparativa-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-red);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            box-shadow: 0 0 10px var(--accent-red);
        }

        .comparativa-card h2 {
            color: var(--text-main) !important;
            font-size: 1.35rem;
            margin-bottom: 20px !important;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(225, 6, 0, 0.3);
        }

        /* Selectores de filtros con diseño limpio y moderno */
        .comparativa-card select {
            padding: 12px !important;
            background: var(--bg-select) !important;
            color: var(--text-main) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 8px !important;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .comparativa-card select:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 10px rgba(0, 162, 255, 0.3);
        }

        /* Botón de comparar con estética de neón rojo */
        .comparativa-card button[onclick="ejecutarComparativa()"] {
            width: 100% !important;
            padding: 14px !important;
            background: linear-gradient(135deg, #e10600, #b30500) !important;
            color: white !important;
            border: none !important;
            font-weight: 700 !important;
            letter-spacing: 1px;
            border-radius: 8px !important;
            cursor: pointer !important;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4);
            margin-top: 10px;
        }

        .comparativa-card button[onclick="ejecutarComparativa()"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(225, 6, 0, 0.6);
        }

        /* Resultados de la comparativa */
        .resultado-comparativa {
            margin-top: 25px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .titulo-metrica-header {
            display: inline-block;
            background: rgba(0, 162, 255, 0.1);
            color: var(--accent-blue);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 162, 255, 0.3);
            text-transform: uppercase;
        }

        .item-resultado {
            background: #171e2c;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .item-resultado:hover {
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.15);
        }

        .header-tarjeta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .info-izq {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .caja-foto img.foto-piloto-card {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-blue);
        }

        .info-izq h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .caja-valor {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 162, 255, 0.4);
        }

        .contenedor-vs {
            text-align: center;
            margin: 10px 0;
        }

        .badge-vs {
            background: #0f141f;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script src="/auth.js"></script>
</head>

        <!-- Estructura HTML para la sección de comparativas -->
        <div class="comparativa-card">
            <h2>HEAD-TO-HEAD COMPARISON</h2>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px;">

                            <div class="caja-foto" id="contenedorFoto1">

                            </div>

                        </div>
                        <div class="caja-valor" id="valorItem1">0</div>

                <div class="contenedor-vs">
                    <span class="badge-vs">VS</span>
                </div>

                <!-- Tarjeta 2 -->
                <div class="item-resultado" id="tarjetaItem2">
                    <div class="header-tarjeta" id="bgItem2">
                        <div class="info-izq">
                            <div class="caja-foto" id="contenedorFoto2">
                                <img id="fotoItem2" src="" alt="" class="foto-piloto-card" style="display: none;">
                            </div>
                            <h3 id="nombreItem2">-</h3>
                        </div>
                        <div class="caja-valor" id="valorItem2">0</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

<script>
    // 1. Cargar todo en orden
    document.addEventListener('DOMContentLoaded', () => {
        // Carga el Header (una sola vez)
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Configurar el Banner de Instant Gaming
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);

                // AHORA QUE EL HEADER ESTÁ CARGADO, VERIFICAMOS SESIÓN
                verificarSesion();
            });

        // Cargar Footer y Modal
        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));
    });

    // 2. Lógica de Sesión
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }
    }

    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'block';
    }

async function enviarContacto() {
    const nombre = document.getElementById('nombre-contacto').value;
    const asunto = document.getElementById('asunto-contacto').value;
    const mensaje = document.getElementById('mensaje-contacto').value;

    if(!nombre || !asunto || !mensaje) {
        alert("Por favor, rellena todos los campos.");
        return;
    }

    try {
        const res = await fetch('/api/contacto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, asunto, mensaje })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            alert(data.message);
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert(data.error || "Error al enviar el mensaje.");
        }
    } catch (error) {
        alert("Hubo un error de conexión.");
    }
}

    let resultadosGlobales = [];

            const resEscuderias = await fetch('/api/escuderias');

    function cambiarTipoComparacion() {
        const tipo = document.getElementById('tipoComparacion').value.toLowerCase();
        const select1 = document.getElementById('selectItem1');
        const select2 = document.getElementById('selectItem2');
        const selectCircuito = document.getElementById('selectCircuito');
        
        const contenedorResultados = document.getElementById('contenedorResultados');
        if (contenedorResultados) {
            contenedorResultados.style.display = 'none';
        }
        
        select1.innerHTML = '<option value="">Selecciona...</option>';
        select2.innerHTML = '<option value="">Selecciona...</option>';

        if (tipo.includes('piloto')) {
            if (selectCircuito) selectCircuito.style.display = 'none';

            const pilotosUnicos = [...new Set(resultadosGlobales.map(r => r.gamertag).filter(Boolean))].sort();
            
            pilotosUnicos.forEach(piloto => {
                select1.innerHTML += `<option value="${piloto}">${piloto}</option>`;
                select2.innerHTML += `<option value="${piloto}">${piloto}</option>`;
            });

        } else if (tipo.includes('circuito')) {
            if (selectCircuito) selectCircuito.style.display = 'inline-block';

            let optsCircuito = '<option value="">Selecciona circuito...</option>';
            listaCircuitosF1.forEach(c => {
                optsCircuito += `<option value="${c.id}">${c.nombre}</option>`;
            });
            if (selectCircuito) selectCircuito.innerHTML = optsCircuito;

            const pilotosUnicos = [...new Set(resultadosGlobales.map(r => r.gamertag).filter(Boolean))].sort();
            let optsPilotos = '<option value="PARRILLA_COMPLETA">Parrilla Completa</option>';
            pilotosUnicos.forEach(p => {
                optsPilotos += `<option value="${p}">${p}</option>`;
            });

            select1.innerHTML = optsPilotos;
            select2.innerHTML = optsPilotos;
            select1.value = 'PARRILLA_COMPLETA';
            select2.value = 'PARRILLA_COMPLETA';

        } else {
            if (selectCircuito) selectCircuito.style.display = 'none';

            if (typeof escuderiasGlobales !== 'undefined') {
                escuderiasGlobales.forEach(esc => {
                    select1.innerHTML += `<option value="${esc.nombre}">${esc.nombre}</option>`;
                    select2.innerHTML += `<option value="${esc.nombre}">${esc.nombre}</option>`;
                });
            }
        }

        // <-- AÑADE ESTA LÍNEA AQUÍ PARA QUE COMPRUEBE EL ESTADO AL CAMBIAR DE PESTAÑA -->
        comprobarOcultarMetrica();
    }

    function comprobarOcultarMetrica() {
        const item1 = document.getElementById('selectItem1')?.value;
        const item2 = document.getElementById('selectItem2')?.value;
        const selectMetrica = document.getElementById('selectMetrica');

        if (!selectMetrica) return;

        if (item1 === 'PARRILLA_COMPLETA' || item2 === 'PARRILLA_COMPLETA') {
            selectMetrica.style.display = 'none';
        } else {
            selectMetrica.style.display = 'block';
        }
    }

async function ejecutarComparativa() {
    const contenedorResultados = document.getElementById('contenedorResultados');
    if (!document.getElementById('nombreItem1') && contenedorResultados) {
        contenedorResultados.innerHTML = `

                                <img id="fotoItem2" class="foto-piloto-card" src="" alt="" style="display: none;">
                            </div>
                            <h3 id="nombreItem2" style="white-space: nowrap; margin: 0;"></h3>
                        </div>
                        <div id="escudoCentro2" style="flex-grow: 1; text-align: center; background-size: contain; background-repeat: no-repeat; background-position: center; height: 50px;"></div>
                        
                        <!-- HUECO PARA LA POSICIÓN DEL PILOTO 2 -->
                        <div id="contenedorBadge2" style="display: flex; align-items: center; justify-content: center; padding: 0 10px;"></div>
                        
                        <div id="valorItem2" class="caja-valor">0</div>
                    </div>
                </div>
            </div>
        `;
    }
     else if (contenedorResultados) {
        // Aseguramos que los contenedores de los badges existan siempre aunque la tarjeta ya estuviera creada previamente
        const bg1 = document.getElementById('bgItem1');
        const bg2 = document.getElementById('bgItem2');
        
        if (bg1 && !document.getElementById('contenedorBadge1')) {
            const badgeDiv1 = document.createElement('div');
            badgeDiv1.id = 'contenedorBadge1';
            badgeDiv1.style.cssText = 'display: flex; align-items: center; justify-content: center; padding: 0 10px;';
            const valor1 = document.getElementById('valorItem1');
            if (valor1) bg1.insertBefore(badgeDiv1, valor1);
        }
        
        if (bg2 && !document.getElementById('contenedorBadge2')) {
            const badgeDiv2 = document.createElement('div');
            badgeDiv2.id = 'contenedorBadge2';
            badgeDiv2.style.cssText = 'display: flex; align-items: center; justify-content: center; padding: 0 10px;';
            const valor2 = document.getElementById('valorItem2');
            if (valor2) bg2.insertBefore(badgeDiv2, valor2);
        }
    }

    const tipo = (document.getElementById('selectTipoComparativa')?.value || document.getElementById('tipoComparacion')?.value || '').toLowerCase();
    const item1 = document.getElementById('selectItem1')?.value;
    const item2 = document.getElementById('selectItem2')?.value;
    const metricaSelect = document.getElementById('selectMetrica');
    const metricaTexto = metricaSelect?.options[metricaSelect.selectedIndex]?.text || 'Puntos';
    const metricaValor = metricaSelect?.value || 'puntos';

    if (tipo.includes('circuito')) {
        const circuitoSeleccionadoId = document.getElementById('selectCircuito')?.value;
        if (!circuitoSeleccionadoId) {

        // Añadimos los badges de posición correctamente asegurando el renderizado
        const esPorCircuito = tipo.includes('circuito') && Boolean(circuitoSeleccionadoId);
        if (typeof actualizarBadgePosicion === 'function') {
            actualizarBadgePosicion('1', stats1[0], esPorCircuito);
            actualizarBadgePosicion('2', stats2[0], esPorCircuito);
        }

        aplicarColoresComparativa(val1, val2, metricaValor);
        
        const circuitoObj = tipo.includes('circuito') ? listaCircuitosF1.find(c => String(c.id) === String(circuitoSeleccionadoId)) : null;
        const tituloFinal = circuitoObj ? `${metricaTexto.toUpperCase()} EN ${circuitoObj.nombre.toUpperCase()}` : metricaTexto.toUpperCase();
        
        document.getElementById('tituloMetricaComparativa').innerText = tituloFinal;
        contenedorResultados.style.display = 'block';

    } else {
        const stats1 = resultadosGlobales.filter(r => r.escuderia_nombre === item1);
        const stats2 = resultadosGlobales.filter(r => r.escuderia_nombre === item2);

        val1 = calcularMetricaEscuderia(stats1, metricaValor);
        val2 = calcularMetricaEscuderia(stats2, metricaValor);

        document.getElementById('nombreItem1').innerText = item1;
        document.getElementById('valorItem1').innerText = val1;
        document.getElementById('nombreItem2').innerText = item2;
        document.getElementById('valorItem2').innerText = val2;

        const reg1 = stats1[0] || { escuderia_nombre: item1 };
        const reg2 = stats2[0] || { escuderia_nombre: item2 };

        configurarTarjeta('1', reg1, 'escuderia');
        configurarTarjeta('2', reg2, 'escuderia');

        // Limpiamos los badges si es escudería para que no queden rastros visuales
        if(document.getElementById('contenedorBadge1')) document.getElementById('contenedorBadge1').innerHTML = '';
        if(document.getElementById('contenedorBadge2')) document.getElementById('contenedorBadge2').innerHTML = '';

        aplicarColoresComparativa(val1, val2, metricaValor);
        document.getElementById('tituloMetricaComparativa').innerText = metricaTexto.toUpperCase();
        contenedorResultados.style.display = 'block';
    }
}
    function calcularMetricaPiloto(registros, metrica) {
        if (metrica === 'puntos') return registros.reduce((acc, r) => acc + (Number(r.puntos) || 0), 0);
        if (metrica === 'victorias') return registros.filter(r => Number(r.posicion) === 1 && !r.dnf).length;
        if (metrica === 'podios') return registros.filter(r => Number(r.posicion) >= 1 && Number(r.posicion) <= 3 && !r.dnf).length;
        if (metrica === 'poles') return registros.filter(r => r.pole === true || r.pole === 1).length;
        if (metrica === 'dnf') return registros.filter(r => r.dnf === true || r.dnf === 1).length;
        return 0;
    }

    function calcularMetricaEscuderia(registros, metrica) {
        if (metrica === 'puntos') return registros.reduce((acc, r) => acc + (Number(r.puntos) || 0), 0);
        if (metrica === 'victorias') return registros.filter(r => Number(r.posicion) === 1 && !r.dnf).length;
        if (metrica === 'podios') return registros.filter(r => Number(r.posicion) >= 1 && Number(r.posicion) <= 3 && !r.dnf).length;
        if (metrica === 'poles') return registros.filter(r => r.pole === true || r.pole === 1).length;
        if (metrica === 'dnf') return registros.filter(r => r.dnf === true || r.dnf === 1).length;
        return 0;
    }

    function configurarTarjeta(idSufijo, registro, modo) {
        const headerCard = document.getElementById(`bgItem${idSufijo}`);
        const imgFoto = document.getElementById(`fotoItem${idSufijo}`);
        const contenedorFoto = document.getElementById(`contenedorFoto${idSufijo}`);

        const nombreEscuderia = registro.escuderia_nombre;

        const obtenerNombreArchivoEscuderia = (nombre) => {
            if (!nombre) return '';
            const texto = nombre.toLowerCase().trim();
            
            if (texto.includes('alpine')) return 'alpine';
            if (texto.includes('aston martin')) return 'aston_martin';
            if (texto.includes('audi')) return 'audi';
            if (texto.includes('cadillac')) return 'cadillac';
            if (texto.includes('ferrari')) return 'ferrari';
            if (texto.includes('haas')) return 'haas';
            if (texto.includes('mclaren')) return 'mclaren';
            if (texto.includes('mercedes')) return 'mercedes';
            if (texto.includes('red bull') || texto.includes('redbull')) return 'redbull';
            if (texto.includes('visa') || texto.includes('rb') || texto.includes('racing bulls')) return 'rb';
            if (texto.includes('williams')) return 'williams';

            return texto.replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
        };

        let colorEquipo = '#1f1f1f';
        const textoEscuderia = nombreEscuderia ? nombreEscuderia.toLowerCase() : '';
        
        if (textoEscuderia.includes('ferrari')) colorEquipo = '#dc0000';
        else if (textoEscuderia.includes('aston martin')) colorEquipo = '#006f62';
        else if (textoEscuderia.includes('red bull')) colorEquipo = '#0600ef';
        else if (textoEscuderia.includes('mercedes')) colorEquipo = '#00d2be';
        else if (textoEscuderia.includes('mclaren')) colorEquipo = '#ff8700';
        else if (textoEscuderia.includes('alpine')) colorEquipo = '#0090ff';
        else if (textoEscuderia.includes('williams')) colorEquipo = '#005aff';
        else if (textoEscuderia.includes('haas')) colorEquipo = '#b6babd';
        else if (textoEscuderia.includes('audi')) colorEquipo = '#e10600';
        else if (textoEscuderia.includes('cadillac')) colorEquipo = '#111111';
        else if (textoEscuderia.includes('visa') || textoEscuderia.includes('rb')) colorEquipo = '#2b4562';

        headerCard.style.backgroundColor = colorEquipo;

        const escuderiaArchivo = obtenerNombreArchivoEscuderia(nombreEscuderia);

        if (escuderiaArchivo) {
            headerCard.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('/banderas/${escuderiaArchivo}.png')`;
            headerCard.style.backgroundSize = 'contain';
            headerCard.style.backgroundRepeat = 'no-repeat';
            headerCard.style.backgroundPosition = 'center';
        } else {
            headerCard.style.backgroundImage = 'none';
        }

        if (modo === 'piloto') {
            contenedorFoto.style.display = 'flex';
            imgFoto.style.display = 'block';
            imgFoto.src = registro.foto_url || '';
        } else {
            contenedorFoto.style.display = 'none';
            imgFoto.style.display = 'none';
        }

        imgFoto.onerror = function() { 
            this.style.display = 'none'; 
        };
    }

    function aplicarColoresComparativa(val1, val2, metrica) {
        const caja1 = document.getElementById('valorItem1');
        const caja2 = document.getElementById('valorItem2');

        caja1.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
        caja2.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';

        if (val1 === val2) return;

        const esMetricaInversa = metrica.toLowerCase().includes('dnf') || 
                               metrica.toLowerCase().includes('abandono') || 
                               metrica.toLowerCase().includes('retirada');

        let gastaVerde1 = false;

        if (!esMetricaInversa) {
            gastaVerde1 = val1 > val2;
        } else {
            gastaVerde1 = val1 < val2;
        }

        const colorVerdeSuave = 'rgba(40, 167, 69, 0.45)';
        const colorRojoSuave = 'rgba(220, 53, 69, 0.45)';

        if (gastaVerde1) {
            caja1.style.backgroundColor = colorVerdeSuave;
            caja2.style.backgroundColor = colorRojoSuave;
        } else {
            caja1.style.backgroundColor = colorRojoSuave;
            caja2.style.backgroundColor = colorVerdeSuave;
        }
    }
