<script>
    // 1. Cargar todo en orden
    document.addEventListener('DOMContentLoaded', () => {
        // Carga el Header (una sola vez)
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Configurar el Banner de Instant Gaming
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);

                // AHORA QUE EL HEADER ESTÁ CARGADO, VERIFICAMOS SESIÓN

            });

        // Cargar Footer y Modal
        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));

    // 2. Lógica de Sesión (FUERA del DOMContentLoaded)
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }
    }

    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'block';
    }

// Lógica base en JavaScript para alimentar y procesar la comparativa

// 1. Rellenar los desplegables de contrincantes según elija Pilotos o Escuderías
function cambiarTipoComparacion() {
    const tipo = document.getElementById('tipoComparacion').value;
    const select1 = document.getElementById('selectItem1');
    const select2 = document.getElementById('selectItem2');
    
    select1.innerHTML = '<option value="">Selecciona 1...</option>';
    select2.innerHTML = '<option value="">Selecciona 2...</option>';

    if (tipo === 'pilotos') {
        // Extraer lista única de gamertags de tus resultados actuales
        // (Asumiendo que tienes la variable global 'resultados' cargada)
        const pilotosUnicos = [...new Set(resultados.map(r => r.gamertag))];
        pilotosUnicos.forEach(piloto => {
            select1.innerHTML += `<option value="${piloto}">${piloto}</option>`;
            select2.innerHTML += `<option value="${piloto}">${piloto}</option>`;
        });
    } else {
        // Aquí cargarías las escuderías si las tienes guardadas en otra tabla o propiedad
        const escuderiasUnicas = ["Red Bull", "Ferrari", "Mercedes", "McLaren", "Aston Martin"]; // Ejemplo
        escuderiasUnicas.forEach(escuderia => {
            select1.innerHTML += `<option value="${escuderia}">${escuderia}</option>`;
            select2.innerHTML += `<option value="${escuderia}">${escuderia}</option>`;
        });
    }
}

// 2. Calcular y pintar los datos al pulsar el botón
function ejecutarComparativa() {
    const tipo = document.getElementById('tipoComparacion').value;
    const item1 = document.getElementById('selectItem1').value;
    const item2 = document.getElementById('selectItem2').value;
    const metrica = document.getElementById('selectMetrica').value;

    if (!item1 || !item2) {
        alert("Selecciona ambos contrincantes para comparar.");
        return;
    }

    // Ejemplo de cálculo para pilotos basados en tu estructura de resultados
    let val1 = 0;
    let val2 = 0;

    if (tipo === 'pilotos') {
        const statsItem1 = resultados.filter(r => r.gamertag === item1);
        const statsItem2 = resultados.filter(r => r.gamertag === item2);

        val1 = calcularMetricaPiloto(statsItem1, metrica);
        val2 = calcularMetricaPiloto(statsItem2, metrica);
    }

    // Pintar en pantalla
    document.getElementById('nombreItem1').innerText = item1;
    document.getElementById('valorItem1').innerText = val1;
    document.getElementById('nombreItem2').innerText = item2;
    document.getElementById('valorItem2').innerText = val2;
}

function calcularMetricaPiloto(registrosPiloto, metrica) {
    if (metrica === 'puntos') {
        // Sumar puntos (asegúrate de que tus registros tengan la propiedad de puntos, o calcúlala por posición)
        return registrosPiloto.reduce((acc, r) => acc + (r.puntos || 0), 0);
    } else if (metrica === 'podios') {
        return registrosPiloto.filter(r => r.posicion <= 3 && !r.dnf).length;
    } else if (metrica === 'poles') {
        return registrosPiloto.filter(r => r.pole === true).length; // Si guardas la pole
    } else if (metrica === 'dnf') {
        return registrosPiloto.filter(r => r.dnf === true).length;
    }
    return 0;
}
