<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias | Cazadores de Curvas</title>
    <script src="/auth.js"></script>
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        #lista-noticias { padding: 20px; max-width: 800px; margin: auto; }
    </style>
    <script src="/auth.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="caja-contenido">
        <div id="mundial-pilotos" class="seccion">
            <h1>Nuestros Pilotos</h1>
            
            <h2>Campeonato Mundial de Pilotos (Titulares)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Piloto</th>
                        <th>Plataforma</th>
                        <th>Escudería</th>
                        <th>Victorias</th>
                        <th>Podios</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-pilotos"></tbody>
            </table>

            <h2 style="margin-top: 30px;">Pilotos Reserva</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Piloto</th>
                        <th>Plataforma</th>
                        <th>Escudería</th>
                        <th>Victorias</th>
                        <th>Podios</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-reservas"></tbody>
            </table>
        </div>
    </main>

    <div id="footer-placeholder"></div>

<script>
    // --- CONSTANTES DE RUTAS ---
    const FOTO_POR_DEFECTO = '/pilotos/R.png'; 
    const LOGOS_ESCUDERIAS = { 
        1: '/logos/ferrari.png', 2: '/logos/redbull.png', 3: '/logos/mclaren.png',
        4: '/logos/mercedes.png', 5: '/logos/alpine.png', 6: '/logos/aston.png',
        7: '/logos/audi.png', 8: '/logos/cadillac.png', 9: '/logos/hass.png',
        10: '/logos/rb.png', 11: '/logos/williams.png'
    }; 
    const NOMBRES_ESCUDERIAS = { 
        1: 'Ferrari', 2: 'Red Bull', 3: 'McLaren', 4: 'Mercedes', 
        5: 'Alpine', 6: 'Aston Martin', 7: 'Audi', 8: 'Cadillac', 
        9: 'Haas', 10: 'RB', 11: 'Williams' 
    };

    // --- CARGA UNIFICADA ---
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Carga de componentes de la web en paralelo
        const [headerRes, footerRes, modalRes] = await Promise.all([
            fetch('/header.html'),
            fetch('/footer.html'),
            fetch('/login-modal.html')
        ]);

        document.getElementById('header-placeholder').innerHTML = await headerRes.text();
        document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
        document.body.insertAdjacentHTML('beforeend', await modalRes.text());

        // 2. Configuración Banner Instant Gaming
        window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
        const script = document.createElement('script');
        script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
        script.defer = true;
        document.body.appendChild(script);

        // 3. Ejecución lógica inicial
        verificarSesion();
        cargarTodosLosDatos();
    });

    // --- LÓGICA DE PILOTOS ---
    async function cargarTodosLosDatos() {
        try {
            const [res, resResultados] = await Promise.all([
                fetch('/api/lista-de-pilotos'),
                fetch('/api/todos-los-resultados')
            ]);
            
            const listaPilotosGlobal = await res.json();
            const resultados = await resResultados.json();

            listaPilotosGlobal.forEach(p => {
                p.podios = resultados.filter(r => r.piloto_id === p.id && r.posicion <= 3).length;
                p.victorias = resultados.filter(r => r.piloto_id === p.id && r.posicion === 1).length;
            });

            const titulares = listaPilotosGlobal.filter(p => !p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);
            const reservas = listaPilotosGlobal.filter(p => p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);

            renderizarTabla('tabla-pilotos', titulares, false);
            renderizarTabla('tabla-reservas', reservas, true);
        } catch(e) { console.error("Error al cargar datos:", e); }
    }

    function renderizarTabla(id, data, esReserva) {
        const tabla = document.getElementById(id);
        if (!tabla) return;
        tabla.innerHTML = data.map((p, index) => {
            const rawUrl = p.foto_url && p.foto_url.trim() !== '' ? p.foto_url : 'R.png';
            const avatarUrl = rawUrl.startsWith('http') ? rawUrl : `/pilotos/${rawUrl}`;
            const logo = LOGOS_ESCUDERIAS[p.escuderia_id];
            
            return `<tr>
                <td>${esReserva ? '<span class="label-sc">S/C</span>' : index + 1}</td>
                <td><div class="piloto-contenedor">
                    <img src="${avatarUrl}" class="piloto-avatar" alt="Avatar" onerror="this.src='${FOTO_POR_DEFECTO}'">
                    <span class="numero-dorsal">${p.numero_piloto || '0'}</span>
                    <strong>${p.gamertag}</strong>
                </div></td>
                <td><span class="plataforma ${p.plataforma}">${p.plataforma}</span></td>
                <td>${esReserva ? '<span style="color: #CCFF00;">[ RESERVA ]</span>' : (logo ? `<img src="${logo}" style="width:25px; height:25px;"> ` : '') + (NOMBRES_ESCUDERIAS[p.escuderia_id] || '')}</td>
                <td>${p.victorias}</td>
                <td>${p.podios || '0'}</td>
                <td><strong>${p.puntos_totales} pts</strong></td>
            </tr>`;
        }).join('');
    }

    // --- FUNCIONES GLOBALES ---
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        } else { setTimeout(verificarSesion, 100); }
    }

    function seguridadAbrirModal() { const modal = document.getElementById('login-modal'); if (modal) modal.style.display = 'block'; }
</script>
</body>
</html>
