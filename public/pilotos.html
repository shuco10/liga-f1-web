<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilotos | Cazadores de Curvas</title>
    <script src="/auth.js"></script>
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-row: #131823;
            --bg-row-alt: #171e2c;
            --border-neon-red: rgba(225, 6, 0, 0.6);
            --border-neon-blue: rgba(0, 162, 255, 0.4);
            --accent-red: #e10600;
            --accent-blue: #00a2ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }

        .titulo-liga {
            text-align: center;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 800;
            letter-spacing: 1.5px;
            margin: 30px 15px 25px;
            color: var(--text-main);
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(225, 6, 0, 0.4);
        }

        .contenedor-sanciones-exclusivo {
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 15px;
        }

        .section-title {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            font-weight: 700;
            color: var(--text-main);
            margin: 40px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--accent-red);
            padding-left: 12px;
            text-shadow: 0 0 10px rgba(225, 6, 0, 0.3);
        }

        /* Contenedor responsivo limpio sin bordes exteriores extraños */
        .table-responsive-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
            border-radius: 10px;
            background: transparent;
        }

        .pilotos-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px; /* Separa visualmente las filas dándoles aspecto de tarjeta flotante */
            text-align: center;
            font-size: 0.9rem;
            white-space: nowrap;
            background-color: transparent;
            padding: 0 2px;
        }

        .pilotos-table th {
            background-color: #0f141f;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 14px 10px;
            border-bottom: 2px solid var(--accent-red);
        }

        .pilotos-table tbody tr {
            background-color: var(--bg-row);
            transition: all 0.25s ease;
        }

        .pilotos-table tbody tr:hover {
            background-color: var(--bg-row-alt);
            transform: scale(1.002);
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.15);
        }

        .pilotos-table td {
            padding: 12px 10px;
            vertical-align: middle;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Detalle lateral rojo neón en cada tarjeta de piloto */
        .pilotos-table tbody tr td:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            border-left: 3px solid var(--border-neon-red);
        }
        .pilotos-table tbody tr td:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        /* Anchuras y alineaciones de columnas */
        .col-pos { width: 50px; font-weight: bold; }
        .col-piloto { text-align: left !important; min-width: 210px; }
        .col-plataforma { width: 90px; }
        .col-escuderia { text-align: left !important; min-width: 190px; }
        .col-vics, .col-podios, .col-poles, .col-dnfs { width: 60px; color: var(--text-muted); }
        .col-puntos { width: 90px; font-weight: bold; color: #fff; text-shadow: 0 0 8px rgba(0, 162, 255, 0.4); }

        /* Posiciones / Podios con brillo neón */
        .pos-podio {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.88rem;
        }
        .pos-1 { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; box-shadow: 0 0 12px rgba(255, 215, 0, 0.5); }
        .pos-2 { background: linear-gradient(135deg, #e0e0e0, #94a3b8); color: #000; box-shadow: 0 0 10px rgba(224, 224, 224, 0.4); }
        .pos-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #fff; box-shadow: 0 0 10px rgba(205, 127, 50, 0.4); }

        /* Avatares y Piloto */
        .contenedor-avatar-grande {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .avatar-grande {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-blue);
            background-color: #1a1a1a;
            box-shadow: 0 0 8px rgba(0, 162, 255, 0.3);
        }

        .contenedor-estrellas {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            white-space: nowrap;
            z-index: 2;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
        }

        .numero-piloto {
            background: rgba(0, 162, 255, 0.12);
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 162, 255, 0.3);
        }

       /* --- ETIQUETAS DE PLATAFORMA (ACTUALIZADAS) --- */
        .plataforma {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.8px;
            display: inline-block;
            text-transform: uppercase;
        }
        
        /* PC: Neón Blanco Puro / Plateado brillante */
        .plataforma.PC { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(200, 210, 225, 0.25)); 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); 
        }

        /* PS5 / PlayStation: Azul clásico de Sony con neón */
        .plataforma.PS5, .plataforma.PLAYSTATION { 
            background: linear-gradient(135deg, rgba(0, 67, 156, 0.35), rgba(0, 112, 243, 0.45)); 
            color: #60a5fa; 
            border: 1px solid #0070f3; 
            box-shadow: 0 0 10px rgba(0, 112, 243, 0.45); 
        }

        /* Xbox: Verde característico de Xbox con neón */
        .plataforma.XBOX { 
            background: linear-gradient(135deg, rgba(16, 124, 16, 0.35), rgba(16, 185, 129, 0.45)); 
            color: #4ade80; 
            border: 1px solid #107c10; 
            box-shadow: 0 0 10px rgba(16, 124, 16, 0.45); 
        }

        .nombre-escuderia {
            font-size: 0.88rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ajustes Mobile */
        @media (max-width: 768px) {
            .contenedor-sanciones-exclusivo {
                padding: 0 10px;
            }
            .pilotos-table {
                font-size: 0.82rem;
            }
            .pilotos-table th, .pilotos-table td {
                padding: 10px 6px;
            }
        }
    </style>
    <script src="/auth.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>
    <div class="titulo-liga">🏆 CLASIFICACION DE PILOTOS 🏆</div>

<main class="contenedor-sanciones-exclusivo">
    <div id="mundial-pilotos">
        
        <h2 class="section-title"><i class="fa-solid fa-flag-checkered"></i> Pilotos Titulares</h2>
        <div class="table-responsive-wrapper">
            <table class="table-standings-fix pilotos-table">
                <thead>
                    <tr>
                        <th class="col-pos">Pos</th>
                        <th class="col-piloto">Piloto</th>
                        <th class="col-plataforma">Plataforma</th>                
                        <th class="col-escuderia">Escudería</th>
                        <th class="col-vics">Vic.</th>
                        <th class="col-podios">Podios</th>
                        <th class="col-poles">Poles</th>
                        <th class="col-dnfs">DNF</th>
                        <th class="col-puntos">Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-titulares"></tbody>
            </table>
        </div>

        <h2 class="section-title" style="margin-top: 45px;"><i class="fa-solid fa-helmet-safety"></i> Pilotos Reservas</h2>
        <div class="table-responsive-wrapper">
            <table class="table-standings-fix pilotos-table">
                <thead>
                    <tr>
                        <th class="col-pos">Pos</th>
                        <th class="col-piloto">Piloto</th>
                        <th class="col-plataforma">Plataforma</th>
                        <th class="col-escuderia">Escudería</th>
                        <th class="col-vics">Vic.</th>
                        <th class="col-podios">Podios</th>
                        <th class="col-poles">Poles</th>
                        <th class="col-dnfs">DNF</th>
                        <th class="col-puntos">Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-reservas"></tbody>
            </table>
        </div>

    </div>
</main>

    <div id="footer-placeholder"></div>

<script>
    // --- CONSTANTES DE RUTAS ---
        const FOTO_POR_DEFECTO = 'https://www.w3schools.com/howto/img_avatar.png';
        const NOMBRES_ESCUDERIAS = {
    1: 'Oracle Red Bull Racing',
    2: 'Scuderia Ferrari HP',
    3: 'Mercedes-AMG PETRONAS Formula One Team',
    4: 'McLaren Mastercard F1 Team',
    5: 'Aston Martin Aramco Formula One Team',
    6: 'BWT Alpine Formula One Team',
    7: 'Atlassian Williams F1 Team',
    8: 'Visa Cash App Racing Bulls Formula One Team',
    9: 'Audi Revolut F1 Team',
    10: 'TGR Haas F1 Team',
    11: 'Cadillac Formula 1 Team'
        };

        const LOGOS_ESCUDERIAS = {
            1: '/logos/redbull.png', 
            2: '/logos/ferrari.png', 
            3: '/logos/mercedes.png', 
            4: '/logos/mclaren.png',
            5: '/logos/aston.png',
            6: '/logos/alpine.png',
            7: '/logos/williams.png',
            8: '/logos/rb.png',
            9: '/logos/audi.png', 
            10: '/logos/hass.png', 
            11: '/logos/cadillac.png'
        };

    // --- CARGA UNIFICADA ---
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Carga de componentes de la web en paralelo
        const [headerRes, footerRes, modalRes] = await Promise.all([
            fetch('/header.html'),
            fetch('/footer.html'),
            fetch('/login-modal.html')
        ]);

        document.getElementById('header-placeholder').innerHTML = await headerRes.text();
        document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
        document.body.insertAdjacentHTML('beforeend', await modalRes.text());

        // 2. Configuración Banner Instant Gaming
        window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
        const script = document.createElement('script');
        script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
        script.defer = true;
        document.body.appendChild(script);

        // 3. Ejecución lógica inicial
        verificarSesion();
        cargarTodosLosDatos();
    });

 // --- LÓGICA DE PILOTOS ---
async function cargarTodosLosDatos() {
        try {
            const [res, resResultados] = await Promise.all([
                fetch('/api/lista-de-pilotos'),
                fetch('/api/todos-los-resultados')
            ]);
            
            const listaPilotosGlobal = await res.json();
            const resultados = await resResultados.json();

            const titulares = listaPilotosGlobal.filter(p => !p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);
            const reservas = listaPilotosGlobal.filter(p => p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);

            renderizarTabla('tabla-titulares', titulares, false);
            renderizarTabla('tabla-reservas', reservas, true);
        } catch(e) { console.error("Error al cargar datos:", e); }
    }

function renderizarTabla(id, data, esReserva) {
    const tabla = document.getElementById(id);
    if (!tabla) {
        console.warn(`No se encontró el elemento con ID: ${id}`);
        return;
    }

    tabla.innerHTML = data.map((p, index) => {
        // Ruta limpia
        const nombreArchivo = (p.foto_url || 'R.png').replace('pilotos/', '');
        const avatarUrl = `/pilotos/${nombreArchivo}`;
        
        // --- LÓGICA DE LAS ESTRELLAS ---
        const estrellas = (p.mundiales > 0) ? `<div class="contenedor-estrellas">${'🌟'.repeat(p.mundiales)}</div>` : '';
        
        // Lógica Podio (solo para titulares)
        const posClass = (!esReserva && index < 3) ? `pos-${index + 1}` : '';
        const posicionDisplay = esReserva ? 'S/C' : (index + 1);
        
        // Lógica Escudería con Logo
        const logoUrl = (!esReserva && LOGOS_ESCUDERIAS[p.escuderia_id]) ? LOGOS_ESCUDERIAS[p.escuderia_id] : null;
        const logoHtml = logoUrl ? `<img src="${logoUrl}" style="width: 22px; height: 22px; object-fit: contain; margin-right: 6px; vertical-align: middle;">` : '';
        
        const escuderiaCol = esReserva 
            ? '<span style="color: #38bdf8; font-weight: bold; font-size: 0.82rem; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);">[ RESERVA ]</span>' 
            : `<div style="display: flex; align-items: center; gap: 6px;">
                ${logoHtml}
                <span class="nombre-escuderia">${NOMBRES_ESCUDERIAS[p.escuderia_id] || 'Sin equipo'}</span>
               </div>`;

        return `<tr>
<td class="col-pos"><div class="pos-podio ${posClass}">${posicionDisplay}</div></td>
    <td class="col-piloto" style="text-align: left;">
        <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
            <div class="contenedor-avatar-grande">
                ${estrellas}
                <img src="${avatarUrl}" class="avatar-grande" style="flex-shrink: 0;" onerror="this.src='/pilotos/R.png'">
            </div>
            <span class="numero-piloto">${p.numero_piloto || '00'}</span>
            <strong style="overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem;">${p.gamertag}</strong>
        </div>
    </td>

    <td class="col-plataforma"><span class="plataforma ${p.plataforma.toUpperCase()}">${p.plataforma}</span></td>
    <td class="col-escuderia">${escuderiaCol}</td>
    <td class="col-vics">${p.victorias}</td>
    <td class="col-podios">${p.podios || '0'}</td>
    <td class="col-poles">${p.poles || '0'}</td>
    <td class="col-dnfs">${p.dnfs || '0'}</td>
    <td class="col-puntos"><strong>${p.puntos_totales} pts</strong></td>
</tr>`;
    }).join('');
}

    // --- FUNCIONES GLOBALES ---
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        } else { setTimeout(verificarSesion, 100); }
    }

    function seguridadAbrirModal() { const modal = document.getElementById('login-modal'); if (modal) modal.style.display = 'block'; }

async function enviarContacto() {
    const nombre = document.getElementById('nombre-contacto').value;
    const asunto = document.getElementById('asunto-contacto').value;
    const mensaje = document.getElementById('mensaje-contacto').value;

    if(!nombre || !asunto || !mensaje) {
        alert("Por favor, rellena todos los campos.");
        return;
    }

    try {
        const res = await fetch('/api/contacto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, asunto, mensaje })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            alert(data.message);
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert(data.error || "Error al enviar el mensaje.");
        }
    } catch (error) {
        alert("Hubo un error de conexión.");
    }
}
    
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/iniciar-sesion.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
