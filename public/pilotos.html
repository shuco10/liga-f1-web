<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pilotos - Cazadores de Curvas</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="https://kit.fontawesome.com/tu-codigo-fontawesome.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="caja-contenido">
        <div id="mundial-pilotos" class="seccion">
            <h1>Nuestros Pilotos</h1>
            
            <h2>Campeonato Mundial de Pilotos (Titulares)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Piloto</th>
                        <th>Plataforma</th>
                        <th>Escudería</th>
                        <th>Victorias</th>
                        <th>Podios</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-pilotos"></tbody>
            </table>

            <h2 style="margin-top: 30px;">Pilotos Reserva</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Piloto</th>
                        <th>Plataforma</th>
                        <th>Escudería</th>
                        <th>Victorias</th>
                        <th>Podios</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-reservas"></tbody>
            </table>
        </div>
    </main>

    <div id="footer-placeholder"></div>

<script>
    // --- CONSTANTES CORREGIDAS SEGÚN TU ESTRUCTURA ---
    // Nota: El navegador ya busca en 'public', por lo que usamos la ruta desde allí.
    const FOTO_POR_DEFECTO = '/pilotos/R.png'; 
    const LOGOS_ESCUDERIAS = { 
        1: '/logos/ferrari.png', 
        2: '/logos/redbull.png',
        3: '/logos/mclaren.png',
        4: '/logos/mercedes.png',
        5: '/logos/alpine.png',
        6: '/logos/aston.png',
        7: '/logos/audi.png',
        8: '/logos/cadillac.png',
        9: '/logos/hass.png',
        10: '/logos/rb.png',
        11: '/logos/williams.png'
    }; 
    const NOMBRES_ESCUDERIAS = { 
        1: 'Ferrari', 2: 'Red Bull', 3: 'McLaren', 4: 'Mercedes', 
        5: 'Alpine', 6: 'Aston Martin', 7: 'Audi', 8: 'Cadillac', 
        9: 'Haas', 10: 'RB', 11: 'Williams' 
    }; 
    let listaPilotosGlobal = [];

    document.addEventListener('DOMContentLoaded', () => {
        fetch('/header.html').then(res => res.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            // ... (resto de tu lógica de banner)
            verificarSesion();
        });

        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));

        cargarTodosLosDatos();
    });

    async function cargarTodosLosDatos() {
        try {
            const res = await fetch('/api/lista-de-pilotos');
            if (!res.ok) return;
            listaPilotosGlobal = await res.json();
            
            const resResultados = await fetch('/api/todos-los-resultados');
            const resultados = await resResultados.json();

            listaPilotosGlobal.forEach(p => {
                p.podios = resultados.filter(r => r.piloto_id === p.id && r.posicion <= 3).length;
                p.victorias = resultados.filter(r => r.piloto_id === p.id && r.posicion === 1).length;
            });

            const titulares = listaPilotosGlobal.filter(p => !p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);
            const reservas = listaPilotosGlobal.filter(p => p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);

            const tPilotos = document.getElementById('tabla-pilotos');
            if (tPilotos) {
                tPilotos.innerHTML = titulares.map((p, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td><div class="piloto-contenedor"><img src="/pilotos/${p.foto_url}" class="piloto-avatar" onerror="this.src='${FOTO_POR_DEFECTO}'"> <strong>${p.gamertag}</strong></div></td>
                        <td><span class="plataforma ${p.plataforma}">${p.plataforma}</span></td>
                        <td>${LOGOS_ESCUDERIAS[p.escuderia_id] ? `<img src="${LOGOS_ESCUDERIAS[p.escuderia_id]}" style="width:25px; height:25px;"> ` : ''} ${NOMBRES_ESCUDERIAS[p.escuderia_id] || 'Sin equipo'}</td>
                        <td>${p.victorias}</td>
                        <td>${p.podios || 0}</td>
                        <td><strong>${p.puntos_totales} pts</strong></td>
                    </tr>`).join('');
            }

            const tReservas = document.getElementById('tabla-reservas');
            if (tReservas) {
                tReservas.innerHTML = reservas.map(p => `
                    <tr>
                        <td><span class="label-sc">S/C</span></td>
                        <td><div class="piloto-contenedor"><img src="/pilotos/${p.foto_url}" class="piloto-avatar" onerror="this.src='${FOTO_POR_DEFECTO}'"> <strong>${p.gamertag}</strong></div></td>
                        <td><span class="plataforma ${p.plataforma}">${p.plataforma}</span></td>
                        <td><span style="color: #CCFF00;">[ RESERVA ]</span></td>
                        <td>${p.victorias}</td>
                        <td>${p.podios || 0}</td>
                        <td><strong>${p.puntos_totales} pts</strong></td>
                    </tr>`).join('');
            }
        } catch (err) { console.error("Error cargando pilotos:", err); }
    }

        // --- FUNCIONES GLOBALES ---
        function verificarSesion() {
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
            if (btnLogin && btnLogout) {
                btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
                btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
            } else { setTimeout(verificarSesion, 100); }
        }

        function seguridadAbrirModal() { const modal = document.getElementById('login-modal'); if (modal) modal.style.display = 'block'; }
    </script>
</body>
</html>
