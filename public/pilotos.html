<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilotos | Cazadores de Curvas</title>
    <script src="/auth.js"></script>
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        #lista-noticias { padding: 20px; max-width: 800px; margin: auto; }
    </style>
    <script src="/auth.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="caja-contenido">
        <div id="mundial-pilotos" class="seccion">
         
            
<div class="tabla-wrapper">
    <h2 class="section-title">Campeonato Mundial de Pilotos (Titulares)</h2>
    <table class="table-standings">
        <thead>
            <tr>
                <th>Pos</th><th>Piloto</th><th>Plataforma</th><th>Escudería</th><th>Victorias</th><th>Podios</th><th>Puntos</th>
            </tr>
        </thead>
        <tbody id="tabla-titulares"></tbody>
    </table>

    <h2 class="section-title">Pilotos Reservas</h2>
    <table class="table-standings">
        <thead>
            <tr>
                <th>Pos</th><th>Piloto</th><th>Plataforma</th><th>Escudería</th><th>Victorias</th><th>Podios</th><th>Puntos</th>
            </tr>
        </thead>
        <tbody id="tabla-reservas"></tbody>
    </table>
</div>
    </main>

    <div id="footer-placeholder"></div>

<script>
    // --- CONSTANTES DE RUTAS ---
        const FOTO_POR_DEFECTO = 'https://www.w3schools.com/howto/img_avatar.png';
        const NOMBRES_ESCUDERIAS = {
            1: 'Red Bull Racing', 2: 'Ferrari', 3: 'Mercedes-AMG', 4: 'McLaren',
            5: 'Aston Martin', 6: 'Alpine', 7: 'Williams', 8: 'Visa Cash App RB',
            9: 'Audi', 10: 'Haas', 11: 'Cadillac'
        };

        const LOGOS_ESCUDERIAS = {
            1: '/logos/redbull.png', 
            2: '/logos/ferrari.png', 
            3: '/logos/mercedes.png', 
            4: '/logos/mclaren.png',
            5: '/logos/aston.png',
            6: '/logos/alpine.png',
            7: '/logos/williams.png',
            8: '/logos/rb.png',
            9: '/logos/audi.png', 
            10: '/logos/hass.png', 
            11: '/logos/cadillac.png'
        };

    // --- CARGA UNIFICADA ---
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Carga de componentes de la web en paralelo
        const [headerRes, footerRes, modalRes] = await Promise.all([
            fetch('/header.html'),
            fetch('/footer.html'),
            fetch('/login-modal.html')
        ]);

        document.getElementById('header-placeholder').innerHTML = await headerRes.text();
        document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
        document.body.insertAdjacentHTML('beforeend', await modalRes.text());

        // 2. Configuración Banner Instant Gaming
        window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
        const script = document.createElement('script');
        script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
        script.defer = true;
        document.body.appendChild(script);

        // 3. Ejecución lógica inicial
        verificarSesion();
        cargarTodosLosDatos();
    });

 // --- LÓGICA DE PILOTOS ---
    async function cargarTodosLosDatos() {
        try {
            const [res, resResultados] = await Promise.all([
                fetch('/api/lista-de-pilotos'),
                fetch('/api/todos-los-resultados')
            ]);
            
            const listaPilotosGlobal = await res.json();
            const resultados = await resResultados.json();

            listaPilotosGlobal.forEach(p => {
                p.podios = resultados.filter(r => r.piloto_id === p.id && r.posicion <= 3).length;
                p.victorias = resultados.filter(r => r.piloto_id === p.id && r.posicion === 1).length;
            });

            const titulares = listaPilotosGlobal.filter(p => !p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);
            const reservas = listaPilotosGlobal.filter(p => p.es_reserva).sort((a, b) => b.puntos_totales - a.puntos_totales);

            // CORREGIDO: Ahora el ID es 'tabla-titulares' para que coincida con tu HTML
            renderizarTabla('tabla-titulares', titulares, false);
            renderizarTabla('tabla-reservas', reservas, true);
        } catch(e) { console.error("Error al cargar datos:", e); }
    }

    function renderizarTabla(id, data, esReserva) {
        const tabla = document.getElementById(id);
        if (!tabla) {
            console.warn(`No se encontró el elemento con ID: ${id}`);
            return;
        }

        tabla.innerHTML = data.map((p, index) => {
            // Ruta limpia: eliminamos prefijos de carpeta para evitar duplicados
            const nombreArchivo = (p.foto_url || 'R.png').replace('pilotos/', '');
            const avatarUrl = `/pilotos/${nombreArchivo}`;
            
            // Lógica Podio (solo para titulares)
            const posClass = (!esReserva && index < 3) ? `pos-${index + 1}` : '';
            const posicionDisplay = esReserva ? 'S/C' : (index + 1);
            
            const escuderiaCol = esReserva 
                ? '<span style="color: #CCFF00; font-weight: bold;">[ RESERVA ]</span>' 
                : (NOMBRES_ESCUDERIAS[p.escuderia_id] || 'Sin equipo');

            return `<tr>
                <td><div class="pos-podio ${posClass}">${posicionDisplay}</div></td>
                <td style="text-align: left;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="${avatarUrl}" class="piloto-avatar" onerror="this.src='/pilotos/R.png'">
                        <strong>${p.gamertag}</strong>
                    </div>
                </td>
                <td><span class="plataforma ${p.plataforma.toUpperCase()}">${p.plataforma}</span></td>
                <td>${escuderiaCol}</td>
                <td>${p.victorias}</td>
                <td>${p.podios || '0'}</td>
                <td><strong>${p.puntos_totales} pts</strong></td>
            </tr>`;
        }).join('');
    }

    // --- FUNCIONES GLOBALES ---
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        } else { setTimeout(verificarSesion, 100); }
    }

    function seguridadAbrirModal() { const modal = document.getElementById('login-modal'); if (modal) modal.style.display = 'block'; }
</script>
</body>
</html>
