<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación Oficial - Liga F1 2026</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #e10600; text-transform: uppercase; }
        .tabla-contenedor { max-width: 800px; margin: 20px auto; background-color: #262626; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #404040; }
        th { background-color: #333; color: #e10600; text-transform: uppercase; font-size: 14px; }
        tr:hover { background-color: #333; }
        .plataforma { font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .PC { background-color: #0078d4; }
        .PS5 { background-color: #ffffff; color: #00309a; }
    </style>
</head>
<body>

    <h1>🏆 Campeonato de Pilotos F1 2026 🏆</h1>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Piloto</th>
                    <th>Plataforma</th>
                    <th>Escudería</th>
                    <th>Victorias</th>
                    <th>Puntos</th>
                </tr>
            </thead>
            <tbody id="tabla-pilotos">
                </tbody>
        </table>
    </div>

    <script>
        // Código para pedir los datos al servidor en la nube y meterlos en la tabla
        fetch('/api/clasificacion-pilotos')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('tabla-pilotos');
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay datos registrados en el mundial.</td></tr>`;
                    return;
                }
                data.forEach((piloto, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${index + 1}</strong></td>
                            <td>${piloto.gamertag}</td>
                            <td><span class="plataforma ${piloto.plataforma}">${piloto.plataforma}</span></td>
                            <td style="border-left: 4px solid ${piloto.color_hex || '#444'}; padding-left: 10px;">${piloto.escuderia || 'Sin Escudería'}</td>
                            <td>${piloto.victorias}</td>
                            <td><strong>${piloto.puntos_totales} pts</strong></td>
                        </tr>
                    `;
                });
            });
    </script>
</body>
</html>
