<script>
        // NAVEGACIÓN TOTALMENTE INSTANTÁNEA Y LOCAL
        function irA(evento, idSeccion) {
            // 1. Ocultar todas las secciones
            document.querySelectorAll('.seccion').forEach(s => {
                s.style.display = 'none';
                s.classList.remove('activa');
            });
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            // 2. Mostrar solo la sección que queremos ver
            const seccionDestino = document.getElementById(idSeccion);
            if (seccionDestino) {
                seccionDestino.style.display = 'block';
                seccionDestino.classList.add('activa');
            }
            if (evento && evento.currentTarget) {
                evento.currentTarget.classList.add('active');
            }
            
            // 3. Si volvemos a las pestañas públicas, refrescamos datos sin molestar a los botones
            if(idSeccion !== 'panel-admin') {
                cargarTodosLosDatos();
            }
        }

        // CONTRASEÑA DEL PANEL DE COMISARIOS
        function verificarPassword() {
            const pass = document.getElementById('pass-comisario').value;
            if(pass === 'admin123') {
                document.getElementById('bloque-login').style.display = 'none';
                document.getElementById('contenido-admin').style.display = 'block';
                cargarDesplegablesAdmin();
            } else {
                document.getElementById('error-login').innerText = "Contraseña incorrecta. Acceso denegado.";
            }
        }

        // CARGAR DATOS DESDE EL SERVIDOR A LAS TABLAS
        async function cargarTodosLosDatos() {
            try {
                const res = await fetch('/api/clasificacion-pilotos');
                if (!res.ok) return;
                const pilotos = await res.json();
                
                // 1. Rellenar Tabla Pilotos
                const tPilotos = document.getElementById('tabla-pilotos');
                if(tPilotos) {
                    tPilotos.innerHTML = '';
                    pilotos.forEach((p, index) => {
                        tPilotos.innerHTML += `
                            <tr>
                                <td><strong>${index + 1}</strong></td>
                                <td>${p.gamertag}</td>
                                <td><span class="plataforma ${p.plataforma}">${p.plataforma}</span></td>
                                <td style="border-left: 4px solid ${p.color_hex || '#444'}; padding-left:10px;">${p.escuderia || 'Sin equipo'}</td>
                                <td>${p.victorias}</td>
                                <td><strong>${p.puntos_totales} pts</strong></td>
                            </tr>`;
                    });
                }

                // 2. Calcular y Rellenar Tabla Constructores
                const constructoresMap = {};
                pilotos.forEach(p => {
                    if(p.escuderia) {
                        if(!constructoresMap[p.escuderia]) {
                            constructoresMap[p.escuderia] = { puntos: 0, color: p.color_hex };
                        }
                        constructoresMap[p.escuderia].puntos += p.puntos_totales;
                    }
                });
                const listaConstructores = Object.keys(constructoresMap).map(name => ({ nombre: name, ...constructoresMap[name] })).sort((a,b) => b.puntos - a.puntos);
                
                const tConst = document.getElementById('tabla-constructores');
                if(tConst) {
                    tConst.innerHTML = '';
                    listaConstructores.forEach((c, index) => {
                        tConst.innerHTML += `
                            <tr>
                                <td><strong>${index + 1}</strong></td>
                                <td style="border-left: 4px solid ${c.color || '#444'}; padding-left:10px;">${c.nombre}</td>
                                <td><strong>${c.puntos} pts</strong></td>
                            </tr>`;
                    });
                }

                // 3. Rellenar Tabla de Carnet y Sanciones
                const tSanciones = document.getElementById('tabla-sanciones');
                if(tSanciones) {
                    tSanciones.innerHTML = '';
                    pilotos.forEach(p => {
                        const licenciaActual = 12 - (p.puntos_sancion || 0);
                        const estado = licenciaActual <= 0 ? '<span style="color:red; font-weight:bold;">SUSPENDIDO</span>' : '🟢 Licencia OK';
                        tSanciones.innerHTML += `
                            <tr>
                                <td>${p.gamertag}</td>
                                <td>${p.escuderia || 'Sin equipo'}</td>
                                <td><strong style="color:${licenciaActual < 5 ? 'orange':'white'}">${licenciaActual} / 12</strong></td>
                                <td>${estado}</td>
                            </tr>`;
                    });
                }
            } catch (err) {
                console.error("Error al cargar clasificaciones:", err);
            }
        }

        // CARGAR DESPLEGABLES DEL AREA DE ADMIN
        async function cargarDesplegablesAdmin() {
            try {
                const res = await fetch('/api/clasificacion-pilotos');
                const pilotos = await res.json();
                const sel1 = document.getElementById('select-piloto');
                const sel2 = document.getElementById('select-piloto-sancion');
                if(sel1 && sel2) {
                    sel1.innerHTML = ''; sel2.innerHTML = '';
                    pilotos.forEach(p => {
                        const opt = `<option value="${p.id}">${p.gamertag} (${p.escuderia || 'Sin Equipo'})</option>`;
                        sel1.innerHTML += opt; sel2.innerHTML += opt;
                    });
                }
            } catch (err) {
                console.error("Error en desplegables de admin:", err);
            }
        }

        // FORMULARIOS DE ENVÍO
        document.getElementById('form-piloto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = { gamertag: document.getElementById('gamertag').value, plataforma: document.getElementById('plataforma').value, escuderia_id: parseInt(document.getElementById('escuderia_id').value) };
            const res = await fetch('/api/nuevo-piloto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
            if(res.ok) { document.getElementById('msg-piloto').innerText = "¡Piloto inscrito!"; document.getElementById('form-piloto').reset(); cargarDesplegablesAdmin(); }
        });

        document.getElementById('form-carrera').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = { piloto_id: parseInt(document.getElementById('select-piloto').value), posicion_carrera: parseInt(document.getElementById('posicion_carrera').value) };
            const res = await fetch('/api/subir-resultado', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
            if(res.ok) { document.getElementById('msg-carrera').innerText = "¡Puntos sumados!"; document.getElementById('form-carrera').reset(); }
        });

        document.getElementById('form-sancion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = { piloto_id: parseInt(document.getElementById('select-piloto-sancion').value), puntos_restar: parseInt(document.getElementById('puntos_restar').value) };
            const res = await fetch('/api/restar-licencia', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
            if(res.ok) { document.getElementById('msg-sancion').innerText = "¡Sanción aplicada al carnet!"; document.getElementById('form-sancion').reset(); }
        });

        // Al arrancar la web por primera vez, cargamos los datos y nos aseguramos de que empiece en la primera pestaña
        window.addEventListener('DOMContentLoaded', () => {
            cargarTodosLosDatos();
            irA(null, 'mundial-pilotos');
        });
    </script>
