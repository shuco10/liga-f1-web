<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Cazadores de Curvas</title>
    <script src="/auth.js"></script>
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #121216; 
            color: #e0e0e6; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        .titulo-liga {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin: 30px 0 20px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 162, 255, 0.3);
        }

        #lista-noticias { 
            padding: 20px; 
            max-width: 800px; 
            margin: auto; 
        }

        /* Cajas de noticias translúcidas con el azul corporativo en el borde */
        .noticia-item {
            background: rgba(18, 18, 24, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 162, 255, 0.25);
            border-left: 4px solid #ff3333;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .noticia-item:hover {
            border-color: rgba(0, 162, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 162, 255, 0.15);
            transform: translateY(-2px);
        }

        .noticia-item h4 {
            color: #ffffff !important;
            font-size: 1.15em;
            margin: 0 0 10px 0;
        }

        .noticia-item h4 i {
            color: #00a2ff;
        }

        /* Estilo para el botón "Ver más" */
        .contenedor-ver-mas {
            text-align: center;
            margin: 30px 0;
        }

        #btn-ver-mas {
            background: transparent;
            color: #00a2ff;
            border: 1px solid rgba(0, 162, 255, 0.4);
            padding: 10px 25px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #btn-ver-mas:hover {
            background: rgba(0, 162, 255, 0.15);
            border-color: #00a2ff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="modal-container"></div>
    
<div class="titulo-liga">✨👋 ¡BIENVENIDOS! 👋✨</div>

<main class="caja-contenido" id="lista-noticias">
</main>

<!-- Contenedor para el botón Ver Más -->
<div class="contenedor-ver-mas" id="contenedor-ver-mas" style="display: none;">
    <button id="btn-ver-mas" onclick="mostrarTodasLasNoticias()">Ver más noticias antiguas</button>
</div>

    <div id="footer-placeholder"></div>

<script>
    let noticiasGlobales = [];

    document.addEventListener('DOMContentLoaded', () => {
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                if (typeof verificarSesion === 'function') {
                    verificarSesion();
                }

                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);
            })
            .catch(error => console.error('Error al cargar la cabecera:', error));

        fetch('/footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data);
        
        fetch('/login-modal.html')
            .then(res => res.text())
            .then(data => document.body.insertAdjacentHTML('beforeend', data));

        cargarNoticias();
    });

async function cargarNoticias() {
    const contenedor = document.getElementById('lista-noticias');
    const contenedorVerMas = document.getElementById('contenedor-ver-mas');
    if (!contenedor) return; 

    try {
        const respuesta = await fetch('/api/noticias');
        noticiasGlobales = await respuesta.json();
        
        if (noticiasGlobales.length === 0) {
            contenedor.innerHTML = '<p style="color: #666; text-align: center;">No hay avisos pendientes.</p>';
            if (contenedorVerMas) contenedorVerMas.style.display = 'none';
            return;
        }

        renderizarNoticias(5);

    } catch (error) {
        console.error("Error cargando noticias:", error);
        contenedor.innerHTML = '<p style="color: #ff4444; text-align: center;">Error al cargar las noticias.</p>';
    }
}

function renderizarNoticias(limite) {
    const contenedor = document.getElementById('lista-noticias');
    const contenedorVerMas = document.getElementById('contenedor-ver-mas');
    contenedor.innerHTML = ''; 

    const noticiasAMostrar = noticiasGlobales.slice(0, limite);

    noticiasAMostrar.forEach(noticia => {
        const div = document.createElement('div');
        div.className = 'noticia-item noticia-destacada-amarilla'; 
        
        const fechaObj = new Date(noticia.fecha);
        div.innerHTML = `
            <h4><i class="fa-solid fa-circle-info"></i> ${noticia.titulo}</h4>
            <p style="margin: 5px 0 15px 0; color: #ccc; font-size: 0.95em; line-height: 1.5;">${noticia.contenido}</p>
            <small style="color: #888;"><i class="fa-regular fa-clock"></i> ${fechaObj.toLocaleDateString()} - ${fechaObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
        `;
        contenedor.appendChild(div);
    });

    if (contenedorVerMas) {
        if (noticiasGlobales.length > limite) {
            contenedorVerMas.style.display = 'block';
        } else {
            contenedorVerMas.style.display = 'none';
        }
    }
}

function mostrarTodasLasNoticias() {
    renderizarNoticias(noticiasGlobales.length);
}

async function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    
    try {
        const res = await fetch('/api/auth/sesion');
        const data = await res.json();
        
        if (data.logueado && data.rol === 'admin') {
            localStorage.setItem('rol', 'admin');
        } else {
            localStorage.removeItem('rol');
        }
    } catch (err) {
        console.error("DEBUG: Error al contrastar sesión:", err);
    }
    
    if (btnLogin && btnLogout) {
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
    } else {
        setTimeout(() => {
            const btnLoginRetry = document.getElementById('btn-login');
            const btnLogoutRetry = document.getElementById('btn-logout');
            if (btnLoginRetry && btnLogoutRetry) {
                const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
                btnLoginRetry.style.display = adminStatus ? 'none' : 'inline-block';
                btnLogoutRetry.style.display = adminStatus ? 'inline-block' : 'none';
            }
        }, 300);
    }
}

function seguridadAbrirModal() {
    const modal = document.getElementById('login-modal');
    if (modal) modal.style.display = 'block';
}

async function enviarContacto() {
    const nombre = document.getElementById('nombre-contacto').value;
    const asunto = document.getElementById('asunto-contacto').value;
    const mensaje = document.getElementById('mensaje-contacto').value;

    if(!nombre || !asunto || !mensaje) {
        alert("Por favor, rellena todos los campos.");
        return;
    }

    try {
        const res = await fetch('/api/contacto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, asunto, mensaje })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            alert(data.message);
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert(data.error || "Error al enviar el mensaje.");
        }
    } catch (error) {
        alert("Hubo un error de conexión.");
    }
}
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/iniciar-sesion.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
