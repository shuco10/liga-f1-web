<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resoluciones - FIA | Cazadores de Curvas</title>
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        .form-resolucion { background: #2a2a2a; padding: 20px; border-radius: 8px; max-width: 600px; margin: 20px auto; }
        .form-resolucion label { display: block; margin-top: 10px; color: #ffcc00; }
        .form-resolucion select, .form-resolucion input, .form-resolucion textarea { width: 100%; padding: 8px; margin-top: 5px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; }
        .form-resolucion button { margin-top: 15px; padding: 10px; background: #ffcc00; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        /* HE ELIMINADO LA CLASE .titulo-liga DE AQUÍ PARA QUE HEREDE LA DEL CSS GLOBAL */
    </style>
    <script src="/auth.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <div class="titulo-liga">🚩 RESOLUCIONES FIA 🚩</div>

    <main class="caja-contenido">


        <div id="form-admin" class="form-resolucion" style="display: none;">
            <h3>Nueva Resolución</h3>
            <label>Piloto Reclamante:</label>
            <select id="reclamante"><option value="">Seleccione piloto...</option></select>
            
            <label>Piloto Reclamado:</label>
            <select id="reclamado"><option value="">Seleccione piloto...</option></select>
            
            <label>Artículo Aplicado:</label>
            <input type="text" id="articulo" placeholder="Ej: Artículo 7.3 - Ataque Responsable">
            
            <label>Explicación de la decisión:</label>
            <textarea id="explicacion" rows="4" placeholder="Detalle técnico de la sanción..."></textarea>
            
            <label>Sanción Aplicada:</label>
            <input type="text" id="sancion" placeholder="Ej: 5 segundos / 4p Superlicencia">
            
            <button onclick="publicarResolucion()">Publicar Resolución</button>
        </div>

<div style="margin: 30px auto; max-width: 800px; text-align: center;">
    <h3>Tarjetas de la FIA</h3>
    <div id="contenedor-resoluciones" class="resoluciones-grid" style="text-align: left;"></div>
</div>
    </main>

    <div id="footer-placeholder"></div>

<script>
    // 1. Cargar todo en orden
    document.addEventListener('DOMContentLoaded', () => {
        // Carga el Header (una sola vez)
        fetch('/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Configurar el Banner de Instant Gaming
                window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);

                // AHORA QUE EL HEADER ESTÁ CARGADO, VERIFICAMOS SESIÓN
                verificarSesion();
            });

        // Cargar Footer y Modal
        fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
        fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));

        // Cargar datos
        cargarPilotosDesdeBD();
        cargarResoluciones();
    });

    // 2. Lógica de Sesión (Unificada)
    function verificarSesion() {
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const formAdmin = document.getElementById('form-admin');
        const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
        
        if (btnLogin && btnLogout) {
            btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
            btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
        }
        
        if (formAdmin) {
            formAdmin.style.display = adminStatus ? 'block' : 'none';
        }
    }

    function seguridadAbrirModal() {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'block';
    }

    // 3. Tus funciones de API originales
    async function cargarPilotosDesdeBD() {
        try {
            const res = await fetch('/api/lista-de-pilotos');
            const listaPilotos = await res.json();
            const selectReclamante = document.getElementById('reclamante');
            const selectReclamado = document.getElementById('reclamado');
            if (selectReclamante && selectReclamado) {
                listaPilotos.forEach(p => {
                    selectReclamante.add(new Option(p.gamertag, p.gamertag));
                    selectReclamado.add(new Option(p.gamertag, p.gamertag));
                });
            }
        } catch (error) { console.error("Error pilotos:", error); }
    }

async function cargarResoluciones() {
    try {
        const res = await fetch('/api/resoluciones');
        const data = await res.json();
        
        // Buscamos el contenedor nuevo (el div, no el tbody)
        const contenedor = document.getElementById('contenedor-resoluciones');
        if (!contenedor) return;
        
        contenedor.innerHTML = data.map(r => {
            const fechaLimpia = r.fecha ? r.fecha.split('T')[0] : 'N/A';
            
            // Generamos la tarjeta en lugar de la fila
            return `
                <div class="tarjeta-resolucion">
                    <h4>${r.articulo}</h4>
                    <div class="campo-resolucion"><strong>Fecha:</strong> ${fechaLimpia}</div>
                    <div class="campo-resolucion"><strong>Reclamante:</strong> ${r.reclamante}</div>
                    <div class="campo-resolucion"><strong>Reclamado:</strong> ${r.reclamado}</div>
                    <div class="campo-resolucion" style="color: #ff4444; font-weight: bold;">
                        <strong>Sanción:</strong> ${r.sancion}
                    </div>
                    <div class="campo-resolucion" style="border-top: 1px solid #333; padding-top: 8px; margin-top: 8px; color: #cccccc; font-size: 0.9em;">
                        <em>${r.explicacion}</em>
                    </div>
                </div>
            `;
        }).join('');
        
    } catch (error) { 
        console.error("Error al cargar historial:", error); 
    }
}

    async function publicarResolucion() {
        if (!esAdmin()) return alert("Acceso denegado");
        const data = {
            reclamante: document.getElementById('reclamante').value,
            reclamado: document.getElementById('reclamado').value,
            articulo: document.getElementById('articulo').value,
            explicacion: document.getElementById('explicacion').value,
            sancion: document.getElementById('sancion').value
        };
        const res = await fetch('/api/resoluciones', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (res.ok) { alert("Publicado"); location.reload(); }
    }


        async function enviarContacto() {
        const webhookUrl = 'https://discord.com/api/webhooks/1517947890415440045/mSZebdMcmNQpvmE1CafNS2BLLW1j74bOrYQXE8dGt43tN4rylqDvpNCr4KZ68DRDAK9x'; 
        const nombre = document.getElementById('nombre-contacto').value;
        const asunto = document.getElementById('asunto-contacto').value;
        const mensaje = document.getElementById('mensaje-contacto').value;

        // Validacion simple
        if(!nombre || !asunto || !mensaje) {
            alert("Por favor, rellena todos los campos.");
            return;
        }

        const payload = {
            content: "📢 @admin 📢 **¡Nuevo contacto desde la web!** 📢",
            embeds: [{
                title: "📩 Nuevo mensaje de contacto",
                color: 3447003,
                fields: [
                    { name: "Nombre", value: nombre, inline: true },
                    { name: "Asunto", value: asunto, inline: true },
                    { name: "Mensaje", value: mensaje }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        const res = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("¡Mensaje enviado correctamente!");
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert("Error al enviar el mensaje.");
        }
    }


    
</script>


    
</body>
</html>
