<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información | Cazadores de Curvas</title>
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        .form-resolucion { background: #2a2a2a; padding: 20px; border-radius: 8px; max-width: 600px; margin: 20px auto; }
        .form-resolucion label { display: block; margin-top: 10px; color: #ffcc00; }
        .form-resolucion select, .form-resolucion input, .form-resolucion textarea { width: 100%; padding: 8px; margin-top: 5px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; }
        .form-resolucion button { margin-top: 15px; padding: 10px; background: #ffcc00; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        .titulo-liga { text-align: center; font-size: 24px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <div class="titulo-liga">🚩 RESOLUCIONES FIA 🚩</div>

    <main class="caja-contenido">
<!-- Cambia las clases de los botones -->
<div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
    <div style="background:#2a2a2a; width:300px; margin:100px auto; padding:20px; border-radius:8px; text-align:center;">
        <h3 style="color: white;">Acceso Comisarios</h3>
        <input type="password" id="pass-admin" placeholder="Contraseña" style="width:90%; margin-bottom:15px; padding: 8px; color:black;">
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="boton-accion" style="padding: 5px 15px; font-size: 14px;" onclick="verificarPass()">Entrar</button>
            <button class="boton-accion" style="padding: 5px 15px; font-size: 14px; background-color: #555;" onclick="document.getElementById('login-modal').style.display='none'">Cancelar</button>
        </div>
    </div>
</div>

        <div id="form-admin" class="form-resolucion" style="display: none;">
            <h3>Nueva Resolución</h3>
            <label>Piloto Reclamante:</label>
            <select id="reclamante"><option value="">Seleccione piloto...</option></select>
            
            <label>Piloto Reclamado:</label>
            <select id="reclamado"><option value="">Seleccione piloto...</option></select>
            
            <label>Artículo Aplicado:</label>
            <input type="text" id="articulo" placeholder="Ej: Artículo 7.3 - Ataque Responsable">
            
            <label>Explicación de la decisión:</label>
            <textarea id="explicacion" rows="4" placeholder="Detalle técnico de la sanción..."></textarea>
            
            <label>Sanción Aplicada:</label>
            <input type="text" id="sancion" placeholder="Ej: 5 segundos / 4p Superlicencia">
            
            <button onclick="publicarResolucion()">Publicar Resolución</button>
        </div>

        <div style="margin-top: 30px; max-width: 800px; margin-left: auto; margin-right: auto;">
            <h3>Historial de Resoluciones</h3>
            <table id="tabla-resoluciones" style="width:100%; border-collapse: collapse; color: white;">
                <thead>
                    <tr style="border-bottom: 1px solid #444;"><th>Fecha</th><th>Reclamante</th><th>Reclamado</th><th>Sanción</th></tr>
                </thead>
                <tbody id="cuerpo-tabla-resoluciones"></tbody>
            </table>
        </div>
    </main>

    <div id="footer-placeholder"></div>

<script>
    async function cargarPilotosDesdeBD() {
        try {
            const res = await fetch('/api/lista-de-pilotos');
            const listaPilotos = await res.json();
            const selectReclamante = document.getElementById('reclamante');
            const selectReclamado = document.getElementById('reclamado');
            listaPilotos.forEach(p => {
                selectReclamante.add(new Option(p.gamertag, p.gamertag));
                selectReclamado.add(new Option(p.gamertag, p.gamertag));
            });
        } catch (error) { console.error("Error pilotos:", error); }
    }

    async function cargarResoluciones() {
        try {
            const res = await fetch('/api/resoluciones');
            const data = await res.json();
            const tbody = document.getElementById('cuerpo-tabla-resoluciones');
            tbody.innerHTML = data.map(r => `
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 10px;">${new Date(r.fecha).toLocaleDateString()}</td>
                    <td style="padding: 10px;">${r.reclamante}</td>
                    <td style="padding: 10px;">${r.reclamado}</td>
                    <td style="padding: 10px;">${r.sancion}</td>
                </tr>
            `).join('');
        } catch (error) { console.error("Error historial:", error); }
    }

    async function publicarResolucion() {
        if (!esAdmin()) return alert("Acceso denegado");
        const data = {
            reclamante: document.getElementById('reclamante').value,
            reclamado: document.getElementById('reclamado').value,
            articulo: document.getElementById('articulo').value,
            explicacion: document.getElementById('explicacion').value,
            sancion: document.getElementById('sancion').value
        };
        const res = await fetch('/api/resoluciones', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (res.ok) { alert("Publicado"); location.reload(); }
    }

    function cerrarSesion() {
        localStorage.removeItem('rol');
        location.reload();
    }


    function verificarPass() {
    const pass = document.getElementById('pass-admin').value;
    // Sustituye 'TU_CONTRASEÑA' por la que uses en tu auth.js
    if (pass === "admin123") {
        localStorage.setItem('rol', 'admin');
        document.getElementById('login-modal').style.display = 'none';
        location.reload(); // Recarga la página ya logado
    } else {
        alert("Contraseña incorrecta");
    }
}

            // Cargar el Header y Banner
        fetch('header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                window.igBannerConfig = {
                    lang: 'es',
                    igr: 'gamer-97d22e',
                    banners: ['my-banner']
                };
                const script = document.createElement('script');
                script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                script.defer = true;
                document.body.appendChild(script);
            })
            .catch(error => console.error('Error al cargar la cabecera:', error));

    
    document.addEventListener('DOMContentLoaded', () => {
        cargarPilotosDesdeBD();
        cargarResoluciones();

        if (esAdmin()) {
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('btn-logout').style.display = 'inline-block';
            document.getElementById('form-admin').style.display = 'block';
        }

        fetch('header.html').then(res => res.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        });
        fetch('footer.html').then(res => res.text()).then(data => {
            document.getElementById('footer-placeholder').innerHTML = data;
        });
    });
</script>

<div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
    <div style="background:#2a2a2a; width:300px; margin:100px auto; padding:20px; border-radius:8px; text-align:center;">
        <h3>Acceso Comisarios</h3>
        <input type="password" id="pass-admin" placeholder="Contraseña" style="width:90%; margin-bottom:10px; color:black;">
        <button class="boton-accion" onclick="verificarPass()">Entrar</button>
        <button class="boton-accion" onclick="document.getElementById('login-modal').style.display='none'">Cancelar</button>
    </div>
</div>
    
</body>
</html>
