<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Icono para la pestaña del navegador -->
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <!-- Icono para la pestaña del navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuitos | Cazadores de Curvas</title>
    <!-- Enlace al archivo de estilos compartido -->
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    
    <style>
        /* Estilo base para el fondo de esta página */
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
    <script src="/auth.js"></script>
</head>
  <body>
   <div id="header-placeholder"></div>
    
    <div class="titulo-liga">🛣️ CALENDARIO DE CIRCUITOS 🛣️</div>
<!-- Botón de reseteo exclusivo para administradores -->
<div id="admin-reset-container" style="text-align: center; margin-bottom: 20px; display: none;">
    <button onclick="resetearResultadosTemporada()" style="background-color: #ff3333; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer;">
        🗑️ RESETEAR TODOS LOS RESULTADOS
    </button>
</div>
    <main id="lista-circuitos"></main>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Cargar Header (con Banner Instant Gaming)
            fetch('/header.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('header-placeholder').innerHTML = data;
                    window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
                    const script = document.createElement('script');
                    script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                    script.defer = true;
                    document.body.appendChild(script);
                    verificarSesion();
                })
                .catch(error => console.error('Error al cargar la cabecera:', error));

            // 2. Cargar Footer
            fetch('/footer.html')
                .then(res => res.text())
                .then(data => document.getElementById('footer-placeholder').innerHTML = data);
                
            // 3. Cargar Modal de Login
            fetch('/login-modal.html')
                .then(res => res.text())
                .then(data => document.body.insertAdjacentHTML('beforeend', data));
            
            // 4. Cargar Circuitos
            if (document.getElementById('lista-circuitos')) cargarCircuitos();
        });

async function cargarCircuitos() {
            try {
                const res = await fetch('/api/circuitos');
                const circuitosRaw = await res.json();
                const resResultados = await fetch('/api/todos-los-resultados');
                const resultados = await resResultados.json();
                const contenedor = document.getElementById('lista-circuitos');
                
                // Lista maestra con el orden, fechas y códigos de bandera para cada país
                const listaMaestra = [
                    { nombre: "Melbourne", archivo: "melburne", round: 1, fecha: "24 SEP", bandera: "au" },
                    { nombre: "Shanghái", archivo: "sangai", round: 2, fecha: "01 OCT", bandera: "cn" },
                    { nombre: "Suzuka", archivo: "suzuka", round: 3, fecha: "08 OCT", bandera: "jp" },
                    { nombre: "Sakhir", archivo: "sakir", round: 4, fecha: "15 OCT", bandera: "bh" },
                    { nombre: "Yeda", archivo: "yeda", round: 5, fecha: "22 OCT", bandera: "sa" },
                    { nombre: "Miami", archivo: "miami", round: 6, fecha: "29 OCT", bandera: "us" },
                    { nombre: "Montreal", archivo: "monreal", round: 7, fecha: "05 NOV", bandera: "ca" },
                    { nombre: "Mónaco", archivo: "montecarlo", round: 8, fecha: "12 NOV", bandera: "mc" },
                    { nombre: "Barcelona", archivo: "barcelona", round: 9, fecha: "19 NOV", bandera: "es" },
                    { nombre: "Spielberg", archivo: "spilberg", round: 10, fecha: "26 NOV", bandera: "at" },
                    { nombre: "Silverstone", archivo: "silverstone", round: 11, fecha: "03 DEC", bandera: "gb" },
                    { nombre: "Spa", archivo: "spa", round: 12, fecha: "10 DEC", bandera: "be" },
                    { nombre: "Budapest", archivo: "budapest", round: 13, fecha: "17 DEC", bandera: "hu" },
                    { nombre: "Zandvoort", archivo: "zandvoort", round: 14, fecha: "14 JAN", bandera: "nl" },
                    { nombre: "Monza", archivo: "monza", round: 15, fecha: "21 JAN", bandera: "it" },
                    { nombre: "Madrid", archivo: "madrid", round: 16, fecha: "28 JAN", bandera: "es" },
                    { nombre: "Bakú", archivo: "baku", round: 17, fecha: "04 FEB", bandera: "az" },
                    { nombre: "Singapur", archivo: "singapur", round: 18, fecha: "11 FEB", bandera: "sg" },
                    { nombre: "Austin", archivo: "austin", round: 19, fecha: "18 FEB", bandera: "us" },
                    { nombre: "Ciudad de México", archivo: "mejico", round: 20, fecha: "25 FEB", bandera: "mx" },
                    { nombre: "São Paulo", archivo: "saopaulo", round: 21, fecha: "04 MAR", bandera: "br" },
                    { nombre: "Las Vegas", archivo: "lasvegas", round: 22, fecha: "11 MAR", bandera: "us" },
                    { nombre: "Losail", archivo: "losail", round: 23, fecha: "18 MAR", bandera: "qa" },
                    { nombre: "Abu Dabi", archivo: "abudabi", round: 24, fecha: "01 APR", bandera: "ae" }
                ];

                const renderAcciones = (id) => `
                    <div class="admin-only" style="display:inline-block; margin-left: 5px;">
                        <button onclick="editarResultado(${id})" style="background:none; border:none; cursor:pointer;">✏️</button>
                        <button onclick="eliminarResultado(${id})" style="background:none; border:none; cursor:pointer; color:#ff4444;">❌</button>
                    </div>`;

                contenedor.innerHTML = listaMaestra.map(item => {
                    const c = circuitosRaw.find(x => x.nombre === item.nombre || (item.nombre === "Sakhir" && x.nombre === "Bahrein"));
                    const circuitoId = c ? c.id : null;

                    const resultadosCircuito = circuitoId ? resultados.filter(r => r.id_gp === circuitoId).sort((a, b) => a.posicion - b.posicion) : [];

                    const podio = resultadosCircuito.filter(r => r.posicion <= 3);
                    const resto = resultadosCircuito.filter(r => r.posicion > 3);
                    
                    return `
                    <div class="circuito-card" style="position: relative; overflow: hidden;">
                        <!-- Bandera de fondo con baja opacidad -->
                        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://flagcdn.com/w640/${item.bandera}.png'); background-size: cover; background-position: center; opacity: 0.08; pointer-events: none; z-index: 0;"></div>

                        <!-- Contenido de la tarjeta (con z-index superior para que esté por encima de la bandera) -->
                        <div style="position: relative; z-index: 1;">
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #ff4444; font-weight: bold; margin-bottom: 10px;">
                                <span style="font-size: 22px; letter-spacing: 1px;">ROUND ${item.round}</span>
                                <span style="font-size: 20px;">${item.fecha}</span>
                            </div>
                            <h3 class="circuito-titulo">${item.nombre}</h3>
                            <div class="circuito-imagen-container">
                                <img src="/circuitos/${item.archivo}.png" alt="${item.nombre}" onerror="this.style.display='none'">
                            </div>
                            ${podio.length > 0 ? `<div class="podio-container">${podio.map(p => `
                                <div class="podio-item pos-${p.posicion}">
                                    <strong>${p.posicion}º</strong> ${renderAcciones(p.id)}<br>
                                    <span style="font-size: 11px;">${p.gamertag}</span>
                                </div>`).join('')}</div>` : '<p class="sin-resultados">Sin resultados aún</p>'}
                            <ul class="resultados-resto">${resto.map(p => `<li class="item-resto"><span>${p.posicion}º ${p.gamertag}</span> ${renderAcciones(p.id)}</li>`).join('')}</ul>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { console.error("Error al cargar los circuitos:", e); }
        }

        
        function seguridadAbrirModal() {
            const modal = document.getElementById('login-modal');
            if (modal) modal.style.display = 'block';
            else console.warn("El modal de login aún no está cargado.");
        }

        function verificarSesion() {
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
            if (btnLogin && btnLogout) {
                btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
                btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
            } else { setTimeout(verificarSesion, 100); }
        }

        async function enviarContacto() {
            const webhookUrl = 'https://discord.com/api/webhooks/1517947890415440045/mSZebdMcmNQpvmE1CafNS2BLLW1j74bOrYQXE8dGt43tN4rylqDvpNCr4KZ68DRDAK9x'; 
            const nombre = document.getElementById('nombre-contacto').value;
            const asunto = document.getElementById('asunto-contacto').value;
            const mensaje = document.getElementById('mensaje-contacto').value;

            if(!nombre || !asunto || !mensaje) {
                alert("Por favor, rellena todos los campos.");
                return;
            }

            const payload = {
                content: "📢 @admin 📢 **¡Nuevo contacto desde la web!** 📢",
                embeds: [{
                    title: "📩 Nuevo mensaje de contacto",
                    color: 3447003,
                    fields: [
                        { name: "Nombre", value: nombre, inline: true },
                        { name: "Asunto", value: asunto, inline: true },
                        { name: "Mensaje", value: mensaje }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            const res = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("¡Mensaje enviado correctamente!");
                document.getElementById('modal-contacto').style.display = 'none';
                document.getElementById('nombre-contacto').value = '';
                document.getElementById('asunto-contacto').value = '';
                document.getElementById('mensaje-contacto').value = '';
            } else { alert("Error al enviar el mensaje."); }
        }
    </script>


      
<div id="modal-editar" style="display:none; position:fixed; top:20%; left:30%; background:#1a1a1a; padding:20px; border:2px solid #ff3333; z-index:1000; color:white; border-radius:10px;">
    <h3>Editar Posición</h3>
    <input type="hidden" id="edit-id">
    <label>Nueva Posición:</label><br>
    <input type="number" id="edit-posicion" style="width:100%; padding:8px; margin:10px 0;"><br>
    <button onclick="guardarEdicion()" style="background:#ff3333; color:white; border:none; padding:10px; cursor:pointer;">Guardar Cambios</button>
    <button onclick="document.getElementById('modal-editar').style.display='none'" style="background:#444; color:white; border:none; padding:10px; cursor:pointer;">Cancelar</button>
</div>


      
</body>
</html>
