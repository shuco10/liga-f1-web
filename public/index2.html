<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información | Cazadores de Curvas</title>
    <!-- Ruta corregida con / al inicio -->
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
    <!-- Carga de lógica global -->
    <script src="/auth.js"></script>
</head>
<body>
    <!-- Contenedores para las piezas dinámicas -->
    <div id="header-placeholder"></div>
    <div id="modal-container"></div> 

     <div class="titulo-liga">📰 NOTICIAS Y AVISOS 📰</div>
<main class="caja-contenido" id="lista-noticias">
    </main>

    <div id="footer-placeholder"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Cargar Header (ÚNICO FETCH)
    fetch('/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            
            // Configurar Banner de Instant Gaming
            window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
            const script = document.createElement('script');
            script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
            script.defer = true;
            document.body.appendChild(script);

            // Verificación de sesión justo después de inyectar el HTML
            verificarSesion();
        })
        .catch(error => console.error('Error al cargar la cabecera:', error));

    // 2. Cargar Footer
    fetch('/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data);
        
    // 3. Cargar el Modal de Login
    fetch('/login-modal.html')
        .then(res => res.text())
        .then(data => document.body.insertAdjacentHTML('beforeend', data));

    // 4. Cargar las noticias (Llamado aquí dentro para asegurar orden)
    cargarNoticias();
});

// --- Funciones de soporte fuera del DOMContentLoaded ---

async function cargarNoticias() {
    const contenedor = document.getElementById('lista-noticias');
    if (!contenedor) return; // Protección por si no existe en esta página

    try {
        const respuesta = await fetch('/api/noticias');
        const noticias = await respuesta.json();
        
        contenedor.innerHTML = ''; 
        
        if (noticias.length === 0) {
            contenedor.innerHTML = '<p style="color: #666; text-align: center;">No hay avisos pendientes.</p>';
            return;
        }

        noticias.forEach(noticia => {
            const div = document.createElement('div');
            div.className = 'noticia-item noticia-destacada-amarilla'; 
            div.style.marginBottom = "20px";
            
            const botonesAdmin = (typeof esAdmin === 'function' && esAdmin()) ? `
                <div style="margin-top: 10px; display: flex; gap: 10px;">
                    <button onclick="editarNoticia(${noticia.id}, '${noticia.titulo.replace(/'/g, "\\'")}', '${noticia.contenido.replace(/'/g, "\\'")}')" 
                            style="background:#f39c12; color:white; border:none; padding:5px 10px; cursor:pointer; border-radius:4px;">Editar</button>
                    <button onclick="eliminarNoticia(${noticia.id})" 
                            style="background:#ff4444; color:white; border:none; padding:5px 10px; cursor:pointer; border-radius:4px;">Borrar</button>
                </div>
            ` : '';

            const fechaObj = new Date(noticia.fecha);
            div.innerHTML = `
                <h4 style="margin: 0 0 10px 0; color: #ff4444;"><i class="fa-solid fa-circle-info"></i> ${noticia.titulo}</h4>
                <p style="margin: 5px 0; color: #ccc; font-size: 0.95em;">${noticia.contenido}</p>
                <small style="color: #666;"><i class="fa-regular fa-clock"></i> ${fechaObj.toLocaleDateString()} - ${fechaObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                ${botonesAdmin}
            `;
            contenedor.appendChild(div);
        });
    } catch (error) {
        console.error("Error cargando noticias:", error);
        contenedor.innerHTML = '<p style="color: #ff4444; text-align: center;">Error al cargar las noticias.</p>';
    }
}

function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
    
    if (btnLogin && btnLogout) {
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
    } else {
        setTimeout(verificarSesion, 100);
    }
}
</script>
</body>
</html>
