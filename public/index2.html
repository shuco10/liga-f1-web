<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información | Cazadores de Curvas</title>
    <!-- Ruta corregida con / al inicio -->
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
    <!-- Carga de lógica global -->
    <script src="/auth.js"></script>
</head>
<body>
    <!-- Contenedores para las piezas dinámicas -->
    <div id="header-placeholder"></div>
    <div id="modal-container"></div> 
    
    <main class="caja-contenido" id="contenedor-noticias">
    </main>

    <div id="footer-placeholder"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // 1. Cargar Header (ÚNICO FETCH)
    fetch('/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            
            // Configurar Banner de Instant Gaming
            window.igBannerConfig = {
                lang: 'es',
                igr: 'gamer-97d22e',
                banners: ['my-banner']
            };
            const script = document.createElement('script');
            script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
            script.defer = true;
            document.body.appendChild(script);

            // Verificación de sesión justo después de inyectar el HTML
            verificarSesion();
        })
        .catch(error => console.error('Error al cargar la cabecera:', error));

    // 2. Cargar Footer
    fetch('/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data);
        
    // 3. Cargar el Modal de Login
    fetch('/login-modal.html')
        .then(res => res.text())
        .then(data => document.body.insertAdjacentHTML('beforeend', data));
});

// Función centralizada
function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
    
    // Si los botones existen, aplicamos la lógica
    if (btnLogin && btnLogout) {
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
    } else {
        // Por si acaso, si no se encuentran, reintentamos en 100ms
        setTimeout(verificarSesion, 100);
    }
}
</script>
</body>
</html>
