<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información | Cazadores de Curvas</title>
    <!-- Ruta corregida con / al inicio -->
    <link rel="stylesheet" href="/estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
    <!-- Carga de lógica global -->
    <script src="/auth.js"></script>
</head>
<body>
    <!-- Contenedores para las piezas dinámicas -->
    <div id="header-placeholder"></div>
    <div id="modal-container"></div> 
    
    <main class="caja-contenido" id="contenedor-noticias">
    </main>

    <div id="footer-placeholder"></div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cargar Header, Banner y verificar sesión UNIFICADO
            fetch('/header.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('header-placeholder').innerHTML = data;
                    
                    // 1. Configurar Banner
                    window.igBannerConfig = {
                        lang: 'es',
                        igr: 'gamer-97d22e',
                        banners: ['my-banner']
                    };
                    const script = document.createElement('script');
                    script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
                    script.defer = true;
                    document.body.appendChild(script);

                    // 2. LLAMADA CLAVE: Verificar si es admin después de inyectar
                    if (typeof verificarSesion === 'function') {
                        verificarSesion();
                    }
                })
                .catch(error => console.error('Error al cargar header:', error));
            
            // Cargar Footer
            fetch('/footer.html')
                .then(res => res.text())
                .then(data => document.getElementById('footer-placeholder').innerHTML = data);

            // Cargar el Modal de Login
            fetch('/login-modal.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('modal-container').innerHTML = data;
                });
        });
    </script>
</body>
</html>
