<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Información | Cazadores de Curvas</title>
    <style>
        /* ESTO ES LO QUE HACE QUE EL FONDO SEA OSCURO IGUAL QUE TU WEB */
        body { 
            background-color: #1a1a1a; 
            color: white; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>

    <!-- 1. AQUÍ ES DONDE APARECERÁ TU CABECERA -->
    <div id="header-placeholder"></div>

    <!-- 2. AQUÍ VA EL CONTENIDO DE TU PÁGINA INFO -->
    <main style="padding: 20px; text-align: center;">
        <h1>Información del Sistema</h1>
        <p>Aquí irá el texto sobre el funcionamiento de la web...</p>
    </main>

    <!-- 3. EL SCRIPT QUE CARGA EL HEADER -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });
    </script>

</body>
</html>
