<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualizador de Estilos - Cazadores de Curvas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
 /* ==========================================================
   OPCIÓN 1: RADIAL DEEP BLUE (Elegante y con profundidad)
   Saca partido al logo central iluminando sutilmente el centro 
   y fundiéndose en negro hacia los bordes.
   ========================================================== */
body.fondo-radial {
    background: radial-gradient(circle at 50% 15%, #1e293b 0%, #090d16 65%, #020408 100%);
    background-attachment: fixed;
}

/* ==========================================================
   OPCIÓN 2: PATRÓN DE TELEMETRÍA / BOXES F1 (Técnico e industrial)
   Una rejilla milimétrica muy fina que imita las pantallas 
   de monitorización de un muro de boxes.
   ========================================================== */
body.fondo-telemetria {
    background-color: #0b0f17;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    background-attachment: fixed;
}

/* ==========================================================
   OPCIÓN 3: HAZ DE LUZ DINÁMICO (Animación de neón sutil)
   Un fondo oscuro que desplaza lentamente un haz de luz cenital 
   en tonos azulados para dar sensación de movimiento continuo.
   ========================================================== */
@keyframes moverLuz {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body.fondo-dinamico-luz {
    background: linear-gradient(120deg, #050811 0%, #0f172a 35%, #1e1b4b 50%, #0f172a 65%, #050811 100%);
    background-size: 300% 300%;
    animation: moverLuz 15s ease infinite;
    background-attachment: fixed;
}

/* ==========================================================
   OPCIÓN 4: PULSO DE RADAR / DRIFT SCANS (Efecto tecnológico vivo)
   Un fondo con un sutil gradiente animado que simula la 
   atmósfera de una retransmisión de simracing nocturna.
   ========================================================== */
@keyframes pulsoFondo {
    0% { background: radial-gradient(circle at 50% 20%, #172554 0%, #020617 70%); }
    50% { background: radial-gradient(circle at 50% 20%, #1e3a8a 0%, #020617 80%); }
    100% { background: radial-gradient(circle at 50% 20%, #172554 0%, #020617 70%); }
}

body.fondo-dinamico-pulso {
    animation: pulsoFondo 10s ease-in-out infinite;
    background-attachment: fixed;
}
    </style>
</head>
<body class="estilo-neon">

    <!-- BARRA PARA CAMBIAR DE ESTILO EN VIVO -->
    <div class="selector-barra">
        <span style="color: white; margin-right: 15px; font-weight: bold;">Cambiar estilo de prueba:</span>
<button onclick="cambiarEstilo('fondo-radial')">1. Radial Profundo</button>
<button onclick="cambiarEstilo('fondo-telemetria')">2. Rejilla Telemetría</button>
<button onclick="cambiarEstilo('fondo-dinamico-luz')">3. Dinámico (Haz de Luz)</button>
<button onclick="cambiarEstilo('fondo-dinamico-pulso')">4. Dinámico (Pulso)</button>
    </div>

    <main class="caja-contenido">
        <div class="titulo-liga">🗝️ USUARIOS: GESTIÓN 🗝️</div>
        <h3 class="subtitulo-principal">🔐 Plataforma para la creación y el mantenimiento de usuarios 🔐</h3>

        <!-- TARJETA DE EJEMPLO -->
        <div class="tarjeta-demo">
            <h3 style="margin-top: 0; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                <i class="fa-solid fa-user-plus"></i> Vista Previa de Contenedor
            </h3>
            <p style="color: #94a3b8; font-size: 0.9em; margin-bottom: 20px;">Así es como se verán los formularios y paneles de administración con este fondo y gama cromática.</p>
            
            <input type="text" class="input-demo" placeholder="Nombre de usuario de ejemplo...">
            <input type="password" class="input-demo" placeholder="Contraseña...">
            <button class="btn-accion">Ejecutar Acción</button>
        </div>
    </main>

    <script>
        function cambiarEstilo(claseEstilo) {
            document.body.className = claseEstilo;
        }
    </script>
</body>
</html>
