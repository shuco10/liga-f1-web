<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanciones | Cazadores de Curvas</title>
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
   <style>
        /* ==========================================
           ESTILOS GENERALES Y LAVADO DE CARA
           ========================================== */
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        .titulo-liga { 
            text-align: center; 
            font-size: 28px; 
            margin: 30px 0 10px 0; 
            font-weight: 800; 
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .contenedor-sanciones-exclusivo {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ==========================================
           ZONA DE PELIGRO (ADMIN)
           ========================================== */
        #zona-reset {
            background: linear-gradient(145deg, #1a1a1a, #151515);
            border: 1px solid rgba(225, 6, 0, 0.3);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            margin-bottom: 30px;
            text-align: center;
            padding: 20px;
        }

        #zona-reset h3 {
            margin-top: 0;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        #btn-reset-sanciones {
            background: linear-gradient(135deg, #e10600, #b30500);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(225, 6, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 10px auto 0 auto;
        }

        #btn-reset-sanciones:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(225, 6, 0, 0.6);
            background: linear-gradient(135deg, #ff0700, #c80600);
        }

        /* ==========================================
           CONTENEDOR Y TABLA DE SANCIONES (CON VIDA Y COLOR)
           ========================================== */
        .table-wrapper {
            background: #161922; /* Fondo oscuro con un sutil matiz azulado */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 102, 255, 0.2); /* Sutil borde azul corporativo */
            overflow-x: auto;
        }

        .table-standings-fix { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left;
            white-space: nowrap;
        }

        .table-standings-fix th {
            /* Degradado corporativo azul y oscuro para la cabecera */
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #38bdf8; /* Azul claro brillante para los títulos */
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 2px solid #0066ff; /* Línea de acento azul en la cabecera */
            text-transform: uppercase;
        }

        .table-standings-fix td { 
            padding: 14px 20px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.04); 
            vertical-align: middle; 
            font-size: 0.95rem;
        }

        .table-standings-fix tbody tr {
            transition: all 0.2s ease;
        }

       .table-standings-fix tbody tr {
            transition: background-color 0.2s ease, border-left-color 0.2s ease !important;
            border-left: 4px solid transparent; /* Espacio reservado a la izquierda */
        }

        /* Efecto cebra para diferenciar filas y darles vida */
        .table-standings-fix tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.015) !important;
        }

        /* Al pasar el ratón: fondo suave y franja roja corporativa bien acoplada */
        .table-standings-fix tbody tr:hover {
            background-color: rgba(225, 6, 0, 0.06) !important;
            border-left: 4px solid #e10600 !important; /* Barra roja limpia sin desbordes */
        }

        /* ==========================================
           ELEMENTOS DE LA TABLA (Avatares, Escuderías)
           ========================================== */
        .piloto-avatar { 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid #e10600; 
            background-color: #2a2a2a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .numero-piloto {
            font-weight: 800;
            color: #38bdf8; /* Dorsal en tono azulado para darle chispa */
            font-size: 0.9rem;
            min-width: 25px;
            display: inline-block;
        }

        .logo-escuderia { 
            width: 26px; 
            height: 26px; 
            object-fit: contain;
            vertical-align: middle; 
            margin-right: 8px; 
        }

        .badge-reserva {
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* ==========================================
           BARRAS DE PROGRESO Y ESTADOS DE LICENCIA
           ========================================== */
        .contenedor-barra { 
            width: 120px; 
            background: #2a2a2a; 
            height: 8px; 
            border-radius: 4px; 
            margin-top: 6px; 
            overflow: hidden; 
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .barra-progreso { 
            height: 100%; 
            border-radius: 4px; 
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* Adaptabilidad en móviles */
        @media (max-width: 768px) {
            .titulo-liga { font-size: 22px; }
            .table-standings-fix th, .table-standings-fix td { padding: 12px 10px; font-size: 0.85rem; }
            .contenedor-barra { width: 80px; }
            .piloto-avatar { width: 34px; height: 34px; }
        }
    </style>
<script src="/auth.js"></script>

</head>
<body>
    <div id="header-placeholder"></div>
    
    <div class="titulo-liga">👨‍⚖️ TABLA DE SANCIONES 👨‍⚖️</div>

<div class="contenedor-sanciones-exclusivo">
 
    <h2 class="section-title">Puntos de los Pilotos y Sanciones</h2>

    
        <div id="zona-reset" class="admin-only" style="display: none;">
            <h3 style="color: #ff4444;"><i class="fa-solid fa-triangle-exclamation"></i> Zona de Peligro</h3>
            <button id="btn-reset-sanciones" 
            style="display:none;"
            onclick="resetearSanciones()">
            ⚠️ RESETEAR TODAS LAS SANCIONES Y AVISOS ⚠️
            </button>
        </div>    

    
    <div class="table-wrapper">
        <table class="table-standings-fix">
            <thead>
                <tr>
                    <th class="col-piloto">PILOTO</th>
                    <th class="col-escuderia">ESCUDERIA</th>
                    <th class="col-avisos">AVISOS</th>
                    <th class="col-penalizacion">Nº SANCIONES</th>
                    <th class="col-apto">APTO</th>
                    <th class="col-licencia">LICENCIA</th>
                </tr>
            </thead>
            <tbody id="tabla-sanciones">
                </tbody>
        </table>
    </div>
</div>

    <div id="footer-placeholder"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Cargar Header
    fetch('/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
            const script = document.createElement('script');
            script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
            script.defer = true;
            document.body.appendChild(script);
            verificarSesion();
        });

    // 2. Cargar Footer y Modal
    fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
    fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));
});

// 1. Diccionarios de referencia
    const NOMBRES_ESCUDERIAS = {
        1: 'Red Bull Racing', 2: 'Ferrari', 3: 'Mercedes-AMG', 4: 'McLaren',
        5: 'Aston Martin', 6: 'Alpine', 7: 'Williams', 8: 'Visa Cash App RB',
        9: 'Audi', 10: 'Haas', 11: 'Cadillac'
    };

    const LOGOS_ESCUDERIAS = {
        1: '/logos/redbull.png', 2: '/logos/ferrari.png', 3: '/logos/mercedes.png', 
        4: '/logos/mclaren.png', 5: '/logos/aston.png', 6: '/logos/alpine.png',
        7: '/logos/williams.png', 8: '/logos/rb.png', 9: '/logos/audi.png', 
        10: '/logos/hass.png', 11: '/logos/cadillac.png'
    };

    document.addEventListener('DOMContentLoaded', async () => {
        await Promise.all([fetch('/header.html'), fetch('/footer.html'), fetch('/login-modal.html')]);
        
        const res = await fetch('/api/lista-de-pilotos');
        const listaPilotos = await res.json();
        
        renderizarSanciones(listaPilotos);
    });

function renderizarSanciones(pilotos) {
    if (!pilotos || !Array.isArray(pilotos)) return;

    const body = document.getElementById('tabla-sanciones'); 
    if (!body) return;
    body.innerHTML = "";

    pilotos.forEach(p => {
        const totalAvisos = Number(p.total_avisos) || 0; 
        const puntosSancionManuales = Number(p.puntos_sancion) || 0;

        const numPenalizaciones = Math.floor(totalAvisos / 3);
        const totalRestar = puntosSancionManuales + numPenalizaciones;
        const licenciaActual = Math.max(0, 12 - totalRestar);
        
        const porcentaje = (licenciaActual / 12) * 100;

        // Escala de colores dinámica según la licencia
        let color = "#2ecc71"; // Verde (5-12)
        if (licenciaActual <= 2) color = "#e74c3c"; // Rojo (0-2)
        else if (licenciaActual <= 4) color = "#f1c40f"; // Amarillo (3-4)
        
        const estado = licenciaActual <= 0 ? "SUSP." : "OK";

        const esReserva = p.es_reserva;
        const nombreEquipo = esReserva ? '<span class="badge-reserva">[ RESERVA ]</span>' : (NOMBRES_ESCUDERIAS[p.escuderia_id] || 'Desconocido');
        const logoEquipo = esReserva ? '' : `<img src="${LOGOS_ESCUDERIAS[p.escuderia_id] || ''}" class="logo-escuderia" onerror="this.style.display='none'">`;
        const nombreArchivo = p.foto_url ? p.foto_url.split('/').pop() : 'R.png';
        const rutaAvatar = `/pilotos/${nombreArchivo}`;

        body.innerHTML += `
            <tr>
                <td style="text-align: left; padding-left: 20px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <img src="${rutaAvatar}" class="piloto-avatar" onerror="this.src='/pilotos/R.png'"> 
                        <span class="numero-piloto">${p.numero_piloto || '00'}</span>
                        <strong style="font-size: 1.05em; color: #fff;">${p.gamertag}</strong>
                    </div>
                </td>
                <td><div style="display: flex; align-items: center;">${logoEquipo} <span style="font-weight: 500;">${nombreEquipo}</span></div></td>
                <td style="font-weight: 600; text-align: center;">${totalAvisos}</td> 
                <td style="font-weight:bold; color: #ff4444; text-align: center;">${totalRestar}</td> 
                <td style="font-weight:bold; color:${color}; text-align: center;">${estado}</td>
                <td>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <span style="font-weight: 600; font-size: 0.9rem; color:${color}">${licenciaActual} / 12</span>
                    </div>
                    <div class="contenedor-barra">
                        <div class="barra-progreso" style="width:${porcentaje}%; background:${color}"></div>
                    </div>
                </td>
            </tr>
        `;
    });
}
    
function seguridadAbrirModal() {
    const modal = document.getElementById('login-modal');
    if (modal) modal.style.display = 'block';
}

async function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    
    let adminStatus = (typeof esAdmin === 'function') ? esAdmin() : (localStorage.getItem('rol') === 'admin');
    
    if (!adminStatus) {
        try {
            const res = await fetch('/api/auth/sesion');
            const data = await res.json();
            
            if (data.logueado && data.rol === 'admin') {
                adminStatus = true;
                localStorage.setItem('rol', 'admin');
            }
        } catch (err) {
            console.error("Error al contrastar sesión con la base de datos en sanciones:", err);
        }
    }
    
    if (btnLogin && btnLogout) {
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
    } else {
        setTimeout(verificarSesion, 100);
    }
}

async function enviarContacto() {
    const nombre = document.getElementById('nombre-contacto').value;
    const asunto = document.getElementById('asunto-contacto').value;
    const mensaje = document.getElementById('mensaje-contacto').value;

    if(!nombre || !asunto || !mensaje) {
        alert("Por favor, rellena todos los campos.");
        return;
    }

    try {
        const res = await fetch('/api/contacto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, asunto, mensaje })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            alert(data.message);
            document.getElementById('modal-contacto').style.display = 'none';
            document.getElementById('nombre-contacto').value = '';
            document.getElementById('asunto-contacto').value = '';
            document.getElementById('mensaje-contacto').value = '';
        } else {
            alert(data.error || "Error al enviar el mensaje.");
        }
    } catch (error) {
        alert("Hubo un error de conexión.");
    }
}

async function resetearSanciones() {
    if (!confirm("¿ESTÁS SEGURO? Esto borrará todos los avisos y reseteará la superlicencia a 12 de todos los pilotos.")) return;

    const res = await fetch('/api/reset-sanciones-totales', { method: 'POST' });
    if (res.ok) {
        alert("Sanciones reseteadas con éxito.");
        location.reload();
    } else {
        alert("Error al resetear.");
    }
}

document.addEventListener("DOMContentLoaded", function() {
    // Verificamos si el usuario es administrador de forma directa
    const esAdminUser = (typeof esAdmin === 'function' && esAdmin()) || (localStorage.getItem('rol') === 'admin');
    
    const zonaReset = document.getElementById('zona-reset');
    const btnReset = document.getElementById('btn-reset-sanciones');

    if (esAdminUser) {
        if (zonaReset) zonaReset.style.display = 'block';
        if (btnReset) btnReset.style.display = 'inline-flex'; // o 'block'
    } else {
        if (zonaReset) zonaReset.style.display = 'none';
    }
});
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/iniciar-sesion.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
