<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/webimagenes/cazadoresdecurvas .png" type="image/png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanciones | Cazadores de Curvas</title>
    <link rel="stylesheet" href="estilos-cabecera.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; padding: 0; font-family: sans-serif; }
        .titulo-liga { text-align: center; font-size: 24px; margin: 20px 0; font-weight: bold; }
        
        /* Estilos tabla sanciones */
        .tabla-sanciones { width: 90%; margin: 20px auto; border-collapse: collapse; background: #222; border-radius: 8px; overflow: hidden; }
        .tabla-sanciones th, .tabla-sanciones td { padding: 15px; border-bottom: 1px solid #333; text-align: center; }
        .avatar-piloto { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #e10600; vertical-align: middle; margin-right: 10px; }
        .logo-escuderia { width: 30px; height: 30px; vertical-align: middle; margin-right: 8px; }
        .contenedor-barra { width: 100px; background: #333; height: 10px; border-radius: 5px; margin: 5px auto; overflow: hidden; }
        .barra-progreso { height: 100%; border-radius: 5px; transition: width 0.3s; }
    </style>
<script src="/auth.js"></script>
<script src="/server.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <div class="titulo-liga">👨‍⚖️ TABLA DE SANCIONES 👨‍⚖️</div>

<div class="caja-contenido">
    <h2 class="section-title">TABLA DE SANCIONES</h2>
    <div class="table-wrapper">
        <table class="table-standings">
            <thead>
                <tr>
                    <th style="width: 250px;">PILOTO</th>
                    <th style="width: 200px;">ESCUDERÍA</th>
                    <th style="width: 100px;">ESTADO</th>
                    <th style="width: 150px;">LICENCIA</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                </tbody>
        </table>
    </div>
</div>

    <div id="footer-placeholder"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Cargar Header
    fetch('/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            window.igBannerConfig = { lang: 'es', igr: 'gamer-97d22e', banners: ['my-banner'] };
            const script = document.createElement('script');
            script.src = "https://www.instant-gaming.com/api/banner/partner/loader.js";
            script.defer = true;
            document.body.appendChild(script);
            verificarSesion();
        });

    // 2. Cargar Footer y Modal
    fetch('/footer.html').then(res => res.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
    fetch('/login-modal.html').then(res => res.text()).then(data => document.body.insertAdjacentHTML('beforeend', data));

    // 3. Renderizar sanciones al cargar
    renderizarSanciones();
});

// 1. Diccionarios de referencia (Igual que en pilotos.html)
    const NOMBRES_ESCUDERIAS = {
        1: 'Red Bull Racing', 2: 'Ferrari', 3: 'Mercedes-AMG', 4: 'McLaren',
        5: 'Aston Martin', 6: 'Alpine', 7: 'Williams', 8: 'Visa Cash App RB',
        9: 'Audi', 10: 'Haas', 11: 'Cadillac'
    };

    const LOGOS_ESCUDERIAS = {
        1: '/logos/redbull.png', 2: '/logos/ferrari.png', 3: '/logos/mercedes.png', 
        4: '/logos/mclaren.png', 5: '/logos/aston.png', 6: '/logos/alpine.png',
        7: '/logos/williams.png', 8: '/logos/rb.png', 9: '/logos/audi.png', 
        10: '/logos/hass.png', 11: '/logos/cadillac.png'
    };

    document.addEventListener('DOMContentLoaded', async () => {
        // Carga de componentes y datos
        await Promise.all([fetch('/header.html'), fetch('/footer.html'), fetch('/login-modal.html')]);
        
        // Cargar datos de pilotos desde tu API
        const res = await fetch('/api/lista-de-pilotos');
        const listaPilotos = await res.json();
        
        renderizarSanciones(listaPilotos);
    });

function renderizarSanciones(pilotos) {
    const body = document.getElementById('tabla-body');
    body.innerHTML = "";

    pilotos.forEach(p => {
        // 1. CÁLCULOS
        const puntosSancion = p.puntos_sancion || 0;
        const licenciaActual = 12 - puntosSancion;
        const porcentaje = (licenciaActual / 12) * 100;

        // 2. LÓGICA DE ESTILOS (Colores según rangos)
        let color = "#2ecc71"; // Verde por defecto
        if (licenciaActual <= 2) color = "#e74c3c";      // Rojo (1-2 pts)
        else if (licenciaActual <= 4) color = "#f1c40f"; // Amarillo (3-4 pts)
        
        const estado = licenciaActual <= 0 ? "SUSP." : "OK";

        // 3. DATOS DE ESCUDERÍA Y AVATAR
        const esReserva = p.es_reserva;
        const nombreEquipo = esReserva ? '<span class="badge-reserva">[ RESERVA ]</span>' : (NOMBRES_ESCUDERIAS[p.escuderia_id] || 'Desconocido');
        const logoEquipo = esReserva ? '' : `<img src="${LOGOS_ESCUDERIAS[p.escuderia_id]}" class="logo-escuderia">`;
        
        const nombreArchivo = p.foto_url ? p.foto_url.split('/').pop() : 'default.png';
        const rutaAvatar = `/pilotos/${nombreArchivo}`;

        // 4. RENDERIZADO
        body.innerHTML += `
            <tr>
                <td style="text-align: left; padding-left: 20px;">
                    <img src="${rutaAvatar}" class="piloto-avatar" onerror="this.src='https://www.w3schools.com/howto/img_avatar.png'"> 
                    ${p.gamertag}
                </td>
                <td>${logoEquipo} ${nombreEquipo}</td>
                <td style="font-weight:bold; color:${color}">${estado}</td>
                <td>
                    <span style="color:${color}">${licenciaActual} / 12</span>
                    <div class="contenedor-barra">
                        <div class="barra-progreso" style="width:${porcentaje}%; background:${color}"></div>
                    </div>
                </td>
            </tr>
        `;
    });
}


    
function seguridadAbrirModal() {
    const modal = document.getElementById('login-modal');
    if (modal) modal.style.display = 'block';
}

function verificarSesion() {
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const adminStatus = (typeof esAdmin === 'function') ? esAdmin() : false;
    if (btnLogin && btnLogout) {
        btnLogin.style.display = adminStatus ? 'none' : 'inline-block';
        btnLogout.style.display = adminStatus ? 'inline-block' : 'none';
    } else {
        setTimeout(verificarSesion, 100);
    }
}

async function enviarContacto() {
    const webhookUrl = 'https://discord.com/api/webhooks/1517947890415440045/mSZebdMcmNQpvmE1CafNS2BLLW1j74bOrYQXE8dGt43tN4rylqDvpNCr4KZ68DRDAK9x'; 
    const nombre = document.getElementById('nombre-contacto').value;
    const asunto = document.getElementById('asunto-contacto').value;
    const mensaje = document.getElementById('mensaje-contacto').value;
    if(!nombre || !asunto || !mensaje) { alert("Por favor, rellena todos los campos."); return; }
    const res = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            content: "📢 @admin 📢 **¡Nuevo contacto desde la web!** 📢",
            embeds: [{ title: "📩 Nuevo mensaje", color: 3447003, fields: [{name: "Nombre", value: nombre}, {name: "Asunto", value: asunto}, {name: "Mensaje", value: mensaje}] }]
        })
    });
    if (res.ok) { alert("¡Mensaje enviado!"); document.getElementById('modal-contacto').style.display = 'none'; }
    else { alert("Error al enviar."); }
}
</script>
</body>
</html>
